name: Worker tests

# Runs the Worker's test suite on GitHub's servers, so nothing has to be installed on your computer.
# Start it by hand: Actions tab > "Worker tests" > Run workflow. It also runs when a file in worker/ changes.
# It only reads the repo (no secrets, no deploy, no commits).

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package.json ]; then npm install; fi
          npm install --no-save html-rewriter-wasm
      - name: Run tests
        run: node --test --test-reporter=spec test/*.test.mjs
