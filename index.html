<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>trading journal</title>

<script>(function(){
  // Set the theme AND the favicon synchronously, before the rest of the page's
  // script runs. When this file is served as index.html at a site's root (e.g.
  // "user.github.io/"), some browsers auto-request "/favicon.ico" and cache a
  // blank result for that origin if the <link> tag's icon isn't already in
  // place by the time they look for one; setting it here, immediately, as the
  // very first thing that runs — instead of waiting for setFavicon() near the
  // bottom of the full script — closes that gap. (The link tag has to be set
  // twice: this early pass covers the moment the browser first paints the tab,
  // and setFavicon() later keeps it in sync with in-app theme toggles.)
  var t;try{t=localStorage.getItem("wss_theme")||"dark";}catch(e){t="dark";}
  document.documentElement.setAttribute("data-theme",t);
  var color=t==="dark"?"#B0E0E6":"#4682B4";
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
  var link=document.getElementById("favicon");
  if(link)link.href="data:image/svg+xml,"+encodeURIComponent(svg);
})();</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f7f6f3;--surface:#ffffff;--s2:rgba(120,120,110,0.06);
  --bd:rgba(100,100,92,0.16);--bdm:rgba(100,100,92,0.30);
  --t:#1c1c1a;--t2:#615f5a;--t3:#8b8a83;
  --g:#4E9269;--gbg:rgba(78,146,105,0.12);--gbd:rgba(78,146,105,0.32);
  --r:#C97878;--rbg:rgba(201,120,120,0.12);--rbd:rgba(201,120,120,0.32);
  --a:#BD9142;--abg:rgba(189,145,66,0.14);--abd:rgba(189,145,66,0.34);
  --p:#A47DAB;--pbg:rgba(164,125,171,0.14);--pbd:rgba(164,125,171,0.34);
  --refhead:#7C9EB8;
  --tabdash:#A15B78;--tabdashbg:rgba(161,91,120,0.12);--tabdashbd:rgba(161,91,120,0.32);
  --tablr:#4F7691;--tablrbg:rgba(79,118,145,0.12);--tablrbd:rgba(79,118,145,0.32);
  --mv:#B3677E;--mvbg:rgba(179,103,126,0.12);--mvbd:rgba(179,103,126,0.30);
  --pbsel:#A47DAB;--pbselbg:rgba(164,125,171,0.14);--pbselbd:rgba(164,125,171,0.34);
  --tabdashbg-dd:#ECDEE4;--tablrbg-dd:#DCE4E9;
  --rad:8px;--radl:12px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:var(--sans);
  /* standardized type scale — used everywhere instead of one-off font sizes */
  --fxs:11px;   /* micro labels, uppercase */
  --fsm:12px;   /* secondary / meta / table body */
  --fbase:13px; /* primary body text, inputs, buttons */
  --fmd:15px;   /* sub-headings, emphasized inline values */
  --flg:20px;   /* stat card values */
  --fxl:28px;   /* hero panel values */
  --fh1:26px;   /* page title */
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121214;--surface:#1b1b1e;--s2:rgba(255,255,255,0.045);
  --bd:rgba(255,255,255,0.09);--bdm:rgba(255,255,255,0.16);
  --t:#f0efe9;--t2:#b7b5ad;--t3:#8b8a83;
  --g:#7FCBA0;--gbg:rgba(127,203,160,0.14);--gbd:rgba(127,203,160,0.34);
  --r:#E69A9A;--rbg:rgba(230,154,154,0.14);--rbd:rgba(230,154,154,0.34);
  --a:#E4BD7D;--abg:rgba(228,189,125,0.15);--abd:rgba(228,189,125,0.35);
  --p:#EDC8FF;--pbg:rgba(237,200,255,0.15);--pbd:rgba(237,200,255,0.35);
  --refhead:#E0AFC2;
  --tabdash:#A9C6DE;--tabdashbg:rgba(169,198,222,0.15);--tabdashbd:rgba(169,198,222,0.35);
  --tablr:#E0AFC2;--tablrbg:rgba(224,175,194,0.15);--tablrbd:rgba(224,175,194,0.35);
  --mv:#D9A0B4;--mvbg:rgba(217,160,180,0.14);--mvbd:rgba(217,160,180,0.32);
  --pbsel:#EDC8FF;--pbselbg:rgba(237,200,255,0.15);--pbselbd:rgba(237,200,255,0.35);
  --tabdashbg-dd:#373D44;--tablrbg-dd:#423942;
}
body{font-family:var(--sans);background:var(--bg);color:var(--t);min-height:100vh;font-size:var(--fbase)}
.readonly-mode [data-edit]{display:none!important}
.robadge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;color:var(--mv);margin-left:8px;vertical-align:middle}
.robadge svg{width:16px;height:16px;display:block}
.topicon{height:16px;display:inline-flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:none;border:none;padding:0;color:var(--t2);flex-shrink:0}
.topicon:hover{color:var(--t)}
.topicon svg{width:16px;height:16px;display:block;flex-shrink:0}
.topbaracts{display:flex;align-items:center;gap:10px}
.bacts-slim{opacity:.65}
.bacts-slim .btn{font-size:11px;font-weight:400;padding:5px 10px}
.bacts-slim .btng{font-weight:400}
#app{max-width:1152px;margin:0 auto;padding:2rem 1.25rem 4rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:1.5rem}
.brand{font-size:var(--fxs);color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:var(--fh1);font-weight:600;letter-spacing:-.5px;margin-bottom:4px}
.sub{font-size:var(--fbase);color:var(--t2);margin-bottom:1.75rem}
.themetoggle{width:32px;height:32px;border:none;background:none;color:#ffbf00;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.themetoggle:hover{opacity:.75}
.themetoggle svg{width:18px;height:18px;display:block}
/* Fast custom tooltip — shows immediately on hover via CSS rather than relying on
   the native title attribute, whose browser-controlled delay made it feel like it
   only worked "sometimes". aria-label is kept alongside data-tt as an accessible
   fallback (screen readers only — it renders no visual popup of its own), so this
   is the only visible tooltip; colored to match the dashboard/connected-icon
   mauve (light) / powder-blue (dark) overlay instead of a plain black/white box. */
[data-tt]{position:relative}
[data-tt]::after{content:attr(data-tt);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--tabdashbg);color:var(--tabdash);border:.5px solid var(--tabdashbd);font-size:11px;font-weight:500;line-height:1.3;padding:5px 9px;border-radius:6px;white-space:normal;width:max-content;max-width:240px;text-align:center;opacity:0;pointer-events:none;transition:opacity .1s;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.22)}
[data-tt]:hover::after{opacity:1;transition-delay:.15s}
body.tt-blurred [data-tt]::after{opacity:0!important}
.banner{background:var(--s2);border:.5px solid var(--bd);border-radius:var(--radl);padding:10px 14px;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:var(--fbase);color:var(--t2)}
.banner strong{color:var(--t)}
.bacts{display:flex;gap:6px;flex-wrap:wrap}
.storagebar{font-size:var(--fxs);color:var(--t3)}
/* Period bar */
.periodbar{display:flex;flex-direction:column;margin-bottom:1.5rem}
.pbrow{display:flex;align-items:center;justify-content:center;position:relative;padding:2px 0}
.pbcenter{display:flex;align-items:center;flex-wrap:wrap;justify-content:center}
.pbmodes{display:flex;align-items:center;gap:7px}
.pbtn{padding:3px 9px;border-radius:calc(var(--rad) - 1px);font-size:var(--fsm);font-weight:300;font-family:var(--sans);cursor:pointer;border:.5px solid transparent;color:var(--t2);background:transparent;transition:all .15s}
.pbtn.on{background:var(--pbselbg);color:var(--pbsel);border-color:var(--pbselbd);font-weight:600}
.pbtn:hover:not(.on){color:var(--t)}
.pbsep{font-size:var(--fsm);color:var(--t3);user-select:none}
.pbcount{position:absolute;right:0;font-size:var(--fxs);font-weight:300;color:var(--t3)}
.pbnav{display:flex;align-items:center;gap:5px;margin-left:9px;font-size:var(--fxs);font-weight:300;color:var(--t3)}
.pbarrow{color:var(--t3);cursor:pointer;transition:color .15s;line-height:1;padding:0 2px;margin-right:2px}
.pbarrow:hover{color:var(--t)}
.pblabel{font-size:var(--fxs);font-weight:300;color:var(--t3);margin-right:2px}
.pbtoday{font-size:var(--fxs);font-weight:300;color:var(--p);cursor:pointer;background:none;border:none;padding:0}
.pbtoday:hover{opacity:.8}
.pbcustom{display:flex;align-items:center;gap:6px;margin-top:5px;margin-left:9px}
.pbcustom input{padding:5px 8px;font-size:var(--fxs);font-family:var(--sans);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t)}
.tabs{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:1.5rem}
.tab{padding:6px 14px;border-radius:calc(var(--rad) - 1px);font-size:var(--fbase);font-family:var(--sans);cursor:pointer;border:.5px solid transparent;color:var(--t2);background:transparent;transition:all .15s}
.tab.on{font-weight:600}
.tab.on.tab-dashboard{background:var(--tabdashbg);color:var(--tabdash);border-color:var(--tabdashbd)}
.tab.on.tab-log,.tab.on.tab-reflection{background:var(--tablrbg);color:var(--tablr);border-color:var(--tablrbd)}
.tab:hover:not(.on){color:var(--t)}
.tabsep{color:var(--t3);user-select:none}
.btn{font-family:var(--sans);font-size:var(--fbase);padding:7px 16px;border-radius:var(--rad);border:.5px solid var(--bdm);background:var(--s2);color:var(--t);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--surface)}
.btng{background:var(--gbg);color:var(--g);border-color:var(--gbd);font-weight:600}
.btng:hover{opacity:.85}
/* Form */
.fcard{background:var(--s2);border:.5px solid var(--bd);border-radius:var(--radl);padding:1.25rem;margin-bottom:1.25rem}
.fsec{font-size:var(--fxs);font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:1.1rem 0 10px;padding-top:1rem;border-top:.5px solid var(--bd)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:10px}
.field{display:flex;flex-direction:column}
.field label{font-size:var(--fxs);color:var(--t3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.field input,.field select{width:100%;height:36px;padding:8px 10px;font-family:var(--sans);font-size:var(--fbase);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--t3)}
.mdrow{display:flex;align-items:center;gap:16px;margin:2px 0 12px;flex-wrap:wrap}
.mdlabel{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:var(--fbase);color:var(--t2)}
.mdlabel input{cursor:pointer}
.fillrow{background:var(--surface);border:.5px solid var(--bd);border-radius:var(--rad);padding:10px 10px 0;margin-bottom:8px}
.fillrowhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fillnum{font-size:var(--fxs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.fillrm{background:none;border:none;color:var(--t3);font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.fillrm:hover{color:var(--r)}
.fillsummary{font-size:var(--fxs);color:var(--t2);margin-top:4px}
/* Rules checklist */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:540px){.rgrid{grid-template-columns:1fr}}
.ritem{display:flex;align-items:stretch;border-radius:var(--rad);overflow:hidden;border:.5px solid var(--bd);transition:border-color .15s}
.rlabel{flex:1;padding:9px 11px;font-size:var(--fsm);color:var(--t2);line-height:1.4;background:var(--surface);display:flex;align-items:center;transition:all .15s}
.rbtns{display:flex;flex-direction:column;flex-shrink:0;border-left:.5px solid var(--bd)}
.rbtn{padding:0 12px;font-size:var(--fxs);font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t3);font-family:var(--sans);flex:1;transition:all .15s;white-space:nowrap;min-width:42px}
.rbtn:first-child{border-bottom:.5px solid var(--bd)}
.rbtn:hover{background:var(--s2)}
.rbtn.ayes{background:var(--gbg);color:var(--g)}
.rbtn.ano{background:var(--rbg);color:var(--r)}
.ritem.syes{border-color:var(--gbd)}.ritem.syes .rlabel{background:var(--gbg);color:var(--g)}
.ritem.sno{border-color:var(--rbd)}.ritem.sno .rlabel{background:var(--rbg);color:var(--r)}
.srow{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;background:var(--surface);border:.5px solid var(--bd);border-radius:var(--rad)}
.strack{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;flex:1;max-width:120px}
.sfill{height:100%;border-radius:3px;transition:width .3s}
/* Disqualifiers */
.dqhead{display:flex;justify-content:space-between;align-items:center;margin:1.1rem 0 10px;padding-top:1rem;border-top:.5px solid var(--bd)}
.dqedit{font-size:var(--fxs);color:var(--t3);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:var(--sans)}
.dqedit:hover{color:var(--t)}
.dqlist{display:flex;flex-direction:column;gap:6px}
.dqitem{display:flex;align-items:stretch;border-radius:var(--rad);overflow:hidden;border:.5px solid var(--bd)}
.dqitem.viol{border-color:var(--rbd)}
.dqitem.viol .dqlabel{background:var(--rbg);color:var(--r)}
.dqlabel{flex:1;padding:9px 11px;font-size:var(--fsm);color:var(--t2);line-height:1.4;background:var(--surface);display:flex;align-items:center}
.dqbtns{display:flex;flex-shrink:0;border-left:.5px solid var(--bd)}
.dqbtn{padding:0 14px;font-size:var(--fxs);font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t3);font-family:var(--sans);transition:all .15s;white-space:nowrap}
.dqbtn:first-child{border-right:.5px solid var(--bd)}
.dqbtn.aclean{background:var(--gbg);color:var(--g)}
.dqbtn.aviol{background:var(--rbg);color:var(--r)}
.dqeditrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.dqeditrow input{flex:1;padding:7px 9px;font-size:var(--fsm);font-family:var(--sans);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none}
.dqeditrow input:focus{border-color:var(--t3)}
.dqok{font-size:var(--fxs);color:var(--t3);margin-top:6px}
/* Table */
.lbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding:0 3px;flex-wrap:wrap;gap:8px}
.lcount{font-size:var(--fbase);color:var(--t2)}
.lcountbottom{text-align:right;font-size:var(--fxs);font-weight:300;font-style:italic;color:var(--t3);margin-top:8px}
.empty{text-align:center;padding:3.5rem 1rem;border:.5px solid var(--bd);border-radius:var(--radl);color:var(--t2);font-size:var(--fbase)}
.twrap{overflow-x:auto;border:.5px solid var(--bd);border-radius:var(--radl)}
table{width:100%;border-collapse:collapse;font-size:var(--fsm)}
thead tr{background:var(--s2);border-bottom:.5px solid var(--bd)}
thead th{padding:9px 10px;font-size:var(--fxs);font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;text-align:center}
tbody tr.trow{border-bottom:.5px solid var(--bd);transition:background .1s;cursor:pointer}
tbody tr.trow:last-child{border-bottom:none}
tbody tr.trow:hover{background:var(--s2)}
tr.exprow td{padding:0;border-bottom:.5px solid var(--bd)}
td{padding:10px;vertical-align:middle;white-space:nowrap;text-align:center}
.mono{font-family:var(--mono)}
.pill{display:inline-block;font-size:var(--fxs);padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
.pwin{background:var(--gbg);color:var(--g);border:.5px solid var(--gbd)}
.ploss{background:var(--rbg);color:var(--r);border:.5px solid var(--rbd)}
.pneu{background:var(--s2);color:var(--t2);border:.5px solid var(--bd)}
.pgood{background:var(--gbg);color:var(--g);border:.5px solid var(--gbd)}
.pbad{background:var(--rbg);color:var(--r);border:.5px solid var(--rbd)}
.spill{display:inline-flex;align-items:center;font-size:var(--fxs);font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap;font-family:var(--mono)}
/* Expand panel */
.exppanel{padding:16px 18px;background:var(--s2)}
.expmeta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:var(--fsm);color:var(--t2);margin-bottom:12px;white-space:normal}
.expmeta strong{color:var(--t3);font-weight:600}
.expsub{font-size:var(--fxs);color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 6px;text-align:left}
.expsub:first-of-type{margin-top:0}
.expcomment{font-size:var(--fbase);color:var(--t2);line-height:1.55;background:var(--surface);border:.5px solid var(--bd);border-radius:var(--rad);padding:10px 12px;white-space:pre-wrap;text-align:left}
.expcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
@media(max-width:640px){.expcols{grid-template-columns:1fr}}
.explistrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:.5px solid var(--bd);font-size:var(--fsm);color:var(--t2);white-space:normal}
.explistrow:last-child{border-bottom:none}
.ssgallery{white-space:normal;display:flex;flex-direction:column;gap:12px}
.ssgallery img{width:100%;max-width:100%;height:auto;object-fit:cover;border-radius:var(--rad);border:.5px solid var(--bd);cursor:zoom-in;display:block;transition:opacity .15s}
.ssgallery img:hover{opacity:.85}
/* Lightbox / overlay (reused for image viewer) */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:1.5rem;cursor:zoom-out}
.mover img{max-width:92vw;max-height:92vh;border-radius:10px;cursor:zoom-out}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:1.25rem}
.scard{background:var(--s2);border-radius:var(--rad);padding:10px 14px;min-height:76px;display:flex;flex-direction:column}
.slabel{font-size:calc(var(--fxs) - 2px);color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.sval{font-size:var(--fmd);font-weight:500;font-family:var(--mono);white-space:normal;overflow-wrap:break-word;line-height:1.3;flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.sval-hero{font-size:var(--flg);font-weight:700}
.svalsub{font-size:calc(var(--fxs) - 1px);margin-top:2px;text-align:center;font-weight:400}
.svalbar{width:100%;height:5px;background:var(--surface);border:.5px solid var(--bd);border-radius:3px;overflow:hidden;margin-bottom:6px}
.svalbarfill{height:100%;border-radius:3px;transition:width .3s}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%}
.setuprow .pbody .sval{flex:0 1 auto}
.setuprow .svalsub{margin-top:6px}
.tightsub .pbody .sval{flex:0 1 auto}
.tightsub .svalsub{margin-top:6px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:1.25rem}
.row2col{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:1.25rem}
.row2colEq{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.dashSplit{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-bottom:1.25rem;align-items:stretch}
@media(max-width:760px){.row2col,.row2colEq,.dashSplit{grid-template-columns:1fr}}
.statrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
#dash-stat-col .statrow3:last-child{margin-bottom:0}
.statrow12{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:8px}
.statrow2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:0}
@media(max-width:560px){.statrow3,.statrow12,.statrow2{grid-template-columns:1fr}}

function storageInfo(){
  let bytes=0;
  try{bytes=new Blob([JSON.stringify({trades,reflections,dq})]).size;}catch(e){}
  const mb=bytes/(1024*1024);
  return{bytes,mb};
}
function migrateTrade(t){
  // Legacy trades used two fee fields (feeFixed + feeVariable). Collapse them into
  // the single `fees` total. Platform is unknown for these older trades, so it's
  // set to "other" (manual/fixed) rather than guessing Tradovate or NinjaTrader —
  // that keeps the stored dollar amount from silently changing if the trade is
  // later re-opened and the fee auto-recalculates against today's rate table.
  let fees=t.fees;
  if(fees===undefined){
    const ff=parseFloat(t.feeFixed),fv=parseFloat(t.feeVariable);
    const sum=(isNaN(ff)?0:ff)+(isNaN(fv)?0:fv);
    fees=sum>0?sum.toFixed(2):"";
  }
  return{
    ...t,
    ticker: t.ticker||"",
    entryTime: t.entryTime!==undefined&&t.entryTime!==null?t.entryTime:(t.time||""),
    exitTime: t.exitTime||"",
    direction: t.direction||"long",
    multiDay: !!t.multiDay,
    exitDate: t.exitDate||"",
    exit: t.exit!==undefined?t.exit:"",
    platform: t.platform||"other",
    fees: fees
  };
}
function migrateReflection(r){
  if(r.sections&&r.periodType&&r.periodDate&&r.entryDate)return r;
  const entryDate=r.date||td();
  const periodDate=ymd(startOfWeek(parseYMD(entryDate)));
  const sections=[
    {q:"What setups worked best?",a:r.best||""},
    {q:"Where did I break rules?",a:r.broke||""},
    {q:"What will I improve next?",a:r.improve||""}
  ];
  return{id:r.id||Date.now(),periodType:"week",periodDate,entryDate,sections};
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(d.trades)trades=d.trades.map(migrateTrade);
    if(d.dq&&d.dq.length)dq=d.dq;
    if(Array.isArray(d.reflections)){
      reflections=d.reflections.map(migrateReflection);
    }else if(d.ref&&(d.ref.best||d.ref.broke||d.ref.improve)){
      reflections=[migrateReflection({id:Date.now(),date:td(),best:d.ref.best||"",broke:d.ref.broke||"",improve:d.ref.improve||""})];
    }
  }catch(e){}
}

// ── Date / period helpers ─────────────────────────────────────────────────────
function parseYMD(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function dispDate(s){if(!s)return"—";const p=s.split("-");if(p.length!==3)return s;return `${p[2]}/${p[1]}/${p[0].slice(2)}`;}
function axisDate(s){if(!s)return"";const p=s.split("-");if(p.length!==3)return s;return `${p[2]}/${p[1]}`;}
function startOfWeek(d){const r=new Date(d);r.setHours(0,0,0,0);r.setDate(r.getDate()-r.getDay());return r;}
function endOfWeek(d){const s=startOfWeek(d);const r=new Date(s);r.setDate(r.getDate()+6);r.setHours(23,59,59,999);return r;}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function endOfMonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999);}

function periodRange(){
  if(periodMode==="week"){
    const s=startOfWeek(periodAnchor),e=endOfWeek(periodAnchor);
    const label=s.getMonth()===e.getMonth()
      ?`Week of ${MON[s.getMonth()].slice(0,3)} ${s.getDate()}–${e.getDate()}, ${e.getFullYear()}`
      :`Week of ${MON[s.getMonth()].slice(0,3)} ${s.getDate()} – ${MON[e.getMonth()].slice(0,3)} ${e.getDate()}, ${e.getFullYear()}`;
    return{start:s,end:e,label};
  }
  if(periodMode==="month"){
    const s=startOfMonth(periodAnchor),e=endOfMonth(periodAnchor);
    return{start:s,end:e,label:`${MON[s.getMonth()]} ${s.getFullYear()}`};
  }
  if(periodMode==="custom"){
    if(!customFrom||!customTo)return null;
    const s=parseYMD(customFrom);s.setHours(0,0,0,0);
    const e=parseYMD(customTo);e.setHours(23,59,59,999);
    return{start:s,end:e,label:`${customFrom} to ${customTo}`};
  }
  return null;
}
function periodBoundsForChart(){
  const r=periodRange();
  if(!r)return null;
  return{startT:dateToTime(ymd(r.start)),endT:dateToTime(ymd(r.end))};
}
function isCurrentPeriod(){
  if(periodMode==="week")return ymd(startOfWeek(periodAnchor))===ymd(startOfWeek(new Date()));
  if(periodMode==="month")return periodAnchor.getFullYear()===new Date().getFullYear()&&periodAnchor.getMonth()===new Date().getMonth();
  return true;
}
function getFilteredTrades(){
  const r=periodRange();
  if(!r)return trades.slice();
  return trades.filter(t=>{const d=parseYMD(t.date);return d>=r.start&&d<=r.end;});
}
function pad2(n){return String(n).padStart(2,"0");}
function ddmmyy(d){return `${pad2(d.getDate())}${pad2(d.getMonth()+1)}${String(d.getFullYear()).slice(-2)}`;}
function mmyy(d){return `${pad2(d.getMonth()+1)}${String(d.getFullYear()).slice(-2)}`;}
function exportFileName(ext){
  const r=periodRange();
  let tag;
  if(periodMode==="week")tag=`W${ddmmyy(r.start)}`;
  else if(periodMode==="month")tag=`M${mmyy(r.start)}`;
  else if(periodMode==="custom"&&r)tag=`C${ddmmyy(r.start)}-${ddmmyy(r.end)}`;
  else tag=`A${ddmmyy(new Date())}`;
  return `J.'s TS ${tag}.${ext}`;
}
function setPeriod(mode){

function shiftPeriod(dir){

  if(periodMode==="week")d.setDate(d.getDate()+7*dir);

// ── Time / duration helpers ────────────────────────────────────────────────────
function dtValue(dateStr,timeStr){
  if(!dateStr)return null;
  const d=parseYMD(dateStr);
  if(timeStr){
    const parts=timeStr.split(":").map(Number);
    if(!isNaN(parts[0])&&!isNaN(parts[1]))d.setHours(parts[0],parts[1],0,0);
    else d.setHours(0,0,0,0);
  }else{
    d.setHours(0,0,0,0);
  }
  return d.getTime();
}
function effectiveExitDate(t){return (t.multiDay&&t.exitDate)?t.exitDate:t.date;}
function durationMinutes(t){
  if(!t.entryTime||!t.exitTime)return null;
  const start=dtValue(t.date,t.entryTime);
  const end=dtValue(effectiveExitDate(t),t.exitTime);
  if(start===null||end===null)return null;
  const diff=(end-start)/60000;
  return diff>=0?diff:null;
}
function fdur(min){
  if(min===null||min===undefined||isNaN(min))return"—";
  const h=Math.floor(min/60),m=Math.round(min%60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}

function legacyFillsFor(t){
  const fills=[{id:1,type:"add",price:t.entry,contracts:t.contracts||"1"}];
  if(t.exit){fills.push({id:2,type:"exit",price:t.exit,contracts:t.contracts||"1"});}
  return fills;
}
function computeSegments(fills,initialDirection,initialSetup){
  const segs=[];
  let cur=null;
  function startSeg(direction,setup,isReversal){
    cur={direction,setup:setup||initialSetup,entryFills:[],exitFills:[],openQty:0,isReversal:!!isReversal,triggerFillId:null,reversalFrom:null};
    segs.push(cur);
    return cur;
  }
  (fills||[]).forEach(f=>{
    const qty=parseFloat(f.contracts)||0;
    const price=parseFloat(f.price);
    if(isNaN(price)||qty<=0)return;
    if(!cur)startSeg(initialDirection,initialSetup,false);
    if(f.type!=="exit"){
      cur.entryFills.push({price,qty});
      cur.openQty+=qty;
    }else{
      const closeQty=Math.min(qty,cur.openQty);
      if(closeQty>0){
        cur.exitFills.push({price,qty:closeQty});
        cur.openQty-=closeQty;
      }
      const remainder=qty-closeQty;
      if(remainder>0){
        const prevDirection=cur.direction;
        const newDir=prevDirection==="short"?"long":"short";
        const newSetup=f.segSetup||initialSetup;
        cur=startSeg(newDir,newSetup,true);
        cur.triggerFillId=f.id;
        cur.reversalFrom={prevDirection,closedQty:closeQty,openedQty:remainder};
        cur.entryFills.push({price,qty:remainder});
        cur.openQty+=remainder;
      }
    }
  });
  return segs.map(seg=>{
    const totalEntryQty=seg.entryFills.reduce((s,f)=>s+f.qty,0);
    const closedQty=seg.exitFills.reduce((s,f)=>s+f.qty,0);
    const weightedEntry=totalEntryQty>0?seg.entryFills.reduce((s,f)=>s+f.price*f.qty,0)/totalEntryQty:NaN;
    const weightedExit=closedQty>0?seg.exitFills.reduce((s,f)=>s+f.price*f.qty,0)/closedQty:NaN;
    return{...seg,totalEntryQty,closedQty,weightedEntry,weightedExit};
  });
}
function segmentDollarResult(seg,ti){
  if(!ti||isNaN(seg.weightedEntry)||isNaN(seg.weightedExit)||seg.closedQty<=0)return null;
  const dirPts=seg.direction==="short"?(seg.weightedEntry-seg.weightedExit):(seg.weightedExit-seg.weightedEntry);
  return dirPts*ti.perPoint*seg.closedQty;
}
function tradeSetups(t){
  const segs=computeSegments(t.fills&&t.fills.length?t.fills:legacyFillsFor(t),t.direction||"long",t.setup||"Bounce");
  const out=[];
  segs.forEach(s=>{if(s.setup&&!out.includes(s.setup))out.push(s.setup);});
  return out.length?out:[t.setup].filter(Boolean);
}
function isTradeOpen(t){
  const fills=t.fills&&t.fills.length?t.fills:legacyFillsFor(t);
  const segs=computeSegments(fills,t.direction||"long",t.setup||"Bounce");
  if(!segs.length)return false;
  const last=segs[segs.length-1];
  return last.openQty>0;
}

// ── Calculations ─────────────────────────────────────────────────────────────
function enrich(t){
  const e=parseFloat(t.entry),s=parseFloat(t.stop),tg=parseFloat(t.target),ex=parseFloat(t.exit),r=parseFloat(t.result);
  const ti=tickerInfo(t.ticker);
  const contracts=parseFloat(t.contracts)||1;
  const mult=ti?ti.perPoint*contracts:null;
  const direction=t.direction||"long";
  const riskPts=!isNaN(e)&&!isNaN(s)?Math.abs(e-s):null;
  const rewardPts=!isNaN(e)&&!isNaN(tg)?Math.abs(tg-e):null;
  const risk=riskPts!==null&&mult!==null?riskPts*mult:null;
  const reward=rewardPts!==null&&mult!==null?rewardPts*mult:null;
  const rr=risk&&reward&&risk!==0?reward/risk:null;
  const dirPts=!isNaN(e)&&!isNaN(ex)?(direction==="short"?(e-ex):(ex-e)):null;
  const realizedR=dirPts!==null&&riskPts?dirPts/riskPts:null;
  const wl=!isNaN(r)?(r>0?"Win":r<0?"Loss":"BE"):null;
  const ra=t.ra||{};
  const ans=RULES.filter(x=>ra[x.id]!==null&&ra[x.id]!==undefined);
  const fol=ans.filter(x=>ra[x.id]==="yes");
  const rs=ans.length>0?fol.length/ans.length:null;
  const dqa=t.dqa||{};
  const dqViol=dq.filter(d=>dqa[d.id]===true);
  const isGood=rs!==null?rs>=0.75:null;
  const durationMin=durationMinutes(t);
  const setups=tradeSetups(t); // unique setup tags across all segments, e.g. a reversal trade → ["Reject","Bounce"]
  // Per-leg $ breakdown for reversal trades (e.g. Bounce leg + Break leg) — a
  // single Entry/Exit pair can't represent multiple legs honestly, so this
  // rides along on the enriched trade so both the live app's expanded row and
  // the export's expanded row can render identical "Leg 1 ... Leg 2 ..." lines
  // without each having to reimplement segment math themselves.
  const segs=computeSegments(t.fills&&t.fills.length?t.fills:legacyFillsFor(t),direction,t.setup||"Bounce");
  const segsDisplay=segs.length>1?segs.map(seg=>({direction:seg.direction,setup:seg.setup,dollars:segmentDollarResult(seg,ti)})):null;
  return{...t,direction,ti,riskPts,rewardPts,risk,reward,rr,realizedR,wl,rs,ac:ans.length,fc:fol.length,dqViol,dqViolCount:dqViol.length,isGood,durationMin,setups,segsDisplay};
}

function calcStats(list){
  const n=list.length,wins=list.filter(t=>t.wl==="Win"),losses=list.filter(t=>t.wl==="Loss");
  const wc=wins.length,lc=losses.length,decided=wc+lc,wr=decided>0?wc/decided:null,lr=decided>0?lc/decided:null;
  const aw=wc>0?wins.reduce((a,t)=>a+parseFloat(t.result),0)/wc:null;
  const al=lc>0?Math.abs(losses.reduce((a,t)=>a+parseFloat(t.result),0)/lc):null;
  const rrv=list.filter(t=>t.rr!==null).map(t=>t.rr);
  const ar=rrv.length>0?rrv.reduce((a,b)=>a+b,0)/rrv.length:null;
  const net=list.filter(t=>!isNaN(parseFloat(t.result))).reduce((a,t)=>a+parseFloat(t.result),0);
  const edge=wr!==null&&aw!==null&&lr!==null&&al!==null?wr*aw-lr*al:null;
  const sc=list.filter(t=>t.rs!==null);
  const ep=sc.length>0?sc.reduce((a,t)=>a+t.rs,0)/sc.length:null;
  const durs=list.filter(t=>t.durationMin!==null).map(t=>t.durationMin);
  const adur=durs.length>0?durs.reduce((a,b)=>a+b,0)/durs.length:null;
  const realizedList=list.filter(t=>t.realizedR!==null).map(t=>t.realizedR);
  const arReal=realizedList.length>0?realizedList.reduce((a,b)=>a+b,0)/realizedList.length:null;
  const ruleStats=RULES.map(rule=>{
    const a=list.filter(t=>(t.ra||{})[rule.id]!==null&&(t.ra||{})[rule.id]!==undefined);
    const f=a.filter(t=>(t.ra||{})[rule.id]==="yes");
    return{...rule,pct:a.length>0?f.length/a.length:null};
  });
  const graded=list.filter(t=>t.isGood!==null&&t.wl!==null);
  const gw=graded.filter(t=>t.isGood&&t.wl==="Win").length;
  const gl=graded.filter(t=>t.isGood&&t.wl==="Loss").length;
  const bw=graded.filter(t=>!t.isGood&&t.wl==="Win").length;
  const bl=graded.filter(t=>!t.isGood&&t.wl==="Loss").length;
  const lossesWithCat=losses.filter(t=>t.lossCat);
  const lcStats=LOSSCATS.map(c=>{
    const inCat=lossesWithCat.filter(t=>t.lossCat===c.id);
    const dollars=inCat.reduce((a,t)=>a+Math.abs(parseFloat(t.result)||0),0);
    return{...c,count:inCat.length,pct:lossesWithCat.length>0?inCat.length/lossesWithCat.length:null,dollars};
  });
  const withDq=list.filter(t=>!isNaN(parseFloat(t.result)));
  const violTrades=withDq.filter(t=>t.dqViolCount>0);
  const cleanTrades=withDq.filter(t=>t.dqViolCount===0);
  const violPnl=violTrades.reduce((a,t)=>a+parseFloat(t.result),0);
  const cleanPnl=cleanTrades.reduce((a,t)=>a+parseFloat(t.result),0);
  const violW=violTrades.filter(t=>t.wl==="Win"),violL=violTrades.filter(t=>t.wl==="Loss");
  const cleanW=cleanTrades.filter(t=>t.wl==="Win"),cleanL=cleanTrades.filter(t=>t.wl==="Loss");
  const violGrossWin=violW.reduce((a,t)=>a+parseFloat(t.result),0),violGrossLoss=violL.reduce((a,t)=>a+parseFloat(t.result),0);
  const cleanGrossWin=cleanW.reduce((a,t)=>a+parseFloat(t.result),0),cleanGrossLoss=cleanL.reduce((a,t)=>a+parseFloat(t.result),0);
  const dqStats=dq.map(d=>{
    const a=list.filter(t=>t.dqa&&t.dqa[d.id]!==undefined);
    const v=a.filter(t=>t.dqa[d.id]===true);
    return{...d,violCount:v.length,total:a.length};
  });
  const byDay=aggregateByDay(list);
  const dayEntries=Object.entries(byDay);
  const tradingDays=dayEntries.length;
  const greenDays=dayEntries.filter(([,v])=>v.net>0).length;
  const redDays=dayEntries.filter(([,v])=>v.net<0).length;
  let bestDay=null,worstDay=null;
  dayEntries.forEach(([date,v])=>{
    if(bestDay===null||v.net>bestDay.net)bestDay={date,net:v.net};
    if(worstDay===null||v.net<worstDay.net)worstDay={date,net:v.net};
  });
  return{n,wc,lc,wr,lr,aw,al,ar,net,edge,ep,adur,arReal,ruleStats,gw,gl,bw,bl,lcStats,violTrades:violTrades.length,cleanTrades:cleanTrades.length,violPnl,cleanPnl,
    violW:violW.length,violL:violL.length,violGrossWin,violGrossLoss,cleanW:cleanW.length,cleanL:cleanL.length,cleanGrossWin,cleanGrossLoss,
    dqStats,tradingDays,greenDays,redDays,bestDay,worstDay};
}
function aggregateByDay(list){
  const map={};
  list.forEach(t=>{
    if(!map[t.date])map[t.date]={net:0,count:0};
    const r=parseFloat(t.result);
    if(!isNaN(r))map[t.date].net+=r;
    map[t.date].count++;
  });
  return map;
}
function chronoSort(list){
  return list.slice().sort((a,b)=>{
    const av=dtValue(a.date,a.entryTime||"00:00")||0;
    const bv=dtValue(b.date,b.entryTime||"00:00")||0;
    if(av!==bv)return av-bv;
    return (a.id||0)-(b.id||0);
  });
}
function equityPoints(list){
  const byDay=aggregateByDay(list);
  const days=Object.keys(byDay).sort((a,b)=>parseYMD(a)-parseYMD(b));
  let cum=0;
  const pts=days.map(d=>{cum+=byDay[d].net;return{date:d,cum,count:byDay[d].count};});
  return[{date:null,cum:0,count:0},...pts];
}
function computeStreaks(list){
  const chron=chronoSort(list).filter(t=>t.wl==="Win"||t.wl==="Loss");
  let maxWin=0,maxLoss=0,curWin=0,curLoss=0;
  chron.forEach(t=>{
    if(t.wl==="Win"){curWin++;curLoss=0;if(curWin>maxWin)maxWin=curWin;}
    else{curLoss++;curWin=0;if(curLoss>maxLoss)maxLoss=curLoss;}
  });
  let current=0,type=null;
  for(let i=chron.length-1;i>=0;i--){
    if(type===null){type=chron[i].wl;current=1;}
    else if(chron[i].wl===type)current++;
    else break;
  }
  return{maxWin,maxLoss,current,type};
}
function tickerBreakdown(list){
  const map={};
  list.forEach(t=>{
    const k=t.ticker.toUpperCase();
    if(!map[k])map[k]={ticker:k,count:0,net:0,wins:0,withWl:0,rrSum:0,rrCount:0};
    map[k].count++;
    const r=parseFloat(t.result);

// Produces whole-dollar gridlines at round intervals so the axis never shows
// arbitrary decimals like $565.92, and so the frame only ever moves in whole
// steps rather than sliding on every new trade.
//   · all values >= 0  → floor pinned at exactly 0 (no wasted room below zero)
//   · any value < 0    → headroom added below as well as above
function niceAxis(dataMin,dataMax,targetTicks){

  step=Math.max(1,Math.round(step));
  let niceHi=Math.ceil(hi/step)*step;
  let niceLo=lo<0?Math.floor(lo/step)*step:0;
  if(niceHi<=hi)niceHi+=step;                    // always keep headroom above the peak
  if(lo<0&&niceLo>=lo)niceLo-=step;              // and below the trough, but only if we ever went negative
  const ticks=[];
  for(let v=niceLo;v<=niceHi+0.0001;v+=step)ticks.push(Math.round(v));
  if(ticks.indexOf(0)===-1&&niceLo<0&&niceHi>0)ticks.push(0);
  ticks.sort((a,b)=>a-b);

// Interactive hover for one equity curve wrap element.
function initEquityHover(wrap){
  if(!wrap||wrap.dataset.hoverInit)return;
  wrap.dataset.hoverInit="1";
  let pts;
  try{pts=JSON.parse(decodeURIComponent(wrap.dataset.points));}catch(e){return;}
  if(!pts||!pts.length)return;
  const svg=wrap.querySelector("svg");
  const hitrect=wrap.querySelector(".eq-hitrect");
  const cross=wrap.querySelector(".eq-cross");
  const dot=wrap.querySelector(".eq-dot");
  const tip=wrap.querySelector(".eq-tip");
  if(!svg||!hitrect)return;
  const vb=svg.getAttribute("viewBox").split(" ");
  const vbW=parseFloat(vb[2]),vbH=parseFloat(vb[3]);
  function nearestTo(clientX){
    const rect=svg.getBoundingClientRect();
    const scaleX=vbW/rect.width;
    const localX=(clientX-rect.left)*scaleX;
    let nearest=pts[0],best=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.x-localX);if(d<best){best=d;nearest=p;}});
    return nearest;
  }
  function show(p){
    cross.setAttribute("x1",p.x);cross.setAttribute("x2",p.x);cross.setAttribute("opacity","1");
    dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);dot.setAttribute("opacity","1");
    tip.style.opacity="1";
    tip.style.left=((p.x/vbW)*100)+"%";
    tip.style.top=((p.y/vbH)*100)+"%";
    tip.innerHTML=`<strong>${dispDate(p.date)}</strong> · ${cu(p.val)}`;
  }
  function hide(){cross.setAttribute("opacity","0");dot.setAttribute("opacity","0");tip.style.opacity="0";}
  hitrect.addEventListener("mousemove",e=>show(nearestTo(e.clientX)));
  hitrect.addEventListener("mouseleave",hide);
  hitrect.addEventListener("touchstart",e=>{if(e.touches[0])show(nearestTo(e.touches[0].clientX));},{passive:true});
  hitrect.addEventListener("touchmove",e=>{if(e.touches[0])show(nearestTo(e.touches[0].clientX));},{passive:true});
  hitrect.addEventListener("touchend",hide);
}

// ── Formatters ────────────────────────────────────────────────────────────────
function f2(n){return n===null||isNaN(n)?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function cu(n){if(n===null||isNaN(n))return"—";const a=f2(Math.abs(n));return n<0?`-$${a}`:`$${a}`}
function cuNoSign(n){if(n===null||isNaN(n))return"—";return `$${f2(Math.abs(n))}`}
function pc(n){return n===null||isNaN(n)?"—":`${(n*100).toFixed(1)}%`}
function sc(v){return v===null?"var(--t3)":v>=.8?"var(--g)":v>=.5?"var(--a)":"var(--r)"}
function sbg(v){return v===null?"var(--s2)":v>=.8?"var(--gbg)":v>=.5?"var(--abg)":"var(--rbg)"}
function sbd(v){return v===null?"var(--bd)":v>=.8?"var(--gbd)":v>=.5?"var(--abd)":"var(--rbd)"}
// item 8 — same "DD MMM YY, HH:MM" (24hr) formatter as the main journal's
// connected-account dropdown (item 4), applied here for consistency.
function fmtSyncTime(iso){
  if(!iso)return"—";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"—";
  const dd=String(d.getDate()).padStart(2,"0");
  const mon=MON[d.getMonth()].slice(0,3);
  const yy=String(d.getFullYear()).slice(-2);
  const hh=String(d.getHours()).padStart(2,"0");
  const mi=String(d.getMinutes()).padStart(2,"0");
  return `${dd} ${mon} ${yy}, ${hh}:${mi}`;
}
function esc(s){return (s||"").replace(/</g,"&lt;");}
function escAttr(s){return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
// Wraps case-insensitive matches of `q` inside `s` (already/about-to-be escaped for HTML)
// in <mark>. Escapes `s` itself first, so callers should pass raw text, not pre-escaped text.
function hl(s,q){
  const raw=esc(s||"");
  const query=(q||"").trim();
  if(!query)return raw;
  const re=new RegExp(reEsc(esc(query)),"ig");
  return raw.replace(re,m=>`<mark class="hlmark">${m}</mark>`);
}

// ── Screenshots — resize/compress client-side before storing as base64 ───────
function compressImage(file,maxDim=1280,quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}
        else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>reject(new Error("Could not read image"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}
async function handleScreenshotUpload(evt){
  const files=Array.from(evt.target.files||[]);
  for(const f of files){
    try{
      const dataUrl=await compressImage(f);
      form.screenshots.push({name:f.name,dataUrl});
    }catch(e){/* skip unreadable file */}

  evt.target.value="";

}

      price:priceEl?priceEl.value:f.price,
      contracts:conEl?conEl.value:f.contracts,
      stop:stopEl?stopEl.value:(f.stop||""),
      target:targetEl?targetEl.value:(f.target||"")
    };
  });
}
function addFillRow(){
  syncFillsFromDOM();
  const last=form.fills[form.fills.length-1];
  // auto-copy the previous fill's values into the new row — everything stays editable
  form.fills.push({id:nextFillId(),type:last?last.type:"add",price:last?last.price:"",contracts:last?last.contracts:"1",stop:last?last.stop:"",target:last?last.target:""});
  renderFillsSection();
  refreshRiskPreview();
  recomputeAutoResult();
}
function removeFillRow(id){
  syncFillsFromDOM();
  if(form.fills.length<=1)return;
  form.fills=form.fills.filter(f=>f.id!==id);
  renderFillsSection();
  refreshRiskPreview();
  recomputeAutoResult();
}
function getFillsSummary(){
  syncFillsFromDOM();
  const tkEl=document.getElementById("fi-ticker"),dirEl=document.getElementById("fi-direction");
  const ti=tkEl?tickerInfo(tkEl.value):null;
  const direction=dirEl?dirEl.value:"long";
  const adds=form.fills.filter(f=>f.type!=="exit").map(f=>({price:parseFloat(f.price),contracts:parseFloat(f.contracts)||0})).filter(f=>!isNaN(f.price)&&f.contracts>0);
  const exits=form.fills.filter(f=>f.type==="exit").map(f=>({price:parseFloat(f.price),contracts:parseFloat(f.contracts)||0})).filter(f=>!isNaN(f.price)&&f.contracts>0);
  const totalContracts=adds.reduce((s,f)=>s+f.contracts,0);
  const closedContracts=exits.reduce((s,f)=>s+f.contracts,0);
  const weightedEntry=totalContracts>0?adds.reduce((s,f)=>s+f.price*f.contracts,0)/totalContracts:NaN;
  const weightedExit=closedContracts>0?exits.reduce((s,f)=>s+f.price*f.contracts,0)/closedContracts:NaN;
  const lastAdd=[...form.fills].reverse().find(f=>f.type!=="exit");
  const stop=lastAdd?lastAdd.stop||"":"";
  const target=lastAdd?lastAdd.target||"":"";
  let result=null;
  if(ti&&!isNaN(weightedEntry)&&!isNaN(weightedExit)&&closedContracts>0){
    const dirPts=direction==="short"?(weightedEntry-weightedExit):(weightedExit-weightedEntry);
    result=dirPts*ti.perPoint*closedContracts;
  }
  return{ti,direction,totalContracts,closedContracts,weightedEntry,weightedExit,stop,target,result};
}
function refreshFillsSummary(){
  const c=document.getElementById("fills-summary");
  if(!c)return;
  const s=getFillsSummary();
  if(!s.totalContracts){c.innerHTML="";return;}
  c.innerHTML=`position size <strong>${s.totalContracts}</strong>${!isNaN(s.weightedEntry)?` · avg entry <strong>$${f2(s.weightedEntry)}</strong>`:""}${s.closedContracts>0?` · closed ${s.closedContracts}/${s.totalContracts} @ avg $${f2(s.weightedExit)}`:""}`;
}
function markFeesManual(){feesManual=true;recomputeAutoResult();}
function markPlatformChanged(){
  // Switching platforms means the old auto-computed number (if any) belonged to
  // the previous platform's rate — reset the manual-override flag so it recomputes
  // fresh for the newly-selected platform, unless the person types over it again.
  feesManual=false;
  const plEl=document.getElementById("fi-platform");
  const hintEl=document.getElementById("fi-fees-hint");
  if(hintEl)hintEl.textContent=(plEl&&plEl.value==="other")?"— enter manually":"— exchange + NFA + clearing + commission, auto-calculated";
  recomputeAutoResult();
}
function currentFeeRate(){
  const tkEl=document.getElementById("fi-ticker");
  const plEl=document.getElementById("fi-platform");
  const ticker=tkEl?tkEl.value:form.ticker;
  const platform=plEl?plEl.value:(form.platform||"tradovate");
  if(platform==="other")return null; // manual entry — no table lookup
  const table=FEE_RATES[platform];
  return table?table[ticker]:undefined;
}
function recomputeFees(){
  const feeEl=document.getElementById("fi-fees");
  if(!feeEl||feesManual)return;
  const rate=currentFeeRate();
  if(rate===null)return; // "Other" — leave field as-is, freely editable
  // Every logged fill (add AND exit) is its own billable side — sum contracts
  // across all of them rather than just the entry leg, so partial closes,
  // adds, and reversals all naturally accrue the right number of fee-events.
  const totalUnits=form.fills.reduce((sum,f)=>{
    const q=parseFloat(f.contracts),p=parseFloat(f.price);
    return sum+((!isNaN(q)&&q>0&&!isNaN(p))?q:0);
  },0);
  feeEl.value=(rate!==undefined&&totalUnits>0)?(rate*totalUnits).toFixed(2):"";
}
function getFeesTotal(){
  const feeEl=document.getElementById("fi-fees");
  const v=feeEl?parseFloat(feeEl.value):parseFloat(form.fees);
  return isNaN(v)?0:v;
}
function recomputeAutoResult(){
  refreshFillsSummary();
  if(resultManual)return;
  const resEl=document.getElementById("fi-result");
  if(!resEl)return;
  const s=getFillsSummary();
  if(s.result===null)return;
  resEl.value=s.result.toFixed(2);
}

  const lcMap=Object.fromEntries(LOSSCATS.map(c=>[c.id,c.label]));

    const dc=dq.map(d=>{const a=(t.dqa||{})[d.id];return a===true?"Violated":a===false?"Clean":"";}).join(",");

var EXP_RULES=${rulesJSON};
var EXP_DQ=${dqJSON};
var EXP_LOSSCATS=${losscatsJSON};
var EXP_LCMAP={};EXP_LOSSCATS.forEach(function(c){EXP_LCMAP[c.id]=c.label;});
var EXP_LOG_COLS=12;

function expF2(n){return n===null||n===undefined||isNaN(n)?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function expCuNoSign(n){if(n===null||n===undefined||isNaN(n))return"—";return"$"+expF2(Math.abs(n));}
function expPc(n){return n===null||n===undefined||isNaN(n)?"—":(n*100).toFixed(1)+"%";}
function expSc(v){return v===null||v===undefined?"var(--t3)":v>=.8?"var(--g)":v>=.5?"var(--a)":"var(--r)";}
function expSbg(v){return v===null||v===undefined?"var(--s2)":v>=.8?"var(--gbg)":v>=.5?"var(--abg)":"var(--rbg)";}
function expSbd(v){return v===null||v===undefined?"var(--bd)":v>=.8?"var(--gbd)":v>=.5?"var(--abd)":"var(--rbd)";}
function expEsc(s){return(s||"").replace(/</g,"&lt;");}
function expReEsc(s){return s.replace(/[.*+?^\${}()|[\]\\]/g,"\\$&");}
function expHl(s,q){
  var raw=expEsc(s||"");
  var query=(q||"").trim();
  if(!query)return raw;
  var re=new RegExp(expReEsc(expEsc(query)),"ig");
  return raw.replace(re,function(m){return'<mark class="hlmark">'+m+'</mark>';});
}
function expDispDate(s){if(!s)return"—";var p=s.split("-");if(p.length!==3)return s;return p[2]+"/"+p[1]+"/"+p[0].slice(2);}
function expFdur(min){if(min===null||min===undefined||isNaN(min))return"—";var h=Math.floor(min/60),m=Math.round(min%60);return h>0?h+"h "+m+"m":m+"m";}
function expFillsH(fills){
  var addIdx=0,exitIdx=0;
  return fills.map(function(f){
    if(f.type==="exit"){
      exitIdx++;
      return'<span><strong>Exit ('+exitIdx+')</strong> $'+expF2(parseFloat(f.price))+(f.contracts?' · '+f.contracts+' ct':'')+'</span>';
    }
    addIdx++;
    var stopV=f.stop?('$'+expF2(parseFloat(f.stop))):"—";
    var targetV=f.target?('$'+expF2(parseFloat(f.target))):"—";
    return'<span><strong>Entry ('+addIdx+')</strong> $'+expF2(parseFloat(f.price))+(f.contracts?' · '+f.contracts+' ct':'')+'</span><span><strong>Stop</strong> '+stopV+'</span><span><strong>Target</strong> '+targetV+'</span>';
  }).join("");
}
function expUniqueTickers(){var s={};EXP_TRADES.forEach(function(t){s[(t.ticker||"").toUpperCase()]=1;});return Object.keys(s).sort();}
function expUniqueSetups(){var s={};EXP_TRADES.forEach(function(t){(t.setups||[t.setup]).forEach(function(su){if(su)s[su]=1;});});return Object.keys(s).sort();}
function expSetupAbbr(su){return su==="Bounce"?"B":su==="Reject"?"R":su==="Break"?"Br":su;}
function expSearchMatch(t){
  // Matches everything in a trade, not just the columns visible in the collapsed
  // row — comments only show once a row is expanded, but search still needs to
  // find them without opening every row first.
  var q=expSearchQuery.trim().toLowerCase();
  if(!q)return true;
  var lc=t.lossCat?(EXP_LCMAP[t.lossCat]||""):"";
  var hay=[t.ticker].concat(t.setups||[t.setup]).concat([t.wl,t.direction,expDispDate(t.date),t.comments,lc]).filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(q)!==-1;
}
function expApplyLogFilters(list){
  return list.filter(function(t){
    var tsetups=t.setups||[t.setup];
    if(expLogFilters.ticker.length&&expLogFilters.ticker.indexOf((t.ticker||"").toUpperCase())===-1)return false;
    if(expLogFilters.setup.length&&!tsetups.some(function(su){return expLogFilters.setup.indexOf(su)!==-1;}))return false;
    if(expLogFilters.wl.length&&expLogFilters.wl.indexOf(t.wl)===-1)return false;
    if(expLogFilters.process.length){
      if(t.isGood===null||t.isGood===undefined)return false;
      var procVal=t.isGood?"good":"bad";
      if(expLogFilters.process.indexOf(procVal)===-1)return false;
    }
    if(expLogFilters.lossCat.length&&expLogFilters.lossCat.indexOf(t.lossCat)===-1)return false;
    if(!expSearchMatch(t))return false;
    return true;
  });
}
function expApplyLogSort(list){
  var col=expLogSort.col,dir=expLogSort.dir,mult=dir==="asc"?1:-1;
  function val(t){
    switch(col){
      case"date":return t.date||"";
      case"ticker":return t.ticker?t.ticker.toUpperCase():"";
      case"setup":return t.setup||"";
      case"result":{var r=parseFloat(t.result);return isNaN(r)?-Infinity:r;}
      case"wl":return t.wl||"";
      case"rules":return(t.rs===null||t.rs===undefined)?-1:t.rs;
      case"process":return(t.isGood===null||t.isGood===undefined)?-1:(t.isGood?1:0);
      default:return t.date||"";
    }
  }
  return list.slice().sort(function(a,b){
    var av=val(a),bv=val(b);
    if(av<bv)return-1*mult;
    if(av>bv)return 1*mult;
    return(b.date||"").localeCompare(a.date||"");
  });
}
function expSetLogSort(col){
  if(expLogSort.col===col){expLogSort.dir=expLogSort.dir==="asc"?"desc":"asc";}
  else{expLogSort.col=col;expLogSort.dir=col==="date"?"desc":"asc";}

}
function expHasLogFilters(){return Object.keys(expLogFilters).some(function(k){return expLogFilters[k].length>0;});}
function expClearLogFilters(){expLogFilters={ticker:[],setup:[],wl:[],process:[],lossCat:[]};renderExpLog();}
// Button-style multi-select filter dropdowns, matching the main journal.
function expToggleLogFilterDropdown(key,ev){
  if(ev)ev.stopPropagation();
  expLogFilterOpen=expLogFilterOpen===key?null:key;
  renderExpLog();
}
function expToggleLogFilterValue(key,val,ev){
  if(ev)ev.stopPropagation();
  var cur=expLogFilters[key];
  var i=cur.indexOf(val);
  if(i===-1)cur.push(val);else cur.splice(i,1);
  renderExpLog();
}
function expClearOneLogFilter(key,ev){
  if(ev)ev.stopPropagation();
  expLogFilters[key]=[];
  renderExpLog();
}
function expCloseLogFilterDropdown(){if(expLogFilterOpen){expLogFilterOpen=null;renderExpLog();}}
function expCountForFilterOption(key,val,list){
  return list.filter(function(t){
    var tsetups=t.setups||[t.setup];
    if(key!=="ticker"&&expLogFilters.ticker.length&&expLogFilters.ticker.indexOf((t.ticker||"").toUpperCase())===-1)return false;

    if(key!=="wl"&&expLogFilters.wl.length&&expLogFilters.wl.indexOf(t.wl)===-1)return false;

var EQ_DAY_STEPS=[1,2,3,5,7,14,21,28,45,60,90];
var EQ_MONTH_STEPS=[1,2,3,6,12,24,36,60];

function eqFitsInMargins(x,label,padL,plotW,anchor){
  var w=estLabelWidth(label);

  if(anchor==="end")return x-w>=padL-0.5 && x<=padL+plotW+0.5;

// comes from the interior ticks alone (finest nice step whose own ticks
// don't crowd each other); only the individual interior tick nearest an
// edge gets dropped if it crowds that edge's label, instead of throwing
// out the whole step over one bad neighbor.
function buildAdaptiveDateTicks(periodStartTime,periodEndTime,plotW,padL){
  var totalSpanMs=Math.max(1,periodEndTime-periodStartTime);
  function xOf(t){
    var frac=Math.min(1,Math.max(0,(t-periodStartTime)/totalSpanMs));
    return padL+frac*plotW;
  }
  var zone=getAxisFormatZone(totalSpanMs/EQ_DAY_MS);
  var isDay=zone==="day",isMonth=zone==="month";
  var fmtFn=isDay?fmtAxisDate:(isMonth?fmtAxisMonth:fmtAxisQuarter);
  var steps=isDay?EQ_DAY_STEPS:(isMonth?EQ_MONTH_STEPS:EQ_QUARTER_STEPS);
  function label(t){return fmtFn(timeToDateStr(t));}

  var idxToTime,periodEndIdx;
  if(isDay){
    idxToTime=function(idx){return periodStartTime+idx*EQ_DAY_MS;};
    periodEndIdx=Math.round(totalSpanMs/EQ_DAY_MS);
  }else{
    var startD=new Date(periodStartTime),baseY=startD.getFullYear(),baseM=startD.getMonth();
    var unit=isMonth?1:3;
    idxToTime=function(idx){return new Date(baseY,baseM+idx*unit,1).getTime();};
    var endD=new Date(periodEndTime);
    periodEndIdx=Math.round(((endD.getFullYear()-baseY)*12+(endD.getMonth()-baseM))/unit);
  }

  function interiorForStep(step){
    var out=[];
    for(var idx=step;idx<periodEndIdx;idx+=step){

    for(var k=0;k<interior.length-1;k++)if(!eqPairFits(interior[k],interior[k+1]))return true;
    return false;
  }
  var chosenInterior=[];
  for(var si=0;si<steps.length;si++){
    var interior=interiorForStep(steps[si]);
    if(!interiorOverlaps(interior)){chosenInterior=interior;break;}
  }

  var startTick={x:padL,label:label(periodStartTime),anchor:"start"};
  var endTick=periodEndIdx>0?{x:padL+plotW,label:label(periodEndTime),anchor:"end"}:null;
  var kept=chosenInterior.slice();
  if(kept.length&&!eqPairFits(startTick,kept[0]))kept.shift();
  if(endTick&&kept.length&&!eqPairFits(kept[kept.length-1],endTick))kept.pop();

}

function niceAxis(dataMin,dataMax,targetTicks){
  targetTicks=targetTicks||4;

  if(hi===lo)hi=lo+100;
  var rawStep=(hi-lo)/targetTicks;
  var mag=Math.pow(10,Math.floor(Math.log10(Math.abs(rawStep)||1)));
  var norm=rawStep/mag;
  var step=(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
  step=Math.max(1,Math.round(step));
  var niceHi=Math.ceil(hi/step)*step;
  var niceLo=lo<0?Math.floor(lo/step)*step:0;
  if(niceHi<=hi)niceHi+=step;
  if(lo<0&&niceLo>=lo)niceLo-=step;
  var ticks=[];
  for(var v=niceLo;v<=niceHi+0.0001;v+=step)ticks.push(Math.round(v));

      cross=wrap.querySelector(".eq-cross"),dot=wrap.querySelector(".eq-dot"),tip=wrap.querySelector(".eq-tip");
  if(!svg||!hitrect)return;
  var vb=svg.getAttribute("viewBox").split(" ");
  var vbW=parseFloat(vb[2]),vbH=parseFloat(vb[3]);
  function nearestTo(clientX){
    var rect=svg.getBoundingClientRect(),scaleX=vbW/rect.width,localX=(clientX-rect.left)*scaleX;
    var nearest=pts[0],best=Infinity;
    pts.forEach(function(p){var d=Math.abs(p.x-localX);if(d<best){best=d;nearest=p;}});
    return nearest;

    cross.setAttribute("x1",p.x);cross.setAttribute("x2",p.x);cross.setAttribute("opacity","1");
    dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);dot.setAttribute("opacity","1");

  hitrect.addEventListener("mouseleave",hide);
  hitrect.addEventListener("touchstart",function(e){if(e.touches[0])show(nearestTo(e.touches[0].clientX));},{passive:true});
  hitrect.addEventListener("touchmove",function(e){if(e.touches[0])show(nearestTo(e.touches[0].clientX));},{passive:true});

// ── Partial refresh — leveraged risk preview ──────────────────────────────────
function refreshRiskPreview(){
  const container=document.getElementById("risk-preview");
  if(!container)return;
  const s=getFillsSummary();
  const stopNum=parseFloat(s.stop),targetNum=parseFloat(s.target);
  if(!s.ti||isNaN(s.weightedEntry)||(isNaN(stopNum)&&isNaN(targetNum))){
    container.innerHTML=`<div style="font-size:var(--fxs);color:var(--t3);margin-top:8px">enter entry + stop/target to preview leveraged $ risk</div>`;
    return;
  }
  const contracts=s.totalContracts||1;
  const mult=s.ti.perPoint*contracts;
  const riskPts=!isNaN(stopNum)?Math.abs(s.weightedEntry-stopNum):null;
  const rewardPts=!isNaN(targetNum)?Math.abs(targetNum-s.weightedEntry):null;
  const risk=riskPts!==null?riskPts*mult:null;
  const reward=rewardPts!==null?rewardPts*mult:null;
  const rr=risk&&reward&&risk!==0?reward/risk:null;
  let realizedLine="";
  if(s.closedContracts>0&&!isNaN(s.weightedExit)&&riskPts){
    const dirPts=s.direction==="short"?(s.weightedEntry-s.weightedExit):(s.weightedExit-s.weightedEntry);
    const realizedR=dirPts/riskPts;
    const realizedDollar=dirPts*s.ti.perPoint*s.closedContracts;
    realizedLine=`<br/>closed ${s.closedContracts}/${contracts} → realized <strong style="color:${realizedDollar>=0?"var(--g)":"var(--r)"}">${cu(realizedDollar)}</strong> (${f2(realizedR)}:1 of planned risk)`;
  }
  container.innerHTML=`<div class="eform" style="margin-top:8px">
    ${s.ti.symbol} · $${f2(s.ti.perPoint)}/pt × ${contracts} contract${contracts===1?"":"s"} (position size) · tick $${f2(s.ti.tickDollar)}<br/>
    avg entry <strong>$${f2(s.weightedEntry)}</strong><br/>
    ${risk!==null?`<span style="color:var(--r)">risk ${cu(-risk)}</span>`:""}${risk!==null&&reward!==null?" · ":""}${reward!==null?`<span style="color:var(--g)">reward ${cu(reward)}</span>`:""}${rr!==null?` · <strong>${f2(rr)}:1</strong>`:""}${realizedLine}
  </div>`;
}

function calendarH(en,opts){

    const lbl=label!==undefined?label:String(dObj.getDate());
    return`<div class="calcell ${cls}"><span class="caldate">${lbl}</span>${info?`<div><div class="calpnl">${cu(info.net)}</div><div class="calcnt">${info.count} trade${info.count!==1?"s":""}</div></div>`:""}</div>`;
  }

    let net=0,count=0;

    const cls=count===0?"neutral":net>0?"win":net<0?"loss":"neutral";
    return`<div class="calcell total ${cls}"><span class="caldate">Total</span>${count>0?`<div><div class="calpnl">${cu(net)}</div><div class="calcnt">${count} trade${count!==1?"s":""}</div></div>`:""}</div>`;
  }

    let week=new Array(leadBlank).fill(null);
    for(let day=1;day<=daysInMonth;day++){
      week.push(new Date(s.getFullYear(),s.getMonth(),day));
      if(week.length===7){rowsHtml+=week.map(d=>cellFor(d)).join("")+totalCell(week);week=[];}
    }

  }else{
    // Sun–Fri only (6 columns) — no Saturday session, so no Saturday column.

function countForFilterOption(key,val,list){
  return list.filter(t=>{
    if(key!=="ticker"&&logFilters.ticker.length&&!logFilters.ticker.includes((t.ticker||"").toUpperCase()))return false;
    if(key!=="setup"&&logFilters.setup.length&&!logFilters.setup.includes(t.setup))return false;
    if(key!=="wl"&&logFilters.wl.length&&!logFilters.wl.includes(t.wl))return false;
    if(key!=="process"&&logFilters.process.length){
      if(t.isGood===null||t.isGood===undefined)return false;
      const procVal=t.isGood?"good":"bad";
      if(!logFilters.process.includes(procVal))return false;
    }
    if(key!=="lossCat"&&logFilters.lossCat.length&&!logFilters.lossCat.includes(t.lossCat))return false;
    if(!logSearchMatch(t))return false;
    switch(key){
      case"ticker":return(t.ticker||"").toUpperCase()===val;
      case"setup":return t.setup===val;
      case"wl":return t.wl===val;
      case"process":return t.isGood!==null&&t.isGood!==undefined&&(t.isGood?"good":"bad")===val;

function logSearchMatch(t){
  // Matches everything in a trade, not just the columns visible in the collapsed
  // row — comments/notes only show once a row is expanded, but search still
  // needs to find them without the user opening every row first.
  const q=logSearchQuery.trim().toLowerCase();
  if(!q)return true;
  const lc=t.lossCat?LOSSCATS.find(c=>c.id===t.lossCat):null;
  const hay=[t.ticker,...(t.setups||[t.setup]),t.wl,t.direction,dispDate(t.date),t.comments,lc?lc.label:""].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}
function applyLogFilters(list){
  return list.filter(t=>{
    if(logFilters.ticker.length&&!logFilters.ticker.includes(t.ticker.toUpperCase()))return false;
    if(logFilters.setup.length&&!logFilters.setup.includes(t.setup))return false;
    if(logFilters.wl.length&&!logFilters.wl.includes(t.wl))return false;
    if(logFilters.process.length){
      if(t.isGood===null)return false;
      const procVal=t.isGood?"good":"bad";
      if(!logFilters.process.includes(procVal))return false;
    }
    if(logFilters.lossCat.length&&!logFilters.lossCat.includes(t.lossCat))return false;
    if(!logSearchMatch(t))return false;
    return true;
  });
}
function applyLogSort(list){
  const{col,dir}=logSort,mult=dir==="asc"?1:-1;
  const val=t=>{
    switch(col){
      case"date":return t.date||"";
      case"ticker":return t.ticker?t.ticker.toUpperCase():"";
      case"setup":return t.setup||"";
      case"result":{const r=parseFloat(t.result);return isNaN(r)?-Infinity:r;}
      case"wl":return t.wl||"";
      case"rules":return t.rs===null?-1:t.rs;
      case"process":return t.isGood===null?-1:(t.isGood?1:0);
      default:return t.date||"";
    }
  };
  return list.slice().sort((a,b)=>{
    const av=val(a),bv=val(b);
    if(av<bv)return-1*mult;
    if(av>bv)return 1*mult;
    return(b.date||"").localeCompare(a.date||""); // stable secondary: newest first
  });
}

    statCard(title,cu(s.net),netColor),

function toggleReflectionExpand(id){
  if(refCollapsedIds.has(id))refCollapsedIds.delete(id);else refCollapsedIds.add(id);
  render();
}
function toggleAllReflections(){
  const list=getFilteredReflections().filter(refSearchMatch);
  const anyExpanded=list.some(r=>!refCollapsedIds.has(r.id));
  if(anyExpanded)list.forEach(r=>refCollapsedIds.add(r.id));
  else list.forEach(r=>refCollapsedIds.delete(r.id));
  render();
}
function toggleRefSearch(ev){
  if(ev)ev.stopPropagation();
  refSearchOpen=!refSearchOpen;
  refSearchLocked=false;
  refSearchNavIndex=-1;
  refSearchCurrentId=null;
  if(!refSearchOpen)refSearchQuery="";
  render();
  if(refSearchOpen){
    requestAnimationFrame(()=>{const el=document.getElementById("refsearch-input");if(el)el.focus();});
  }
}
function closeRefSearch(){
  if(!refSearchOpen)return;
  refSearchOpen=false;refSearchQuery="";refSearchLocked=false;refSearchNavIndex=-1;refSearchCurrentId=null;
  render();
}
function onRefSearchInput(el){
  refSearchQuery=el.value;
  refSearchNavIndex=-1;
  refSearchCurrentId=null;
  const pos=el.selectionStart;
  render();
  requestAnimationFrame(()=>{
    const ni=document.getElementById("refsearch-input");
    if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}
  });
}
function onRefSearchKeydown(ev){
  if(ev.key==="Enter"){ev.preventDefault();refSearchLocked=true;refSearchNav(ev.shiftKey?-1:1,ev);}
  else if(ev.key==="Escape"){ev.preventDefault();closeRefSearch();}
}
function currentRefSearchMatches(){
  if(!refSearchQuery.trim())return[];
  return getFilteredReflections().filter(refSearchMatch);
}
function refSearchNav(dir,ev){
  if(ev)ev.stopPropagation();
  const list=currentRefSearchMatches();
  if(!list.length)return;
  if(refSearchNavIndex<0)refSearchNavIndex=dir>0?0:list.length-1;
  else refSearchNavIndex=(refSearchNavIndex+dir+list.length)%list.length;
  const r=list[refSearchNavIndex];
  if(!r)return;
  refSearchCurrentId=r.id;
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById(`reflectionrow-${r.id}`);
    if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
    const input=document.getElementById("refsearch-input");
    if(input)input.focus();
  });
}
function refSearchMatch(r){
  // Matches header label, entry date, and every section's question/answer text —
  // not just what's visible without scrolling — same principle as logSearchMatch.
  const q=refSearchQuery.trim().toLowerCase();
  if(!q)return true;
  const hay=[refHeaderLabel(r),ddmmyy(parseYMD(r.entryDate)),...nonEmptySections(r).flatMap(s=>[s.q,s.a])].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}

  const list=getFilteredReflections().filter(refSearchMatch);

<div class="lbar${refSearchOpen?" sticky-search":""}">

    <span class="iconsep">|</span>`:""}

      :`<button class="topicon" onclick="toggleRefSearch(event)" aria-label="search reflections" data-tt="search reflections">${ICON_SEARCH}</button>`}
    </span>
    <span class="iconsep" data-edit="1">|</span>
    <button class="topicon" data-edit="1" onclick="toggleRefForm()" aria-label="${showRefForm?"cancel":"add reflection"}" data-tt="${showRefForm?"cancel":"add reflection"}">${showRefForm?ICON_X:ICON_PLUS}</button>

  <div class="fgrid" style="max-width:460px;margin-bottom:20px">
    ${refForm.periodType==="week"
      ?`<div class="field"><label>week containing</label><input id="rf-weekdate" type="date" value="${refForm.periodDate}" onchange="updateRefPeriodDate()"/></div>`
      :`<div class="field"><label>month</label><input id="rf-monthdate" type="month" value="${refForm.periodDate.slice(0,7)}" onchange="updateRefPeriodDate()"/></div>`}
    <div class="field"><label>entry date</label><input id="rf-entrydate" type="date" value="${refForm.entryDate}" onchange="updateRefPeriodDate()"/></div>
  </div>
  <div style="font-size:var(--fxs);color:var(--refhead);font-weight:700;letter-spacing:.05em;margin-bottom:16px">${refHeaderLabel(refForm)}</div>
  ${refForm.sections.map((s,i)=>`
  <div style="margin-bottom:12px">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input id="rf-sq-${i}" value="${escAttr(s.q)}" placeholder="question / section title" style="flex:1;height:34px;padding:8px 10px;font-family:var(--sans);font-size:var(--fbase);font-weight:600;border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none"/>
      <button class="delbtn" onclick="removeRefSection(${i})" title="remove section">×</button>
    </div>
    <textarea id="rf-sa-${i}" rows="2" placeholder="write your thoughts here...">${esc(s.a)}</textarea>
  </div>`).join("")}
  <button class="btn" style="margin-bottom:14px" onclick="addRefSection()">+ add section</button>
  <div>
    <button class="btn btng" onclick="saveReflection()">${editingRefId!==null?"save changes":"save reflection"}</button>
  </div>
</div>`:""}

${reflections.length===0
  ?`<div class="empty"><div style="font-size:28px;margin-bottom:8px">📝</div><p>no reflections yet — jot down your first weekly reflection above</p></div>`
  :filteredOut
  ?`<div class="empty"><div style="font-size:28px;margin-bottom:8px">🗓️</div><p>no reflections in this period — try a different week/month or switch back to "All"</p></div>`
  :(preSearchList.length>0&&list.length===0)
  ?`<div class="empty"><div style="font-size:28px;margin-bottom:8px">🔍</div><p>no reflections match your search</p></div>`
  :list.map(r=>{
    const secs=nonEmptySections(r);
    const isCurrent=refSearchOpen&&r.id===refSearchCurrentId;
    // A search match auto-opens even if manually collapsed, same logic as the
    // trade log's search-driven auto-expand.
    const isCollapsed=refCollapsedIds.has(r.id)&&!isCurrent;
    return `
<div class="fcard${isCurrent?" fcard-current":""}" id="reflectionrow-${r.id}" style="margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;${isCollapsed?"":"margin-bottom:18px;"}cursor:pointer" onclick="toggleReflectionExpand(${r.id})">
    <span style="font-size:var(--fsm);color:var(--refhead);font-weight:700;letter-spacing:.03em">${hl(refHeaderLabel(r),refSearchQuery)}</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:var(--fxs);color:var(--t3);font-style:italic">entry date: ${hl(ddmmyy(parseYMD(r.entryDate)),refSearchQuery)}</span>
      <div style="display:flex;gap:2px" onclick="event.stopPropagation()">
        <button class="delbtn" data-edit="1" onclick="editReflection(${r.id})" title="edit reflection">✎</button>
        <button class="delbtn" data-edit="1" onclick="delReflection(${r.id})" title="delete reflection">×</button>
      </div>
    </div>
  </div>
  ${isCollapsed?"":secs.map((s,i)=>`<div style="${i<secs.length-1?"margin-bottom:14px;padding-bottom:14px;border-bottom:.5px solid var(--bd)":""}">
    <div class="refq" style="margin-bottom:6px">${hl(s.q,refSearchQuery)}</div>
    <div style="font-size:var(--fbase);color:var(--t2);line-height:1.5">${pWrap(s.a,refSearchQuery)}</div>
  </div>`).join("")}
</div>`;
  }).join("")}
</div>`;
}

// ── Boot (read-only: load from the shared Google Drive mirror) ─────────────────
let driveModifiedTime=null;  // Drive's own modifiedTime for the mirror file, shown as "last synced"
let driveStaleBanner="";     // set when we're showing a cached copy instead of a fresh Drive fetch

function loadDriveCache(){
  try{
    const raw=localStorage.getItem(DRIVE_CACHE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null;}
}
function saveDriveCache(fileId,data,modifiedTime){
  try{
    localStorage.setItem(DRIVE_CACHE_KEY,JSON.stringify({fileId,data,modifiedTime,cachedAt:new Date().toISOString()}));
  }catch(e){} // best-effort — a full/blocked localStorage just means no fallback next time, nothing fatal now
}
// Bug-2 fix: resolve the mirror's *current* file ID by listing the one public
// folder it's kept in, instead of trusting a hardcoded ID that can silently
// go stale if journal.html ever recreates the mirror.
async function resolveMirrorFileId(){
  const q=`'${DRIVE_MIRROR_FOLDER_ID}' in parents and name='${DRIVE_MIRROR_NAME}' and trashed=false`;
  const url=`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,modifiedTime)&key=${DRIVE_API_KEY}`;
  const res=await fetch(url);
  if(!res.ok)throw new Error("folder lookup failed: "+res.status);
  const d=await res.json();
  if(!d.files||!d.files.length)throw new Error("mirror file not found in shared folder");
  return d.files[0]; // {id, modifiedTime}
}
async function fetchMirrorContent(fileId){
  const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${DRIVE_API_KEY}`);
  if(!res.ok)throw new Error("Drive fetch failed: "+res.status);
  return res.json();
}
async function fetchMirrorModifiedTime(fileId){
  try{
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime&key=${DRIVE_API_KEY}`);
    if(!res.ok)return null;
    const meta=await res.json();
    return meta.modifiedTime||null;
  }catch(e){return null;} // non-fatal — "last synced" just falls back to "—"
}

async function loadFromDrive(){
  document.getElementById("app").innerHTML=`<div style="padding:3rem;text-align:center;color:var(--t2);font-weight:300;font-size:var(--fsm);font-style:italic">loading viewer journal...</div>`;
  const cache=loadDriveCache();
  let resolvedId=null,data=null,modifiedTime=null,usedFallback=false;

  // Tier 1 — normal path: resolve the current file ID via the public folder, fetch fresh
  try{
    const found=await resolveMirrorFileId();
    resolvedId=found.id;
    data=await fetchMirrorContent(resolvedId);
    modifiedTime=found.modifiedTime||await fetchMirrorModifiedTime(resolvedId);
  }catch(e1){
    console.log("[drive] folder lookup failed, trying last-known file id:",e1.message||e1);
    // Tier 2 — folder lookup itself failed (network blip, folder unshared, quota):
    // try the last file ID we successfully resolved before, direct
    if(cache&&cache.fileId){
      try{
        data=await fetchMirrorContent(cache.fileId);
        resolvedId=cache.fileId;
        modifiedTime=await fetchMirrorModifiedTime(cache.fileId);
      }catch(e2){
        console.log("[drive] last-known file id fetch also failed:",e2.message||e2);
      }
    }
  }

  if(!data&&cache&&cache.data){
    // Tier 3 — nothing live worked at all: fall back to the last cached payload
    data=cache.data;
    modifiedTime=cache.modifiedTime||null;
    usedFallback=true;
    driveStaleBanner=`showing data as of ${fmtSyncTime(cache.cachedAt)} — couldn't refresh from Drive.`;
  }else{
    driveStaleBanner="";
  }

  if(!data){
    // Tier 4 — nothing live, no cache either
    document.getElementById("app").innerHTML=`<div style="padding:3rem;text-align:center;color:var(--r)">Couldn't load the shared journal right now.<br/><span style="color:var(--t3);font-size:var(--fsm)">No cached copy is available on this device yet — try again shortly.</span></div>`;
    return;
  }

  if(Array.isArray(data.trades))trades=data.trades.map(migrateTrade);
  if(data.dq&&data.dq.length)dq=data.dq;
  if(Array.isArray(data.reflections))reflections=data.reflections.map(migrateReflection);
  driveModifiedTime=modifiedTime;

  if(!usedFallback&&resolvedId)saveDriveCache(resolvedId,data,modifiedTime); // only refresh the cache on a genuinely fresh load

  document.body.classList.add("readonly-mode");
  render();
}
setFavicon();
loadFromDrive();
</script>
