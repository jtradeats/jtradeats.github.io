<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f7f6f3;--surface:#ffffff;--s2:rgba(120,120,110,0.06);
  --bd:rgba(100,100,92,0.16);--bdm:rgba(100,100,92,0.30);
  --t:#1c1c1a;--t2:#615f5a;--t3:#8b8a83;
  --g:#4E9269;--gbg:rgba(78,146,105,0.12);--gbd:rgba(78,146,105,0.32);
  --r:#C97878;--rbg:rgba(201,120,120,0.12);--rbd:rgba(201,120,120,0.32);
  --a:#BD9142;--abg:rgba(189,145,66,0.14);--abd:rgba(189,145,66,0.34);
  --p:#A47DAB;--pbg:rgba(164,125,171,0.14);--pbd:rgba(164,125,171,0.34);
  --refhead:#7C9EB8;
  --tabdash:#A15B78;--tabdashbg:rgba(161,91,120,0.12);--tabdashbd:rgba(161,91,120,0.32);
  --tablr:#4F7691;--tablrbg:rgba(79,118,145,0.12);--tablrbd:rgba(79,118,145,0.32);
  --tabdashbg-dd:#ECDEE4;--tablrbg-dd:#DCE4E9;
  --pbsel:#A47DAB;--pbselbg:rgba(164,125,171,0.14);--pbselbd:rgba(164,125,171,0.34);
  --rad:8px;--radl:12px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:var(--sans);
  /* standardized type scale — used everywhere instead of one-off font sizes */
  --fxs:11px;   /* micro labels, uppercase */
  --fsm:12px;   /* secondary / meta / table body */
  --fbase:13px; /* primary body text, inputs, buttons */
  --fmd:15px;   /* sub-headings, emphasized inline values */
  --flg:20px;   /* stat card values */
  --fxl:28px;   /* hero panel values */
  --fh1:26px;   /* page title */
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121214;--surface:#1b1b1e;--s2:rgba(255,255,255,0.045);
  --bd:rgba(255,255,255,0.09);--bdm:rgba(255,255,255,0.16);
  --t:#f0efe9;--t2:#b7b5ad;--t3:#8b8a83;
  --g:#7FCBA0;--gbg:rgba(127,203,160,0.14);--gbd:rgba(127,203,160,0.34);
  --r:#E69A9A;--rbg:rgba(230,154,154,0.14);--rbd:rgba(230,154,154,0.34);
  --a:#E4BD7D;--abg:rgba(228,189,125,0.15);--abd:rgba(228,189,125,0.35);
  --p:#EDC8FF;--pbg:rgba(237,200,255,0.15);--pbd:rgba(237,200,255,0.35);
  --refhead:#E0AFC2;
  --tabdash:#A9C6DE;--tabdashbg:rgba(169,198,222,0.15);--tabdashbd:rgba(169,198,222,0.35);
  --tablr:#E0AFC2;--tablrbg:rgba(224,175,194,0.15);--tablrbd:rgba(224,175,194,0.35);
  --tabdashbg-dd:#373D44;--tablrbg-dd:#423942;
  --pbsel:#EDC8FF;--pbselbg:rgba(237,200,255,0.15);--pbselbd:rgba(237,200,255,0.35);
}
body{font-family:var(--sans);background:var(--bg);color:var(--t);min-height:100vh;font-size:var(--fbase)}
.topbaracts{display:flex;align-items:center;gap:14px}
#app{max-width:1152px;margin:0 auto;padding:2rem 1.25rem 4rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:1.5rem}
.brand{font-size:var(--fxs);color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:var(--fh1);font-weight:600;letter-spacing:-.5px;margin-bottom:4px}
h1.h1row{display:flex;align-items:center;gap:7px}
.quotadot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.quotadot-amber{background:var(--a)}
.quotadot-red{background:var(--r)}
.sub{font-size:var(--fbase);color:var(--t2);margin-bottom:1.75rem}
.themetoggle{width:16px;height:16px;border:none;background:none;color:#ffbf00;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Fast custom tooltip — shows immediately on hover via CSS rather than relying on
   the native title attribute, whose browser-controlled delay made it feel like it
   only worked "sometimes". aria-label is kept alongside data-tt as an accessible
   fallback (screen readers only — it renders no visual popup of its own), so this
   is the only visible tooltip; colored to match the dashboard/connected-icon
   mauve (light) / powder-blue (dark) overlay instead of a plain black/white box. */
[data-tt]{position:relative}
[data-tt]::after{content:attr(data-tt);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--tabdashbg);color:var(--tabdash);border:.5px solid var(--tabdashbd);font-size:11px;font-weight:500;line-height:1.3;padding:5px 9px;border-radius:6px;white-space:normal;width:max-content;max-width:240px;text-align:center;opacity:0;pointer-events:none;transition:opacity .1s;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.22)}
[data-tt]:hover::after{opacity:1;transition-delay:.15s}
/* item B — a tooltip that opened via CSS :hover doesn't close on its own when the
   page loses focus without the mouse actually leaving the button (e.g. a Google
   sign-in popup steals focus while the pointer is still sitting on the connect
   icon). Forcing opacity off on window blur, and letting :hover retake over on
   focus, means the tooltip never gets stuck floating over a popup. */
body.tt-blurred [data-tt]::after{opacity:0!important}
.themetoggle:hover{opacity:.75}
.themetoggle svg{width:16px;height:16px;display:block}
.banner{background:var(--s2);border:.5px solid var(--bd);border-radius:var(--radl);padding:10px 14px;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:var(--fbase);color:var(--t2)}
.banner strong{color:var(--t)}
.bacts{display:flex;gap:6px;flex-wrap:wrap}
.storagebar{font-size:var(--fxs);color:var(--t3)}
.topicons{display:inline-flex;align-items:center;gap:9px}
.iconsep{color:var(--bdm);user-select:none;font-size:13px;line-height:1}
.topicon{height:16px;display:inline-flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:none;border:none;padding:0;color:var(--t2);flex-shrink:0}
.topicon:hover{color:var(--t)}
.topicon svg{width:16px;height:16px;display:block;flex-shrink:0}
.topicon.ok{color:var(--tabdash);background:var(--tabdashbg);border:.5px solid var(--tabdashbd);border-radius:6px;padding:2px 6px;height:auto;line-height:1}
.topicon.ok:hover{color:var(--tabdash);opacity:.82}
.topicon.err{color:var(--r)}
.topicon.err:hover{color:var(--r)}
.topicon.warn{color:var(--a)}
.topicon.warn:hover{color:var(--a)}
.topicon.spin{cursor:pointer;color:var(--t);position:relative;width:16px;height:16px;padding:0}
.topicon.spin .spin-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:topiconspin .8s linear infinite;transition:opacity .12s}
.topicon.spin .stop-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;color:var(--r)}
.topicon.spin:hover .spin-ico{opacity:0}
.topicon.spin:hover .stop-ico{opacity:1}
@keyframes topiconspin{to{transform:rotate(360deg)}}
.drivemenu-wrap{position:relative;display:inline-flex}
.drivemenu{position:absolute;top:22px;right:0;min-width:210px;background:var(--tabdashbg-dd);border:.5px solid var(--tabdashbd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 0;z-index:50;text-align:left;cursor:default}
.drivemenu-email{padding:2px 12px 8px;font-size:var(--fsm);color:var(--t2);border-bottom:.5px solid var(--tabdashbd);margin-bottom:4px;word-break:break-all}
.drivemenu-row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 12px;background:none;border:none;font-size:var(--fbase);color:var(--t);cursor:pointer;font-family:var(--sans)}
.drivemenu-row:hover{background:var(--tabdashbd)}
.drivemenu-row svg{width:14px;height:14px;flex-shrink:0;display:block}
.drivemenu-synced{padding:6px 12px 2px;font-size:var(--fxs);color:var(--t3);text-align:right;border-top:.5px solid var(--tabdashbd);margin-top:4px;font-style:italic}
/* Period bar */
.periodbar{display:flex;flex-direction:column;margin-bottom:1.5rem}
.pbrow{display:flex;align-items:center;justify-content:center;position:relative;padding:2px 0}
.pbcenter{display:flex;align-items:center;flex-wrap:wrap;justify-content:center}
.pbmodes{display:flex;align-items:center;gap:7px}
.pbtn{padding:3px 9px;border-radius:calc(var(--rad) - 1px);font-size:var(--fsm);font-weight:300;font-family:var(--sans);cursor:pointer;border:.5px solid transparent;color:var(--t2);background:transparent;transition:all .15s}
.pbtn.on{background:var(--pbselbg);color:var(--pbsel);border-color:var(--pbselbd);font-weight:600}
.pbtn:hover:not(.on){color:var(--t)}
.pbsep{font-size:var(--fsm);color:var(--t3);user-select:none}
.pbcount{position:absolute;right:0;font-size:var(--fxs);font-weight:300;color:var(--t3)}
.pbnav{display:flex;align-items:center;gap:5px;margin-left:9px;font-size:var(--fxs);font-weight:300;color:var(--t3)}
.pbarrow{color:var(--t3);cursor:pointer;transition:color .15s;line-height:1;padding:0 2px;margin-right:2px}
.pbarrow:hover{color:var(--t)}
.pblabel{font-size:var(--fxs);font-weight:300;color:var(--t3);margin-right:2px}
.pbtoday{font-size:var(--fxs);font-weight:300;color:var(--p);cursor:pointer;background:none;border:none;padding:0}
.pbtoday:hover{opacity:.8}
.pbcustom{display:flex;align-items:center;gap:6px;margin-left:9px}
.pbcustom input{padding:5px 8px;font-size:var(--fxs);font-family:var(--sans);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t)}
.tabs{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:.85rem}
.tab{padding:6px 14px;border-radius:calc(var(--rad) - 1px);font-size:var(--fbase);font-family:var(--sans);cursor:pointer;border:.5px solid transparent;color:var(--t2);background:transparent;transition:all .15s}
.tab.on{font-weight:600}
.tab.on.tab-dashboard{background:var(--tabdashbg);color:var(--tabdash);border-color:var(--tabdashbd)}
.tab.on.tab-log,.tab.on.tab-reflection{background:var(--tablrbg);color:var(--tablr);border-color:var(--tablrbd)}
.tab:hover:not(.on){color:var(--t)}
.tabsep{color:var(--t3);user-select:none}
.btn{font-family:var(--sans);font-size:var(--fbase);padding:7px 16px;border-radius:var(--rad);border:.5px solid var(--bdm);background:var(--s2);color:var(--t);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--surface)}
.btng{background:var(--gbg);color:var(--g);border-color:var(--gbd);font-weight:600}
.btng:hover{opacity:.85}
/* Form */
.fcard{background:var(--s2);border:.5px solid var(--bd);border-radius:var(--radl);padding:1.25rem;margin-bottom:1.25rem}
.fsec{font-size:var(--fxs);font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:1.1rem 0 10px;padding-top:1rem;border-top:.5px solid var(--bd)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:10px}
.field{display:flex;flex-direction:column}
.field label{font-size:var(--fxs);color:var(--t3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.field input,.field select{width:100%;height:36px;padding:8px 10px;font-family:var(--sans);font-size:var(--fbase);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--t3)}
.mdrow{display:flex;align-items:center;gap:16px;margin:2px 0 12px;flex-wrap:wrap}
.mdlabel{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:var(--fbase);color:var(--t2)}
.mdlabel input{cursor:pointer}
.fillrow{background:var(--surface);border:.5px solid var(--bd);border-radius:var(--rad);padding:10px 10px 0;margin-bottom:8px}
.fillrowhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fillnum{font-size:var(--fxs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.fillrm{background:none;border:none;color:var(--t3);font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.fillrm:hover{color:var(--r)}
.fillsummary{font-size:var(--fxs);color:var(--t2);margin-top:4px}
.fillopennotice{margin-top:8px;padding:8px 10px;background:var(--abg);border:.5px solid var(--abd);border-radius:var(--rad);font-size:var(--fxs);color:var(--a);line-height:1.4}
/* Rules checklist */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:540px){.rgrid{grid-template-columns:1fr}}
.ritem{display:flex;align-items:stretch;border-radius:var(--rad);overflow:hidden;border:.5px solid var(--bd);transition:border-color .15s}
.rlabel{flex:1;padding:9px 11px;font-size:var(--fsm);color:var(--t2);line-height:1.4;background:var(--surface);display:flex;align-items:center;transition:all .15s}
.rbtns{display:flex;flex-direction:column;flex-shrink:0;border-left:.5px solid var(--bd)}
.rbtn{padding:0 12px;font-size:var(--fxs);font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t3);font-family:var(--sans);flex:1;transition:all .15s;white-space:nowrap;min-width:42px}
.rbtn:first-child{border-bottom:.5px solid var(--bd)}
.rbtn:hover{background:var(--s2)}
.rbtn.ayes{background:var(--gbg);color:var(--g)}
.rbtn.ano{background:var(--rbg);color:var(--r)}
.ritem.syes{border-color:var(--gbd)}.ritem.syes .rlabel{background:var(--gbg);color:var(--g)}
.ritem.sno{border-color:var(--rbd)}.ritem.sno .rlabel{background:var(--rbg);color:var(--r)}
.srow{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;background:var(--surface);border:.5px solid var(--bd);border-radius:var(--rad)}
.strack{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;flex:1;max-width:120px}
.sfill{height:100%;border-radius:3px;transition:width .3s}
/* Disqualifiers */
.dqhead{display:flex;justify-content:space-between;align-items:center;margin:0;padding:0;border:none}
.dqlist{display:flex;flex-direction:column;gap:6px}
.dqitem{display:flex;align-items:stretch;border-radius:var(--rad);overflow:hidden;border:.5px solid var(--bd)}
.dqitem.viol{border-color:var(--rbd)}
.dqitem.viol .dqlabel{background:var(--rbg);color:var(--r)}
.dqlabel{flex:1;padding:9px 11px;font-size:var(--fsm);color:var(--t2);line-height:1.4;background:var(--surface);display:flex;align-items:center}
.dqbtns{display:flex;flex-shrink:0;border-left:.5px solid var(--bd)}
.dqbtn{padding:0 14px;font-size:var(--fxs);font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t3);font-family:var(--sans);transition:all .15s;white-space:nowrap}
.dqbtn:first-child{border-right:.5px solid var(--bd)}
.dqbtn.aclean{background:var(--gbg);color:var(--g)}
.dqbtn.aviol{background:var(--rbg);color:var(--r)}
.dqeditrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.dqeditrow input{flex:1;padding:7px 9px;font-size:var(--fsm);font-family:var(--sans);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none}
.dqeditrow input:focus{border-color:var(--t3)}
.dqok{font-size:var(--fxs);color:var(--t3);margin-top:6px}
/* Table */
.lcountbottom{text-align:right;font-size:var(--fxs);font-weight:300;font-style:italic;color:var(--t3);margin-top:8px}
.empty{text-align:center;padding:3.5rem 1rem;border:.5px solid var(--bd);border-radius:var(--radl);color:var(--t2);font-size:var(--fbase)}
.twrap{overflow-x:auto;border:.5px solid var(--bd);border-radius:var(--radl)}
table{width:100%;border-collapse:collapse;font-size:var(--fsm)}
thead tr{background:var(--s2);border-bottom:.5px solid var(--bd)}
thead th{padding:9px 10px;font-size:var(--fxs);font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;text-align:center}

.emsg{font-size:var(--fsm);font-weight:600}
.bpanel{background:var(--s2);border:.5px solid var(--bd);border-radius:var(--radl);padding:1.1rem;margin-bottom:1.25rem}
.rsrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)}

.browpct{font-size:var(--fsm);font-weight:700;font-family:var(--mono);text-align:right;white-space:nowrap}
/* Pipe separator for compact multi-value stat cards, e.g. "3 | 2W | 1L" */

.platformdd{height:16px;font-size:10px;font-weight:400;color:var(--t3);background:none;border:.5px solid var(--bdm);border-radius:5px;padding:0 4px;line-height:1;cursor:pointer;font-family:var(--sans)}

.delbtn:hover{color:var(--r)}

/* Calendar heatmap */

.hlmark{background:var(--tabdashbg);color:var(--tabdash);border-radius:3px;padding:0 2px;font-weight:700}
/* Search nav "current match" — every match gets the plain .hlmark bold highlight
   above; the ONE match the prev/next arrows are currently parked on additionally
   gets this row/card-level treatment so a click visibly "jumps" somewhere new,
   not just a barely-there scroll. Same mauve/blue family as .hlmark and the
   connected-Drive icon, just stronger, and left-edge so it reads at a glance
   even before the eye finds the highlighted text inside.
 */
tbody tr.trow.trow-current{background:var(--tabdashbg);box-shadow:inset 3px 0 0 var(--tabdash)}
tbody tr.trow.trow-current:hover{background:var(--tabdashbg)}
.fcard.fcard-current{border-color:var(--tabdashbd);box-shadow:inset 3px 0 0 var(--tabdash),0 0 0 1px var(--tabdashbd)}
/* Keeps the search pill + prev/next arrows reachable no matter how far a long
   trade log or reflection list has been scrolled — pinned to the viewport top
   only while a search is actually open, so normal (non-searching) scrolling is
   unaffected. Background matches the page so scrolled content underneath is
   fully hidden rather than showing through; the bottom border/shadow separates
   it from the content now scrolling past beneath it. */
.logfilterbar.sticky-search,.lbar.sticky-search{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0;border-bottom:.5px solid var(--bd);box-shadow:0 6px 12px -8px rgba(0,0,0,.25)}

<script>
const RULES=[
  {id:"stop", text:"Respected my stop loss"},

  {id:"goal", text:"Not trading just to hit a daily $ goal"},
];
const SETUPS=["Bounce","Reject","Break"];
// Compact log-view abbreviations — full words are still used everywhere else
// (add/edit form, filter dropdown menu). No tooltip: the shorthand alone is enough.
const SETUP_ABBR={Bounce:"B",Reject:"R",Break:"Br"};
function setupAbbr(s){return SETUP_ABBR[s]||s;}
const LOSSCATS=[
  {id:"good", label:"Good Loss", hint:"Valid setup, correct execution and risk — it just didn't work."},
  {id:"exec", label:"Execution Loss", hint:"Idea was valid, execution was poor (early/late entry, oversized, moved stop)."},
  {id:"dec",  label:"Decision Loss", hint:"Trade shouldn't have been taken (poor RR, extended price, no real setup)."},
  {id:"emo",  label:"Emotional Loss", hint:"Driven by FOMO, revenge, boredom, or a daily goal."},
];
const DQ_DEFAULT=[
  {id:"chase", text:"I missed my planned entry and would be chasing"},
  {id:"recover", text:"I am trying to recover a previous loss"},
  {id:"noThesis", text:"I cannot clearly explain my trade thesis"},
  {id:"dailyLimit", text:"I already hit my daily loss limit"},
  {id:"hiddenPnl", text:"I would not take this trade if my P&L were hidden"},
];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const KEY="wss_j3";

// ── Screenshot store (IndexedDB) ────────────────────────────────────────────────
// Screenshots are the thing that blows past localStorage's ~5-10MB quota, so they
// live here instead — IndexedDB quota is typically hundreds of MB+. localStorage
// keeps a lightweight copy of every trade (screenshots stripped to name-only);
// this store holds the actual dataUrls, keyed by trade id. Drive is unaffected —
// it always gets the full in-memory `trades` array via driveSyncPayload().
const IDB_NAME="wss_screenshots";
const IDB_STORE="screenshots";
let idbOpenPromise=null;
function idbOpen(){
  if(idbOpenPromise)return idbOpenPromise;
  idbOpenPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(IDB_NAME,1);
      req.onupgradeneeded=()=>{req.result.createObjectStore(IDB_STORE);};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e);}
  });
  return idbOpenPromise;
}
async function idbPutScreenshots(tradeId,screenshots){
  try{
    const db=await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(screenshots,tradeId);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }catch(e){console.log("[idb] put failed:",e.message||e);}
}
async function idbGetScreenshots(tradeId){
  try{
    const db=await idbOpen();
    return await new Promise((resolve,reject)=>{
      const req=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(tradeId);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){console.log("[idb] get failed:",e.message||e);return null;}
}
async function idbDeleteScreenshots(tradeId){
  try{
    const db=await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).delete(tradeId);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }catch(e){console.log("[idb] delete failed:",e.message||e);}
}
// True once a screenshots array holds real image data (vs. the lightweight
// {name} refs that live in localStorage).
function isHydrated(screenshots){
  return !!(screenshots&&screenshots.length>0&&screenshots[0].dataUrl);
}
function stripScreenshotsForLocal(arr){
  return arr.map(t=>({...t,screenshots:(t.screenshots||[]).map(s=>({name:s.name}))}));
}
// Writes lightweight trade data to localStorage and fires off the full
// screenshot payloads to IndexedDB in the background. Used by every call site
// that used to do a raw localStorage.setItem(KEY,...). Trades flagged
// localCacheExcluded (evicted by the auto-scrubber below) are skipped —
// they're intentionally not cached locally; Drive still has the originals.
function persistLocal(){
  try{
    localStorage.setItem(KEY,JSON.stringify({trades:stripScreenshotsForLocal(trades),reflections,dq,deleted:tombstones,dqUpdatedAt}));
  }catch(e){
    alert("Storage is full — the browser's local storage limit has been hit. Export a backup (.json) and let me know if you're still seeing this after the screenshot storage change.");
  }
  trades.forEach(t=>{
    if(t.screenshots&&t.screenshots.length>0&&!t.localCacheExcluded)idbPutScreenshots(t.id,t.screenshots);
  });
  refreshStorageQuota();
}
// After load() pulls the lightweight trades from localStorage, this fetches
// the real screenshot data back from IndexedDB and merges it in, then
// re-renders. Also opportunistically migrates any still-legacy trades (full
// dataUrl already embedded from before this change, or just-fetched from
// Drive) into IndexedDB so future localStorage writes can stay lightweight.
// Skips anything flagged localCacheExcluded — nothing to fetch, we evicted it.
async function hydrateScreenshotsFromIDB(){
  const toFetch=trades.filter(t=>t.screenshots&&t.screenshots.length>0&&!isHydrated(t.screenshots)&&!t.localCacheExcluded);
  const legacy=trades.filter(t=>isHydrated(t.screenshots)&&!t.localCacheExcluded);
  legacy.forEach(t=>idbPutScreenshots(t.id,t.screenshots));
  if(toFetch.length>0){
    await Promise.all(toFetch.map(async t=>{
      const full=await idbGetScreenshots(t.id);
      if(!full)return;
      const cur=trades.find(x=>x.id===t.id);
      // Re-check at apply time: Drive may have already replaced `trades` with
      // fresher, already-hydrated data while this fetch was in flight.
      if(cur&&!isHydrated(cur.screenshots))cur.screenshots=full;
    }));
    render();
  }
}

// ── Storage quota: dot indicator + auto-scrub ──────────────────────────────────
// Tracks real origin-wide usage (localStorage + IndexedDB combined) against the
// browser's actual quota, via navigator.storage.estimate() — not a guess at
// localStorage's ~5-10MB ceiling, since screenshots now live in IndexedDB where
// the real ceiling is much higher (and browser-dependent).
let storageQuotaLevel="ok"; // "ok" | "amber" | "red" — read by render() for the dot
let scrubbing=false;
async function refreshStorageQuota(){
  if(!(navigator.storage&&navigator.storage.estimate))return;
  try{
    const est=await navigator.storage.estimate();
    const usage=est.usage||0,quota=est.quota||0;
    const pct=quota>0?usage/quota:0;
    const newLevel=pct>=0.9?"red":pct>=0.7?"amber":"ok";
    const changed=newLevel!==storageQuotaLevel;
    storageQuotaLevel=newLevel;
    if(changed)render();
    if(newLevel==="red"&&!scrubbing)autoScrubOldestScreenshots();
  }catch(e){console.log("[quota] estimate failed:",e.message||e);}
}
// Evicts locally-cached screenshots oldest-first (by trade date) until usage
// drops back under the amber line, or there's nothing left to evict. Deletes
// the IndexedDB copy only — Drive keeps the full-res original regardless, so
// nothing is permanently lost, just no longer cached on this device.
async function autoScrubOldestScreenshots(){
  if(scrubbing)return;
  scrubbing=true;
  let scrubbedAny=false;
  try{
    let guard=0;
    while(guard++<500){
      const est=await navigator.storage.estimate();
      const pct=est.quota>0?(est.usage||0)/est.quota:0;
      if(pct<0.7)break;
      const list=trades.filter(t=>!t.localCacheExcluded&&isHydrated(t.screenshots))
        .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      if(list.length===0)break; // nothing left locally to scrub
      const t=list[0];
      await idbDeleteScreenshots(t.id);
      t.localCacheExcluded=true;
      t.screenshots=(t.screenshots||[]).map(s=>({name:s.name}));
      scrubbedAny=true;
    }
  }finally{
    scrubbing=false;
    // Only re-run persistLocal (which re-checks quota) if we actually changed
    // something — otherwise this and refreshStorageQuota could ping-pong
    // forever when nothing's left to scrub but usage is still over red.
    if(scrubbedAny)persistLocal();else render();
  }
}

// ── Google Drive sync (Phase 1) ────────────────────────────────────────────────
// Client ID only — never a client secret (this is a public browser app; secrets
// are for confidential server-side clients and are never needed here).
const DRIVE_CLIENT_ID="54130439532-5ttumb97jg0cndsbk1krh7a1ume44nqe.apps.googleusercontent.com";
const DRIVE_SCOPES="https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email";

const DRIVE_MIRROR_FOLDER_NAME="journal-mirror-folder";

let driveTokenClient=null;
let driveAccessToken=null;
let driveConnected=false;
let driveConnecting=false;
let driveSyncing=false;
let driveSyncError="";
// Visual severity for a non-empty driveSyncError: "quiet" (still shows the normal

let driveSyncErrorSeverity="";
let driveAppDataFileId=null;
let driveMirrorFileId=null;
let driveKnownModifiedTime=null;  // Drive's own modifiedTime for the appData file, cached after every successful load/save — used to detect another device having saved since

let driveStaleConflict=false;     // true when a save was blocked because Drive has newer changes than what we last loaded

const DRIVE_RETRY_DELAYS=[20000,60000,300000,900000]; // 20s → 1m → 5m → 15m(cap), advances one tier per consecutive failure
let driveRetryDelayIdx=0;         // current backoff tier — resets to 0 on any successful sync
let driveConsecFailures=0;        // consecutive failed retry ticks of any kind — trips the breaker at 5
let driveConsecAuthFailures=0;    // consecutive 401/403 retry ticks specifically — trips the breaker at 3, since retrying the
                                   // same rejected token again can't fix an auth problem the way it might fix a network blip
const DRIVE_BREAKER_KEY="wss_drive_breaker_tripped";
let driveBreakerTripped=false;    // true once either cap above is hit — auto-retry stays off (even across reloads) until
                                   // a real reconnect (force quit / disconnect, then connect) proves the connection works again
const DRIVE_TOKEN_CACHE_KEY="wss_drive_token";
let driveAutoConnectAttempted=false; // guards against attempting the on-load silent reconnect more than once
let driveTokenExpiresAt=0;        // item 9 — tracks the current token's expiry so a single refresh timer can be scheduled off it
let driveRefreshTimer=null;       // item 9 — the one mid-session silent-refresh timer in flight, if any
let driveMenuOpen=false;          // item 6 — connected-account dropdown open/closed
let driveUserEmail=null;          // item 6 — filled in after connect via the userinfo.email scope
const DRIVE_MIRROR_DIRTY_KEY="wss_drive_mirror_dirty";
let driveMirrorDirty=false;       // item 3 — true when appData saved but the mirror write failed right after; retried standalone
let driveSaveInFlight=false;      // item 10 — true while a save's staleness-check+write cycle is actually talking to Drive
let driveSaveQueued=false;        // item 10 — true when another save was requested mid-flight; coalesced into one fresh follow-up run
let driveAbortController=null;    // manual hard-stop — the in-flight request's controller, if any
let driveForceQuitted=false;      // set right before aborting so the resulting fetch rejection doesn't surface as a scary error

// combined) keyed by platform then ticker. This purely feeds the per-trade
// `fees`/`result` figures (see recomputeFees()/recomputeAutoResult()) — no

};
const PLATFORMS=[{id:"tradovate",label:"Tradovate"},{id:"ninjatrader",label:"NinjaTrader"},{id:"other",label:"Other"}];

// ── Theme ─────────────────────────────────────────────────────────────────────
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",cur);

// ── Persistence ───────────────────────────────────────────────────────────────
function save(){
  persistLocal();
  driveSaveAll();
}
function migrateTrade(t){
  // Legacy trades used two fee fields (feeFixed + feeVariable). Collapse them into
  // the single `fees` total. Platform is unknown for these older trades, so it's
  // set to "other" (manual/fixed) rather than guessing Tradovate or NinjaTrader —
  // that keeps the stored dollar amount from silently changing if the trade is
  // later re-opened and the fee auto-recalculates against today's rate table.
  let fees=t.fees;
  if(fees===undefined){
    const ff=parseFloat(t.feeFixed),fv=parseFloat(t.feeVariable);
    const sum=(isNaN(ff)?0:ff)+(isNaN(fv)?0:fv);
    fees=sum>0?sum.toFixed(2):"";
  }
  return{
    ...t,
    ticker: t.ticker||"",
    entryTime: t.entryTime!==undefined&&t.entryTime!==null?t.entryTime:(t.time||""),
    exitTime: t.exitTime||"",
    direction: t.direction||"long",
    multiDay: !!t.multiDay,
    exitDate: t.exitDate||"",
    exit: t.exit!==undefined?t.exit:"",
    platform: t.platform||"other",
    fees: fees
  };
}
function migrateReflection(r){
  if(r.sections&&r.periodType&&r.periodDate&&r.entryDate)return r;
  const entryDate=r.date||td();
  const periodDate=ymd(startOfWeek(parseYMD(entryDate)));
  const sections=[
    {q:"What setups worked best?",a:r.best||""},
    {q:"Where did I break rules?",a:r.broke||""},
    {q:"What will I improve next?",a:r.improve||""}
  ];
  return{id:r.id||Date.now(),periodType:"week",periodDate,entryDate,sections};
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(d.trades)trades=d.trades.map(migrateTrade);
    if(Array.isArray(d.deleted))tombstones=d.deleted;
    if(d.dqUpdatedAt)dqUpdatedAt=d.dqUpdatedAt;
    if(d.dq&&d.dq.length)dq=d.dq;
    if(Array.isArray(d.reflections)){
      reflections=d.reflections.map(migrateReflection);
    }else if(d.ref&&(d.ref.best||d.ref.broke||d.ref.improve)){
      reflections=[migrateReflection({id:Date.now(),date:td(),best:d.ref.best||"",broke:d.ref.broke||"",improve:d.ref.improve||""})];

// ── Google Drive sync — Phase 1: connect, initial load/seed, write-through ────

function fmtSyncTime(iso){
  if(!iso)return"—";

  const mon=MON[d.getMonth()].slice(0,3);
  const yy=String(d.getFullYear()).slice(-2);
  const hh=String(d.getHours()).padStart(2,"0");

  }catch(e){}

      if(Date.now()-start>maxWaitMs){resolve(false);return;}
      setTimeout(check,150);

  // real passkey/2FA/captcha round trip, short enough to never look permanently stuck.
  driveStartWatchdog(120000);

    if(driveForceQuitted)return;
    driveClearWatchdog();driveAttemptKind=null;
    if(resp.error){

      renderDriveStatus();

// created fresh the first time) — no special-casing needed for that.
function switchDriveAccount(){
  if(driveConnecting||driveSyncing)return; // see connectDrive() — same re-entry guard
  closeDriveMenu();
  const tc=ensureDriveTokenClient();
  if(!tc){
    alert("Google sign-in is still loading — wait a second and try again.");
    return;
  }
  driveForceQuitted=false; // see connectDrive() — must clear before a fresh attempt or the callback silently no-ops
  driveAttemptKind="switch";
  driveSwitchPrevEmail=driveUserEmail; // snapshot — restored by driveTokenErrorCallback if this attempt is abandoned
  driveConnecting=true;driveClearSyncError();driveUserEmail=null;renderDriveStatus();
  driveStartWatchdog(120000); // see connectDrive() — same reasoning

    if(driveForceQuitted)return;
    driveClearWatchdog();driveAttemptKind=null;
    if(resp.error){
      driveConnecting=false;
      driveUserEmail=driveSwitchPrevEmail;driveSwitchPrevEmail=null; // restore — this was never actually a disconnect
      driveSyncError="switch failed ("+resp.error+") - re-switch";driveSyncErrorSeverity="error";
      renderDriveStatus();
      return;
    }

// Full state teardown shared by disconnect and force-stop: revokes the token,
// clears every piece of connection state (in-memory and cached), and marks
// auto-connect as already-attempted so nothing silently retries afterward.
// The next explicit connect (a real relogin) runs the normal connect flow
// from scratch, which re-establishes token refresh / stay-logged-in on its
// own — this teardown doesn't need to special-case that.
function driveFullTeardown(){
  if(driveAccessToken&&typeof google!=="undefined"&&google.accounts&&google.accounts.oauth2){
    try{google.accounts.oauth2.revoke(driveAccessToken,()=>{});}catch(e){}
  }
  driveAccessToken=null;driveConnected=false;driveConnecting=false;driveSyncing=false;
  driveAppDataFileId=null;driveMirrorFileId=null;driveClearSyncError();
  driveKnownModifiedTime=null;drivePendingSync=false;driveStaleConflict=false;
  driveMenuOpen=false;driveUserEmail=null;                    // item 6
  driveTokenExpiresAt=0;clearDriveRefreshTimer();              // item 9
  setMirrorDirty(false);                                       // item 3
  driveSaveInFlight=false;driveSaveQueued=false;                // item 10
  driveAttemptKind=null;driveSwitchPrevEmail=null;

  setDriveBreaker(false);driveRetryResetBackoff(); // a deliberate disconnect/force-quit always clears the circuit breaker too
  clearCachedDriveToken();
  driveAutoConnectAttempted=true; // an explicit disconnect/force-stop should stick — don't silently reconnect on the next reload
}
// sanity-check fix (item 11) — root cause of a "phantom reconnect": disconnectDrive()
// used to only call driveFullTeardown(), which never touched driveForceQuitted.
// If a connect/switch attempt was still waiting on Google when disconnect was
// pressed, that pending tc.callback checks ONLY driveForceQuitted (see
// connectDrive()/switchDriveAccount() above) — since disconnect never set it,
// the stray callback would later fire for real, plant a fresh access token, and
// call driveConnectFlow(), silently re-establishing the exact connection the
// person just explicitly ended. This mirrors what driveForceQuit() already does
// for the in-flight-request case, so "disconnect" is now safe to press at any
// point, not just once a connect has already settled.
function disconnectDrive(){
  if(driveConnecting){
    driveClearWatchdog();
    driveForceQuitted=true;
    if(driveAbortController){try{driveAbortController.abort();}catch(e){}}
    driveAbortController=null;
  }
  driveFullTeardown();
  renderDriveStatus();
}
function driveBeginAttempt(){
  driveForceQuitted=false;
  driveAbortController=new AbortController();
  return driveAbortController;
}
function driveForceQuit(){
  // Manual hard-stop for a sync/connect that's stuck — cancels whatever request
  // is actually in flight, then does a full teardown (same end state as an
  // explicit disconnect) so nothing keeps retrying or lingering in the
  // background. No error banner: this was a deliberate stop, not a failure.
  driveClearWatchdog();
  driveForceQuitted=true;
  if(driveAbortController){try{driveAbortController.abort();}catch(e){}}
  driveAbortController=null;
  driveFullTeardown();
  render();
}
async function driveApiFetch(url,options){
  options=options||{};
  options.headers={...(options.headers||{}),Authorization:"Bearer "+driveAccessToken};
  if(driveAbortController)options.signal=driveAbortController.signal;
  const res=await fetch(url,options);
  if(!res.ok){
    let detail="";
    try{const j=await res.json();detail=j.error&&j.error.message?j.error.message:"";}catch(e){}
    throw new Error("Drive API error "+res.status+(detail?": "+detail:""));
  }
  return res;
}
async function driveFindFile(name,isAppData){
  const q=`name='${name.replace(/'/g,"\\'")}' and trashed=false`;
  const params=new URLSearchParams({q,fields:"files(id,name,modifiedTime,parents)",spaces:isAppData?"appDataFolder":"drive"});
  const res=await driveApiFetch("https://www.googleapis.com/drive/v3/files?"+params.toString());
  const d=await res.json();
  return(d.files&&d.files.length)?d.files[0]:null;
}
async function driveGetModifiedTime(fileId){
  const res=await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`);
  const d=await res.json();
  return d.modifiedTime;
}
async function driveDownloadFile(fileId){
  const res=await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return res.text();
}
async function driveCreateFile(name,content,isAppData,parentFolderId){
  const metadata=isAppData?{name,parents:["appDataFolder"]}:(parentFolderId?{name,parents:[parentFolderId]}:{name});
  const boundary="-------driveJournalBoundary"+Date.now();
  const body=
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
    `--${boundary}--`;
  const res=await driveApiFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime",{
    method:"POST",
    headers:{"Content-Type":`multipart/related; boundary=${boundary}`},
    body
  });
  return res.json();
}
async function driveFindFolder(name){
  const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const params=new URLSearchParams({q,fields:"files(id,name)"});
  const res=await driveApiFetch("https://www.googleapis.com/drive/v3/files?"+params.toString());
  const d=await res.json();
  return(d.files&&d.files.length)?d.files[0]:null;
}
async function driveCreateFolder(name){
  const res=await driveApiFetch("https://www.googleapis.com/drive/v3/files?fields=id",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder"})
  });
  return res.json();
}
// Resolves the app-owned public mirror folder, creating + sharing it the first
// time. Safe to call on every connect — driveFindFolder only ever matches a
// folder this same app previously created, so it's a no-op after the first run.
async function driveFindOrCreateMirrorFolder(){
  const found=await driveFindFolder(DRIVE_MIRROR_FOLDER_NAME);
  if(found)return found.id;
  const folder=await driveCreateFolder(DRIVE_MIRROR_FOLDER_NAME);
  await driveSetPublicReadable(folder.id); // "anyone with the link — viewer", so the API-key-only viewer.html can list it
  return folder.id;
}
// Moves an existing file so the given folder is its only parent. Used to pull
// a mirror file created before this fix (sitting parentless in root) into the
// new public folder, so viewer.html's folder-listing lookup finds it.
async function driveMoveFileToFolder(fileId,folderId){
  await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${folderId}&removeParents=root`,{method:"PATCH"});
}
async function driveUpdateFile(fileId,content){
  const res=await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=modifiedTime`,{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:content
  });
  return res.json();
}
async function driveSetPublicReadable(fileId){
  await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({role:"reader",type:"anyone"})
  });
}
function driveSyncPayload(){
  // localCacheExcluded is a local-only caching flag (see auto-scrub above) —
  // strip it so it doesn't leak into the Drive backup / viewer.html's data.
  const cleanTrades=trades.map(t=>{const{localCacheExcluded,...rest}=t;return rest;});
  return JSON.stringify({trades:cleanTrades,reflections,dq,deleted:tombstones,dqUpdatedAt,lastModified:new Date().toISOString()});
}
async function driveConnectFlow(){
  driveBreakerTripped=getDriveBreakerFlag(); // pull in whatever a previous session left behind before deciding anything below
  driveClearSyncError();
  driveBeginAttempt();
  try{
    const foundAppData=await driveFindFile(DRIVE_APPDATA_NAME,true);
    if(foundAppData){
      driveAppDataFileId=foundAppData.id;
      driveKnownModifiedTime=foundAppData.modifiedTime;
      const raw=await driveDownloadFile(foundAppData.id);
      const d=JSON.parse(raw||"{}");
      const res=mergeWithRemote(d);
      applyMerge(res);
      if(res.contributed){
        // this device has changes Drive doesn't: snapshot Drive's copy first, then push the merged result
        await driveBackupBeforeMerge(raw);
        const up=await driveUpdateFile(driveAppDataFileId,driveSyncPayload());
        driveKnownModifiedTime=up.modifiedTime;
      }
      setLastSync();
    }else{
      const created=await driveCreateFile(DRIVE_APPDATA_NAME,driveSyncPayload(),true);
      driveAppDataFileId=created.id;
      driveKnownModifiedTime=created.modifiedTime;
      setLastSync();
    }
    driveMirrorFolderId=await driveFindOrCreateMirrorFolder();
    const foundMirror=await driveFindFile(DRIVE_MIRROR_NAME,false);
    if(foundMirror){
      driveMirrorFileId=foundMirror.id;
      await driveUpdateFile(driveMirrorFileId,driveSyncPayload());
      // migrate a pre-fix mirror (created with no parent, sitting in root) into the public folder
      if(!foundMirror.parents||!foundMirror.parents.includes(driveMirrorFolderId)){
        try{await driveMoveFileToFolder(driveMirrorFileId,driveMirrorFolderId);}
        catch(e){console.log("[drive] couldn't migrate existing mirror into public folder:",e.message||e);}
      }
    }else{
      const createdMirror=await driveCreateFile(DRIVE_MIRROR_NAME,driveSyncPayload(),false,driveMirrorFolderId);
      driveMirrorFileId=createdMirror.id;
      await driveSetPublicReadable(driveMirrorFileId);
    }
    driveConnected=true;driveConnecting=false;
    console.log("[drive] appData file id:",driveAppDataFileId);
    console.log("[drive] mirror file id:",driveMirrorFileId);
    console.log("[drive] mirror folder id (put this in viewer.html's DRIVE_MIRROR_FOLDER_ID):",driveMirrorFolderId);
    scheduleDriveTokenRefresh(driveTokenExpiresAt); // item 9 — single choke point for every successful connect path
    driveFetchUserEmail();                          // item 6 — fire and forget; dropdown shows "…" until this resolves
    driveRegisterRetrySuccess(); // this connect just proved the token/account works — clear any tripped breaker and backoff
    if(getMirrorDirtyFlag()){                       // item 3 — resume a retry left over from before a page reload
      driveMirrorDirty=true;
      scheduleDriveRetry();
    }
    persistLocal();
    render();
  }catch(e){
    if(driveForceQuitted){driveForceQuitted=false;return;} // manual stop — driveForceQuit() already reset everything and rendered
    driveConnecting=false;
    driveSyncError="connect failed ("+(e.message||String(e))+") - retry";driveSyncErrorSeverity="error";
    render();
  }
}
async function driveReloadLatest(){
  // Another device saved newer changes. Merge them into what's on screen (nothing local is thrown away),
  // then push the merged result back up if this device had anything Drive didn't.
  if(!driveAppDataFileId||!driveConnected)return;
  driveSyncing=true;driveStaleConflict=false;renderDriveStatus();
  driveBeginAttempt();
  let needUpload=false;
  try{
    const raw=await driveDownloadFile(driveAppDataFileId);
    const d=JSON.parse(raw||"{}");
    const res=mergeWithRemote(d);
    applyMerge(res);
    driveKnownModifiedTime=await driveGetModifiedTime(driveAppDataFileId);
    persistLocal();
    driveClearSyncError();
    if(res.contributed){needUpload=true;await driveBackupBeforeMerge(raw);}
    else setLastSync();
  }catch(e){
    if(driveForceQuitted){driveForceQuitted=false;return;}
    driveSyncError="merge failed ("+(e.message||e)+") - retry";driveSyncErrorSeverity="error";
  }
  driveSyncing=false;render();
  if(needUpload)driveSaveAll();
}
// item 3 — the mirror-dirty flag itself. Cached in localStorage (not just in
// memory) so a reload before the retry loop catches up doesn't lose track of
// the fact the mirror is stale — driveConnectFlow() checks this on every
// (re)connect and resumes the retry if needed.
function setMirrorDirty(v){
  driveMirrorDirty=v;
  try{
    if(v)localStorage.setItem(DRIVE_MIRROR_DIRTY_KEY,"1");
    else localStorage.removeItem(DRIVE_MIRROR_DIRTY_KEY);
  }catch(e){}
}
function getMirrorDirtyFlag(){
  try{return localStorage.getItem(DRIVE_MIRROR_DIRTY_KEY)==="1";}catch(e){return false;}
}
// Persisted circuit-breaker flag — survives reloads so a chronic failure
// doesn't quietly re-arm itself just because the tab was closed and reopened
// (previously only driveMirrorDirty was persisted, which meant a broken
// connection would silently resume hammering Drive on every fresh page load).
function setDriveBreaker(v){
  driveBreakerTripped=v;
  try{
    if(v)localStorage.setItem(DRIVE_BREAKER_KEY,"1");
    else localStorage.removeItem(DRIVE_BREAKER_KEY);
  }catch(e){}
}
function getDriveBreakerFlag(){
  try{return localStorage.getItem(DRIVE_BREAKER_KEY)==="1";}catch(e){return false;}
}
function driveRetryResetBackoff(){
  driveRetryDelayIdx=0;driveConsecFailures=0;driveConsecAuthFailures=0;

// that's proven broken," and a success is direct proof it no longer is.
function driveRegisterRetrySuccess(){
  driveRetryResetBackoff();
  if(driveBreakerTripped)setDriveBreaker(false);
  renderDriveStatus();
}
// A failure advances the backoff tier and, past the threshold, trips the

// than other failures — and an immediate honest message rather than waiting
// for the cap — because resending the same rejected token can't fix an auth
// problem the way it might fix a network blip. Every tier renders a specific
// message (never silent) so a background failure is always visible on return.
function driveRegisterRetryFailure(isAuthError){
  driveConsecFailures++;
  driveConsecAuthFailures=isAuthError?driveConsecAuthFailures+1:0;
  if(driveConsecAuthFailures>=3){
    setDriveBreaker(true);clearDriveRetry();
    driveSyncError="can't connect - click disconnect and re-login";driveSyncErrorSeverity="error";
    renderDriveStatus();
    return;
  }

    // A lone (not-yet-breaker) auth rejection — surfaced right away as an error
    // rather than folded into the quiet-retry tiering below, since resending the
    // same rejected token can't fix an auth problem the way it might a network blip.
    driveSyncError="connection needs reauthorising - disconnect and re-login";driveSyncErrorSeverity="error";
    driveRetryDelayIdx=Math.min(driveRetryDelayIdx+1,DRIVE_RETRY_DELAYS.length-1);
    scheduleDriveRetry();
    renderDriveStatus();
    return;
  }
  // item C2 — generic (non-auth) failures step through three tiers before the
  // breaker trips: attempts 1-3 stay quiet (still reads as "connected", the
  // retry message only lives in the tooltip); attempt 4 switches to a visible
  // warning icon but keeps retrying in the background; attempt 5+ trips the
  // breaker, switches to the error icon, and stops.
  if(driveConsecFailures>=5){
    setDriveBreaker(true);clearDriveRetry();
    driveSyncError="sync paused (repeated failures) - force quit and re-login";driveSyncErrorSeverity="error";
    renderDriveStatus();
    return;
  }
  if(driveConsecFailures>=4){
    driveSyncError="sync failed - disconnect and re-login";driveSyncErrorSeverity="warn";
  }else{
    driveSyncError="sync failed - retrying automatically";driveSyncErrorSeverity="quiet";
  }

  scheduleDriveRetry();

// Self-rescheduling backoff timer (not a flat interval) — each tick either
// reschedules itself one tier further out on failure, or stops entirely once
// the breaker trips. Also gated on tab visibility: a backgrounded tab is
// exactly what turned a handful of failures into an hours-long hammering
// session last time, so nothing is scheduled while hidden, and visibility
// regain triggers an immediate check instead of waiting out the backoff.
function scheduleDriveRetry(){
  if(driveBreakerTripped)return;
  if(driveRetryTimer)return;
  if(document.hidden)return; // visibilitychange re-arms this on return
  const delay=DRIVE_RETRY_DELAYS[Math.min(driveRetryDelayIdx,DRIVE_RETRY_DELAYS.length-1)];
  driveRetryTimer=setTimeout(driveRetryTick,delay);

function clearDriveRetry(){
  if(driveRetryTimer){clearTimeout(driveRetryTimer);driveRetryTimer=null;}

async function driveRetryTick(){

  if(drivePendingSync){await driveSaveAll();return;}

// item 3 — standalone mirror catch-up, used when appData saved fine but the
// mirror write right after it failed. Rebuilds the payload fresh each retry
// (rather than replaying the stale one) so it reflects any newer edits too.
// Failures now go through the same backoff/breaker/visible-error path as the
// main save — this used to retry silently forever with no cap and no
// indication anything was wrong, which is the likelier of the two loops
// behind the background sync that triggered the Google lockout.
async function retryMirrorWrite(){
  if(!driveMirrorFileId||!driveConnected||!driveAccessToken)return;

    await driveUpdateFile(driveMirrorFileId,driveSyncPayload());
    setMirrorDirty(false);
    driveRegisterRetrySuccess();
    driveClearSyncError();
    if(!drivePendingSync)clearDriveRetry();

  }catch(e){

async function driveSaveAll(){
  if(!driveConnected||!driveAccessToken)return;

  // deleting two trades back to back) each start their own independent
  // staleness-check + write cycle. Both checks can pass (neither sees the
  // other's write yet), so both PUTs fire — and since a PUT fully replaces
  // the file, whichever response happens to land LAST wins, even if it was
  // sent first with a now-stale payload. That silently reverts the other
  // save. Serializing here — at most one save in flight, with any change
  // that arrives mid-save coalesced into a single fresh follow-up — closes
  // the race entirely: the follow-up always reads trades/reflections/dq at
  // the moment it actually runs, never a stale snapshot.

    driveSaveQueued=true;
    return;
  }
  if(!navigator.onLine){
    drivePendingSync=true;driveSyncError="offline - sync resumes once connection established";renderDriveStatus();
    scheduleDriveRetry();
    return;
  }

  driveSyncing=true;renderDriveStatus();

    // Staleness check — if another device saved since we last loaded/saved,
    // don't blindly overwrite their changes with our (older) in-memory state.

      const current=await driveGetModifiedTime(driveAppDataFileId);
      if(current&&current!==driveKnownModifiedTime){

        renderDriveStatus();
        return;
      }
    }

    if(driveAppDataFileId){
      const updated=await driveUpdateFile(driveAppDataFileId,payload);
      driveKnownModifiedTime=updated.modifiedTime;
    }
    if(driveMirrorFileId){
      // item 3 — the mirror write is isolated from the try/catch below on
      // purpose: appData already has the latest data at this point, so a
      // mirror failure shouldn't be treated as a failed save overall. Flag it
      // and let the retry loop catch it up standalone instead.
      let mirrorFailed=false,mirrorMsg="";
      try{
        await driveUpdateFile(driveMirrorFileId,payload);
        if(driveMirrorDirty)setMirrorDirty(false);
      }catch(mirrorErr){

      }
    }

    if(driveForceQuitted){driveForceQuitted=false;driveSaveInFlight=false;driveSaveQueued=false;return;}
    const msg=(e&&e.message)||String(e);

  driveSyncing=false;renderDriveStatus();

  // now: this re-reads trades/reflections/dq fresh (not the payload captured

  // no matter how many edits stacked up while we were busy.
  if(driveSaveQueued){
    driveSaveQueued=false;

  }

// item 7 — weekly automatic Drive backup. Reuses the existing dated .json

// button), written to regular Drive space (not appData) as a new file each
// time rather than overwritten like the mirror, and left private (no
// driveSetPublicReadable call — unlike the mirror this isn't meant to be shared).
function getLastAutoBackupDate(){
  try{const raw=localStorage.getItem(DRIVE_AUTO_BACKUP_KEY);return raw?new Date(raw):null;}catch(e){return null;}
}
function setLastAutoBackupDate(d){
  try{localStorage.setItem(DRIVE_AUTO_BACKUP_KEY,d.toISOString());}catch(e){}
}
async function maybeRunWeeklyBackup(){
  if(!driveConnected||!driveAccessToken)return;
  const last=getLastAutoBackupDate();
  const now=new Date();
  if(last&&(now-last)<DRIVE_BACKUP_INTERVAL_DAYS*24*60*60*1000)return;
  try{
    const name=`J.'s TS A${ddmmyy(now)}.json`;
    await driveCreateFile(name,driveSyncPayload(),false);
    setLastAutoBackupDate(now);
    await pruneOldBackups();
  }catch(e){
    // Best-effort background backup — a failed attempt just means
    // lastAutoBackupDate didn't move forward, so it's retried on the next
    // successful save rather than needing its own error surface.
    console.log("[drive] weekly backup failed, will retry on next save:",e.message||e);
  }
}
// Deletes auto-backup files older than 60 days. Lists files visible under the
// drive.file scope (which — since this app never opens a picker — is just the

// ── Merge-on-connect (never replace local data with an older Drive copy) ─────
// Records are unioned by id; if the same record exists on both sides the one with the newer
// `updatedAt` wins. Deletes travel as tombstones ({type,id,deletedAt}, kept 90 days) so a delete
// on one device isn't undone by a stale copy on another. A record that exists only locally is
// kept if it was created/edited after this device last synced; if it predates the last sync and
// is gone from Drive, it was deleted elsewhere (covers deletes made before tombstones existed).
const TOMB_KEEP_MS=90*24*60*60*1000;
const DRIVE_LASTSYNC_KEY="wss_drive_lastsync";
function getLastSync(){try{return parseInt(localStorage.getItem(DRIVE_LASTSYNC_KEY),10)||0;}catch(e){return 0;}}
function setLastSync(){try{localStorage.setItem(DRIVE_LASTSYNC_KEY,String(Date.now()));}catch(e){}}
function recTs(r){return(r&&r.updatedAt)||0;}
function recSig(r){const{screenshots,localCacheExcluded,...rest}=r;return JSON.stringify(rest);}
function mergeList(type,localArr,remoteArr,tombMap,lastSync,info){
  const L=new Map(localArr.map(r=>[String(r.id),r]));
  const R=new Map(remoteArr.map(r=>[String(r.id),r]));
  const out=[];
  new Set([...L.keys(),...R.keys()]).forEach(id=>{
    const l=L.get(id),r=R.get(id);
    let pick=null,fromLocal=false;
    if(l&&r){
      if(recTs(l)>recTs(r)){pick=l;fromLocal=true;}
      else if(recTs(l)===recTs(r)){pick=l;fromLocal=recSig(l)!==recSig(r);}
      else pick=r;
    }else if(l){
      const born=Math.max(recTs(l),Number(l.id)||0);
      if(lastSync&&born<lastSync)return;
      pick=l;fromLocal=true;
    }else pick=r;
    const tb=tombMap.get(type+":"+id);
    if(tb&&recTs(pick)<=tb.deletedAt)return;
    if(fromLocal)info.contributed=true;
    if(pick===l&&r&&!isHydrated(l.screenshots)&&isHydrated(r.screenshots)){
      const{localCacheExcluded,...rest}=l;
      pick={...rest,screenshots:r.screenshots};
    }
    out.push(pick);
  });
  out.sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0));

}
function mergeWithRemote(d){
  const remoteTrades=Array.isArray(d.trades)?d.trades.map(migrateTrade):[];
  const remoteRefs=Array.isArray(d.reflections)?d.reflections.map(migrateReflection):[];
  const remoteTombs=Array.isArray(d.deleted)?d.deleted:[];
  const lastSync=getLastSync();
  const now=Date.now();
  const tombMap=new Map();
  tombstones.concat(remoteTombs).forEach(tb=>{
    if(!tb||tb.id===undefined)return;
    const k=tb.type+":"+tb.id,cur=tombMap.get(k);
    if(!cur||(tb.deletedAt||0)>(cur.deletedAt||0))tombMap.set(k,{type:tb.type,id:tb.id,deletedAt:tb.deletedAt||0});
  });
  const info={contributed:false};
  const mt=mergeList("trade",trades,remoteTrades,tombMap,lastSync,info);
  const mr=mergeList("reflection",reflections,remoteRefs,tombMap,lastSync,info);
  const remoteTombKeys=new Set(remoteTombs.map(tb=>tb.type+":"+tb.id));
  if(tombstones.some(tb=>!remoteTombKeys.has(tb.type+":"+tb.id)))info.contributed=true;

  else if(dqUpdatedAt>remoteDqAt)info.contributed=true;

function periodRange(){

    const label=s.getMonth()===e.getMonth()
      ?`Week of ${MON[s.getMonth()].slice(0,3)} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`
      :`Week of ${MON[s.getMonth()].slice(0,3)} ${s.getDate()} – ${MON[e.getMonth()].slice(0,3)} ${e.getDate()}, ${e.getFullYear()}`;
    return{start:s,end:e,label};
  }
  if(periodMode==="month"){
    const s=startOfMonth(periodAnchor),e=endOfMonth(periodAnchor);

  }

    const e=parseYMD(customTo);e.setHours(23,59,59,999);

// ── Time / duration helpers ────────────────────────────────────────────────────
function dtValue(dateStr,timeStr){

  const d=parseYMD(dateStr);
  if(timeStr){
    const parts=timeStr.split(":").map(Number);
    if(!isNaN(parts[0])&&!isNaN(parts[1]))d.setHours(parts[0],parts[1],0,0);
    else d.setHours(0,0,0,0);
  }else{
    d.setHours(0,0,0,0);
  }

}
function effectiveExitDate(t){return (t.multiDay&&t.exitDate)?t.exitDate:t.date;}
function durationMinutes(t){

  const direction=t.direction||"long";
  const riskPts=!isNaN(e)&&!isNaN(s)?Math.abs(e-s):null;
  const rewardPts=!isNaN(e)&&!isNaN(tg)?Math.abs(tg-e):null;
  const risk=riskPts!==null&&mult!==null?riskPts*mult:null;
  const reward=rewardPts!==null&&mult!==null?rewardPts*mult:null;
  const rr=risk&&reward&&risk!==0?reward/risk:null;
  const dirPts=!isNaN(e)&&!isNaN(ex)?(direction==="short"?(e-ex):(ex-e)):null;
  const realizedR=dirPts!==null&&riskPts?dirPts/riskPts:null;
  const wl=!isNaN(r)?(r>0?"Win":r<0?"Loss":"BE"):null;
  const ra=t.ra||{};

function calcStats(list){

  const rrv=list.filter(t=>t.rr!==null).map(t=>t.rr);

    const a=list.filter(t=>t.dqa&&t.dqa[d.id]!==undefined);

function computeStreaks(list){
  const chron=chronoSort(list).filter(t=>t.wl==="Win"||t.wl==="Loss");
  let maxWin=0,maxLoss=0,curWin=0,curLoss=0;
  chron.forEach(t=>{

// blended result landing under only one setup.
function segmentRecords(list){

  list.forEach(t=>{
    const fills=t.fills&&t.fills.length?t.fills:legacyFillsFor(t);
    const segs=computeSegments(fills,t.direction||"long",t.setup||"Bounce");
    segs.forEach(seg=>{
      if(seg.closedQty<=0)return; // only realized legs count toward setup win-rate
      const dollars=segmentDollarResult(seg,t.ti);

      out.push({setup:seg.setup,wl:dollars>0?"Win":dollars<0?"Loss":"BE",result:dollars});

function tickerBreakdown(list){

    map[k].count++;
    const r=parseFloat(t.result);
    if(!isNaN(r))map[k].net+=r;
    if(t.wl==="Win"||t.wl==="Loss"){map[k].withWl++;if(t.wl==="Win")map[k].wins++;}

// Produces whole-dollar gridlines at round intervals so the axis never shows
// arbitrary decimals like $565.92, and so the frame only ever moves in whole
// steps rather than sliding on every new trade.

  if(lo<0&&niceLo>=lo)niceLo-=step;              // and below the trough, but only if we ever went negative

  for(let v=niceLo;v<=niceHi+0.0001;v+=step)ticks.push(Math.round(v));

// Interactive hover for one equity curve wrap element.
function initEquityHover(wrap){
  if(!wrap||wrap.dataset.hoverInit)return;
  wrap.dataset.hoverInit="1";
  let pts;
  try{pts=JSON.parse(decodeURIComponent(wrap.dataset.points));}catch(e){return;}
  if(!pts||!pts.length)return;
  const svg=wrap.querySelector("svg");
  const hitrect=wrap.querySelector(".eq-hitrect");
  const cross=wrap.querySelector(".eq-cross");
  const dot=wrap.querySelector(".eq-dot");
  const tip=wrap.querySelector(".eq-tip");
  if(!svg||!hitrect)return;
  const vb=svg.getAttribute("viewBox").split(" ");
  const vbW=parseFloat(vb[2]),vbH=parseFloat(vb[3]);
  function nearestTo(clientX){
    const rect=svg.getBoundingClientRect();
    const scaleX=vbW/rect.width;
    const localX=(clientX-rect.left)*scaleX;
    let nearest=pts[0],best=Infinity;
    pts.forEach(p=>{const d=Math.abs(p.x-localX);if(d<best){best=d;nearest=p;}});
    return nearest;
  }
  function show(p){
    cross.setAttribute("x1",p.x);cross.setAttribute("x2",p.x);cross.setAttribute("opacity","1");
    dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);dot.setAttribute("opacity","1");
    tip.style.opacity="1";
    tip.style.left=((p.x/vbW)*100)+"%";
    tip.style.top=((p.y/vbH)*100)+"%";
    tip.innerHTML=`<div><strong>${equityTooltipDate(p.date)}</strong></div><div>Equity: ${cu(p.val)}</div>`;
  }
  function hide(){cross.setAttribute("opacity","0");dot.setAttribute("opacity","0");tip.style.opacity="0";}
  hitrect.addEventListener("mousemove",e=>show(nearestTo(e.clientX)));
  hitrect.addEventListener("mouseleave",hide);
  hitrect.addEventListener("touchstart",e=>{if(e.touches[0])show(nearestTo(e.touches[0].clientX));},{passive:true});
  hitrect.addEventListener("touchmove",e=>{if(e.touches[0])show(nearestTo(e.touches[0].clientX));},{passive:true});
  hitrect.addEventListener("touchend",hide);
}

// ── Formatters ────────────────────────────────────────────────────────────────
function f2(n){return n===null||isNaN(n)?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function cu(n){if(n===null||isNaN(n))return"—";const a=f2(Math.abs(n));return n<0?`-$${a}`:`$${a}`}
function cuNoSign(n){if(n===null||isNaN(n))return"—";return `$${f2(Math.abs(n))}`}
function pc(n){return n===null||isNaN(n)?"—":`${(n*100).toFixed(1)}%`}
function sc(v){return v===null?"var(--t3)":v>=.8?"var(--g)":v>=.5?"var(--a)":"var(--r)"}
function sbg(v){return v===null?"var(--s2)":v>=.8?"var(--gbg)":v>=.5?"var(--abg)":"var(--rbg)"}
function sbd(v){return v===null?"var(--bd)":v>=.8?"var(--gbd)":v>=.5?"var(--abd)":"var(--rbd)"}
function esc(s){return (s||"").replace(/</g,"&lt;");}
function escAttr(s){return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
// Wraps case-insensitive matches of `q` inside `s` (already/about-to-be escaped for HTML)
// in <mark>. Escapes `s` itself first, so callers should pass raw text, not pre-escaped text.
function hl(s,q){
  const raw=esc(s||"");
  const query=(q||"").trim();
  if(!query)return raw;
  const re=new RegExp(reEsc(esc(query)),"ig");
  return raw.replace(re,m=>`<mark class="hlmark">${m}</mark>`);
}

  // position it just closed is exactly the shape of a fat-finger contract-count
  // entry, so give a chance to double check before it's saved.
  const revSegs=s.segments.filter(seg=>seg.isReversal&&seg.reversalFrom);

}

// ── Screenshots — resize/compress client-side before storing as base64 ───────
function compressImage(file,maxDim=1280,quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}
        else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>reject(new Error("Could not read image"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}
async function handleScreenshotUpload(evt){
  const files=Array.from(evt.target.files||[]);
  for(const f of files){
    try{
      const dataUrl=await compressImage(f);

    }catch(e){/* skip unreadable file */}

// ── Fees — single total ($), platform-aware ──────────────────────────────────
// Auto-fills from every logged fill (both adds and exits — each fill is its own
// billable side) × the selected platform's per-ticker rate, unless the person
// has typed directly into the field, or picked "Other" (manual entry, no table).
function markFeesManual(){feesManual=true;recomputeAutoResult();}
function markPlatformChanged(){
  // Switching platforms means the old auto-computed number (if any) belonged to
  // the previous platform's rate — reset the manual-override flag so it recomputes
  // fresh for the newly-selected platform, unless the person types over it again.
  feesManual=false;

function currentFeeRate(){
  const tkEl=document.getElementById("fi-ticker");

  const ticker=tkEl?tkEl.value:form.ticker;
  const platform=plEl?plEl.value:(form.platform||"tradovate");
  if(platform==="other")return null; // manual entry — no table lookup
  const table=FEE_RATES[platform];

function recomputeFees(){
  const feeEl=document.getElementById("fi-fees");
  if(!feeEl||feesManual)return;
  const rate=currentFeeRate();
  if(rate===null)return; // "Other" — leave field as-is, freely editable
  // Every logged fill (add AND exit) is its own billable side — sum contracts
  // across all of them rather than just the entry leg, so partial closes,
  // adds, and reversals all naturally accrue the right number of fee-events.
  const totalUnits=form.fills.reduce((sum,f)=>{
    const q=parseFloat(f.contracts),p=parseFloat(f.price);
    return sum+((!isNaN(q)&&q>0&&!isNaN(p))?q:0);

  feeEl.value=(rate!==undefined&&totalUnits>0)?(rate*totalUnits).toFixed(2):"";
}

// ── Segments (fills → segments) ───────────────────────────────────────────────
// A trade is a chain of fills from flat back to flat. Walking the fills in order
// and tracking a running open-quantity per leg is enough to auto-detect adds,
// partial closes, full closes, and reversals — no manual "this is a reversal"
// flag needed anywhere. An "Exit" fill whose contracts exceed what's currently
// open simply spills its remainder into a brand-new segment in the opposite
// direction (that's exactly what a reversal *is*, arithmetically). Each segment
// carries its own setup tag (Bounce/Break/Reject) so a trade that flips
// direction can correctly credit each leg to its own setup in the dashboard.
// A trade logged before the multi-fill editor existed only stores a single
// entry/exit pair directly on the trade (t.entry / t.exit), not a fills array.
// Anywhere we need to run such a trade through computeSegments(), we must
// synthesize an equivalent fills array — including the exit fill when the
// trade has one — or the trade will look permanently "open" (no exit fill
// ever closes it) even though it's actually fully closed. This mirrors the
// migration editTrade() already does when loading a legacy trade into the form.
function legacyFillsFor(t){
  const fills=[{id:1,type:"add",price:t.entry,contracts:t.contracts||"1"}];
  if(t.exit){fills.push({id:2,type:"exit",price:t.exit,contracts:t.contracts||"1"});}
  return fills;
}
function computeSegments(fills,initialDirection,initialSetup){
  const segs=[];
  let cur=null;
  function startSeg(direction,setup,isReversal){
    cur={direction,setup:setup||initialSetup,entryFills:[],exitFills:[],openQty:0,isReversal:!!isReversal,triggerFillId:null,reversalFrom:null};
    segs.push(cur);
    return cur;
  }
  (fills||[]).forEach(f=>{
    const qty=parseFloat(f.contracts)||0;
    const price=parseFloat(f.price);
    if(isNaN(price)||qty<=0)return;
    if(!cur)startSeg(initialDirection,initialSetup,false);
    if(f.type!=="exit"){
      cur.entryFills.push({price,qty});
      cur.openQty+=qty;
    }else{
      const closeQty=Math.min(qty,cur.openQty);
      if(closeQty>0){
        cur.exitFills.push({price,qty:closeQty});
        cur.openQty-=closeQty;
      }
      const remainder=qty-closeQty;
      if(remainder>0){
        const prevDirection=cur.direction;
        const newDir=prevDirection==="short"?"long":"short";
        const newSetup=f.segSetup||initialSetup;
        cur=startSeg(newDir,newSetup,true);
        cur.triggerFillId=f.id;
        cur.reversalFrom={prevDirection,closedQty:closeQty,openedQty:remainder};
        cur.entryFills.push({price,qty:remainder});
        cur.openQty+=remainder;
      }
    }
  });
  return segs.map(seg=>{
    const totalEntryQty=seg.entryFills.reduce((s,f)=>s+f.qty,0);
    const closedQty=seg.exitFills.reduce((s,f)=>s+f.qty,0);
    const weightedEntry=totalEntryQty>0?seg.entryFills.reduce((s,f)=>s+f.price*f.qty,0)/totalEntryQty:NaN;
    const weightedExit=closedQty>0?seg.exitFills.reduce((s,f)=>s+f.price*f.qty,0)/closedQty:NaN;
    return{...seg,totalEntryQty,closedQty,weightedEntry,weightedExit};
  });
}
function segmentDollarResult(seg,ti){
  if(!ti||isNaN(seg.weightedEntry)||isNaN(seg.weightedExit)||seg.closedQty<=0)return null;
  const dirPts=seg.direction==="short"?(seg.weightedEntry-seg.weightedExit):(seg.weightedExit-seg.weightedEntry);
  return dirPts*ti.perPoint*seg.closedQty;
}
// A trade's overall setup tags — the unique list across all its segments, in the
// order they first occurred. Used for the abbreviated multi-tag log display and
// for inclusive (OR) setup filtering.
function tradeSetups(t){
  const segs=computeSegments(t.fills&&t.fills.length?t.fills:legacyFillsFor(t),t.direction||"long",t.setup||"Bounce");
  const out=[];
  segs.forEach(s=>{if(s.setup&&!out.includes(s.setup))out.push(s.setup);});
  return out.length?out:[t.setup].filter(Boolean);
}

// ── Fills (scale-in / scale-out / reversal) ───────────────────────────────────
// A trade can have multiple "fills": each is an Add (opened/scaled in) or an
// Exit (closed/reduced). Contracts, weighted-avg entry/exit price, and the
// cumulative $ result all roll up automatically from the fill list, including
// across a reversal — see computeSegments() above.
// A trade is still "open" if its most recent segment never fully closed — i.e.
// the position never returned back to flat. Purely informational: this never
// blocks entering, editing, or saving anything, it's just a heads-up.
function isTradeOpen(t){
  const fills=t.fills&&t.fills.length?t.fills:legacyFillsFor(t);
  const segs=computeSegments(fills,t.direction||"long",t.setup||"Bounce");
  if(!segs.length)return false;
  const last=segs[segs.length-1];
  return last.openQty>0;
}

function getFillsSummary(){
  syncFillsFromDOM();
  const tkEl=document.getElementById("fi-ticker"),dirEl=document.getElementById("fi-direction"),setupEl=document.getElementById("fi-setup");
  const ti=tkEl?tickerInfo(tkEl.value):null;
  const direction=dirEl?dirEl.value:"long";
  const setup=setupEl?setupEl.value:form.setup;
  const segs=computeSegments(form.fills,direction,setup);
  const totalContracts=segs.reduce((s,seg)=>s+seg.totalEntryQty,0);
  const closedContracts=segs.reduce((s,seg)=>s+seg.closedQty,0);
  // Display entry = first segment's avg entry (the original thesis price); display
  // exit = the most recently closed segment's avg exit (the final close price) —
  // matches how a single-segment trade already looked, and degrades gracefully.
  const firstSeg=segs[0];
  const lastClosedSeg=[...segs].reverse().find(s=>s.closedQty>0);
  const weightedEntry=firstSeg?firstSeg.weightedEntry:NaN;
  const weightedExit=lastClosedSeg?lastClosedSeg.weightedExit:NaN;
  const lastAdd=[...form.fills].reverse().find(f=>f.type!=="exit");
  const stop=lastAdd?lastAdd.stop||"":"";
  const target=lastAdd?lastAdd.target||"":"";

  // two legs (short leg + long leg) both contribute, netted into one trade total.
  let result=null;
  if(ti){
    const realized=segs.map(seg=>segmentDollarResult(seg,ti)).filter(v=>v!==null);
    if(realized.length>0)result=realized.reduce((a,b)=>a+b,0);
  }
  return{ti,direction,totalContracts,closedContracts,weightedEntry,weightedExit,stop,target,result,segments:segs};
}
