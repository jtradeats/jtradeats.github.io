var EXP_ICON_FILTER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/></svg>';
function expF2(n){return n===null||n===undefined||isNaN(n)?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function expCuNoSign(n){if(n===null||n===undefined||isNaN(n))return"—";return"$"+expF2(Math.abs(n));}
function expPc(n){return n===null||n===undefined||isNaN(n)?"—":(n*100).toFixed(1)+"%";}
function expSc(v){return v===null||v===undefined?"var(--t3)":v>=.8?"var(--g)":v>=.5?"var(--a)":"var(--r)";}
function expSbg(v){return v===null||v===undefined?"var(--s2)":v>=.8?"var(--gbg)":v>=.5?"var(--abg)":"var(--rbg)";}
function expSbd(v){return v===null||v===undefined?"var(--bd)":v>=.8?"var(--gbd)":v>=.5?"var(--abd)":"var(--rbd)";}
function expEsc(s){return(s||"").replace(/</g,"&lt;");}
function expReEsc(s){return s.replace(/[.*+?^\${}()|[\]\\]/g,"\\$&");}
function expHl(s,q){
  var raw=expEsc(s||"");
  var query=(q||"").trim();
  if(!query)return raw;
  var re=new RegExp(expReEsc(expEsc(query)),"ig");
  return raw.replace(re,function(m){return'<mark class="hlmark">'+m+'</mark>';});
}
function expDispDate(s){if(!s)return"—";var p=s.split("-");if(p.length!==3)return s;return p[2]+"/"+p[1]+"/"+p[0].slice(2);}
function expFdur(min){if(min===null||min===undefined||isNaN(min))return"—";var h=Math.floor(min/60),m=Math.round(min%60);return h>0?h+"h "+m+"m":m+"m";}
function expFillsH(fills){
  var addIdx=0,exitIdx=0;
  return fills.map(function(f){
    if(f.type==="exit"){
      exitIdx++;
      return'<span><strong>Exit ('+exitIdx+')</strong> $'+expF2(parseFloat(f.price))+(f.contracts?' · '+f.contracts+' ct':'')+'</span>';
    }
    addIdx++;
    var stopV=f.stop?('$'+expF2(parseFloat(f.stop))):"—";
    var targetV=f.target?('$'+expF2(parseFloat(f.target))):"—";
    return'<span><strong>Entry ('+addIdx+')</strong> $'+expF2(parseFloat(f.price))+(f.contracts?' · '+f.contracts+' ct':'')+'</span><span><strong>Stop</strong> '+stopV+'</span><span><strong>Target</strong> '+targetV+'</span>';
  }).join("");
}
function expUniqueTickers(){var s={};EXP_TRADES.forEach(function(t){s[(t.ticker||"").toUpperCase()]=1;});return Object.keys(s).sort();}
function expUniqueSetups(){var s={};EXP_TRADES.forEach(function(t){(t.setups||[t.setup]).forEach(function(su){if(su)s[su]=1;});});return Object.keys(s).sort();}
function expSetupAbbr(su){return su==="Bounce"?"B":su==="Reject"?"R":su==="Break"?"Br":su;}
function expSearchMatch(t){
  // Matches everything in a trade, not just the columns visible in the collapsed
  // row — comments only show once a row is expanded, but search still needs to
  // find them without opening every row first.
  var q=expSearchQuery.trim().toLowerCase();
  if(!q)return true;
  var lc=t.lossCat?(EXP_LCMAP[t.lossCat]||""):"";
  var hay=[t.ticker].concat(t.setups||[t.setup]).concat([t.wl,t.direction,expDispDate(t.date),t.comments,lc]).filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(q)!==-1;
}
function expApplyLogFilters(list){
  return list.filter(function(t){
    var tsetups=t.setups||[t.setup];
    if(expLogFilters.ticker.length&&expLogFilters.ticker.indexOf((t.ticker||"").toUpperCase())===-1)return false;
    if(expLogFilters.setup.length&&!tsetups.some(function(su){return expLogFilters.setup.indexOf(su)!==-1;}))return false;
    if(expLogFilters.wl.length&&expLogFilters.wl.indexOf(t.wl)===-1)return false;
    if(expLogFilters.process.length){
      if(t.isGood===null||t.isGood===undefined)return false;
      var procVal=t.isGood?"good":"bad";
      if(expLogFilters.process.indexOf(procVal)===-1)return false;
    }
    if(expLogFilters.lossCat.length&&expLogFilters.lossCat.indexOf(t.lossCat)===-1)return false;
    if(!expSearchMatch(t))return false;
    return true;
  });
}
function expApplyLogSort(list){
  var col=expLogSort.col,dir=expLogSort.dir,mult=dir==="asc"?1:-1;
  function val(t){
    switch(col){
      case"date":return t.date||"";
      case"ticker":return t.ticker?t.ticker.toUpperCase():"";
      case"setup":return t.setup||"";
      case"result":{var r=parseFloat(t.result);return isNaN(r)?-Infinity:r;}
      case"wl":return t.wl||"";
      case"rules":return(t.rs===null||t.rs===undefined)?-1:t.rs;
      case"process":return(t.isGood===null||t.isGood===undefined)?-1:(t.isGood?1:0);
      default:return t.date||"";
    }
  }
  return list.slice().sort(function(a,b){
    var av=val(a),bv=val(b);
    if(av<bv)return-1*mult;
    if(av>bv)return 1*mult;
    return(b.date||"").localeCompare(a.date||"");
  });
}
function expSetLogSort(col){
  if(expLogSort.col===col){expLogSort.dir=expLogSort.dir==="asc"?"desc":"asc";}
  else{expLogSort.col=col;expLogSort.dir=col==="date"?"desc":"asc";}
  renderExpLog();
}
function expHasLogFilters(){return Object.keys(expLogFilters).some(function(k){return expLogFilters[k].length>0;});}
function expClearLogFilters(){expLogFilters={ticker:[],setup:[],wl:[],process:[],lossCat:[]};renderExpLog();}
// Button-style multi-select filter dropdowns, matching the main journal.
function expToggleLogFilterDropdown(key,ev){
  if(ev)ev.stopPropagation();
  expLogFilterOpen=expLogFilterOpen===key?null:key;
  renderExpLog();
}
function expToggleLogFilterValue(key,val,ev){
  if(ev)ev.stopPropagation();
  var cur=expLogFilters[key];
  var i=cur.indexOf(val);
  if(i===-1)cur.push(val);else cur.splice(i,1);
  renderExpLog();
}
function expClearOneLogFilter(key,ev){
  if(ev)ev.stopPropagation();
  expLogFilters[key]=[];
  renderExpLog();
}
function expCloseLogFilterDropdown(){if(expLogFilterOpen){expLogFilterOpen=null;renderExpLog();}}
function expCountForFilterOption(key,val,list){
  return list.filter(function(t){
    var tsetups=t.setups||[t.setup];
    if(key!=="ticker"&&expLogFilters.ticker.length&&expLogFilters.ticker.indexOf((t.ticker||"").toUpperCase())===-1)return false;
    if(key!=="setup"&&expLogFilters.setup.length&&!tsetups.some(function(su){return expLogFilters.setup.indexOf(su)!==-1;}))return false;
    if(key!=="wl"&&expLogFilters.wl.length&&expLogFilters.wl.indexOf(t.wl)===-1)return false;
    if(key!=="process"&&expLogFilters.process.length){
      if(t.isGood===null||t.isGood===undefined)return false;
      var procVal=t.isGood?"good":"bad";
      if(expLogFilters.process.indexOf(procVal)===-1)return false;
    }
    if(key!=="lossCat"&&expLogFilters.lossCat.length&&expLogFilters.lossCat.indexOf(t.lossCat)===-1)return false;
    if(!expSearchMatch(t))return false;
    switch(key){
      case"ticker":return(t.ticker||"").toUpperCase()===val;
      case"setup":return tsetups.indexOf(val)!==-1;
      case"wl":return t.wl===val;
      case"process":return t.isGood!==null&&t.isGood!==undefined&&(t.isGood?"good":"bad")===val;
      case"lossCat":return t.lossCat===val;
      default:return false;
    }
  }).length;
}
function expRenderFilterBtn(key,allLabel,opts,list){
  var cur=expLogFilters[key];
  var open=expLogFilterOpen===key;
  var curLabel=allLabel;
  if(cur.length===1){
    var match=null;
    for(var i=0;i<opts.length;i++){if(opts[i].val===cur[0]){match=opts[i];break;}}
    curLabel=match?match.label:cur[0];
  }else if(cur.length>1){
    var match2=null;
    for(var j=0;j<opts.length;j++){if(opts[j].val===cur[0]){match2=opts[j];break;}}
    curLabel=(match2?match2.label:cur[0])+' +'+(cur.length-1);
  }
  var rowsHtml=opts.map(function(o){
    return'<label class="filterdd-row filterdd-check"><input type="checkbox" '+(cur.indexOf(o.val)!==-1?"checked":"")+' onchange="expToggleLogFilterValue(\\''+key+'\\',\\''+o.val+'\\',event)"/><span class="filterdd-label">'+expEsc(o.label)+'</span><span class="filterdd-count">('+(list?expCountForFilterOption(key,o.val,list):0)+')</span></label>';
  }).join("");
  return'<div class="filterdd-wrap">'+
    '<button class="filterbtn'+((cur.length>0||open)?" on":"")+'" onclick="expToggleLogFilterDropdown(\\''+key+'\\',event)" title="filter by '+allLabel.replace('all ','')+'">'+expEsc(curLabel)+'</button>'+
    (open?('<div class="filterdd" onclick="event.stopPropagation()"><button class="filterdd-row" onclick="expClearOneLogFilter(\\''+key+'\\',event)">'+allLabel+'</button>'+rowsHtml+'</div>'):"")+
  '</div>';
}
// Search icon/field toggle + live search-as-you-type, matching the main journal.
function expToggleSearch(ev){
  if(ev)ev.stopPropagation();
  expSearchOpen=!expSearchOpen;
  expSearchLocked=false;
  expSearchNavIndex=-1;
  if(!expSearchOpen)expSearchQuery="";
  renderExpLog();
  if(expSearchOpen){
    requestAnimationFrame(function(){var el=document.getElementById("expsearch-input");if(el)el.focus();});
  }
}
function expCloseSearch(){
  if(!expSearchOpen)return;
  expSearchOpen=false;expSearchQuery="";expSearchLocked=false;expSearchNavIndex=-1;
  renderExpLog();
}
function expOnSearchInput(el){
  expSearchQuery=el.value;
  expSearchNavIndex=-1;
  var pos=el.selectionStart;
  renderExpLog();
  requestAnimationFrame(function(){
    var ni=document.getElementById("expsearch-input");
    if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}
  });
}
function expOnSearchKeydown(ev){
  if(ev.key==="Enter"){ev.preventDefault();expSearchLocked=true;}
  else if(ev.key==="Escape"){ev.preventDefault();expCloseSearch();}
}
function expCurrentSearchMatches(){
  if(!expSearchQuery.trim())return[];
  return expApplyLogSort(expApplyLogFilters(EXP_TRADES));
}
function expSearchNav(dir,ev){
  if(ev)ev.stopPropagation();
  var list=expCurrentSearchMatches();
  if(!list.length)return;
  if(expSearchNavIndex<0)expSearchNavIndex=dir>0?0:list.length-1;
  else expSearchNavIndex=(expSearchNavIndex+dir+list.length)%list.length;
  var t=list[expSearchNavIndex];
  if(!t)return;
  expExpandedIds.add(t.id); // reveal fields (e.g. comments) that only show once expanded
  renderExpLog();
  requestAnimationFrame(function(){
    var el=document.getElementById("exptraderow-"+t.id);
    if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
  });
}
function expToggleExpand(id){
  if(expExpandedIds.has(id))expExpandedIds.delete(id);else expExpandedIds.add(id);
  renderExpLog();
}
// Master expand/collapse-all toggle — collapses everything if any currently
// visible (filtered/sorted) row is open, otherwise expands all.
function expToggleExpandAll(){
  var list=expApplyLogSort(expApplyLogFilters(EXP_TRADES));
  var anyOpen=list.some(function(t){return expExpandedIds.has(t.id);});
  if(anyOpen)expExpandedIds.clear();
  else list.forEach(function(t){expExpandedIds.add(t.id);});
  renderExpLog();
}
function expExpandRowH(t){
  var ra=t.ra||{},dqa=t.dqa||{};
  var dirLabel=t.direction==="short"?"Short":"Long";
  var entryStr=t.entryTime?(expDispDate(t.date)+" "+t.entryTime):expDispDate(t.date);
  var exitDateStr=(t.multiDay&&t.exitDate)?t.exitDate:t.date;
  var exitStr=t.exitTime?(expDispDate(exitDateStr)+" "+t.exitTime):"—";
  var rulesHtml=EXP_RULES.map(function(rule){
    var a=ra[rule.id];
    var c=a==="yes"?"var(--g)":a==="no"?"var(--r)":"var(--t3)";
    var lb=a==="yes"?"✓ Yes":a==="no"?"✗ No":"—";
    return'<div class="explistrow"><span>'+expEsc(rule.text)+'</span><span style="color:'+c+';font-weight:700">'+lb+'</span></div>';
  }).join("");
  var dqHtml=EXP_DQ.map(function(d){
    var a=dqa[d.id];
    var c=a===true?"var(--r)":a===false?"var(--g)":"var(--t3)";
    var lb=a===true?"⚠ Violated":a===false?"Clean":"—";
    return'<div class="explistrow"><span>'+expEsc(d.text)+'</span><span style="color:'+c+';font-weight:700">'+lb+'</span></div>';
  }).join("");
  var shots=t.localCacheExcluded
    ?'<div class="expsub">screenshots</div><div class="dqok">not cached locally — synced to Drive, open the app to view</div>'
    :(t.screenshots&&t.screenshots.length>0)
    ?'<div class="expsub">screenshots <span style="text-transform:none;color:var(--t3)">— click to view full size</span></div><div class="ssgallery">'+t.screenshots.map(function(sh){return'<img src="'+sh.dataUrl+'" alt="screenshot" onclick="openLB(this.src)"/>';}).join("")+'</div>'
    :'<div class="expsub">screenshots</div><div class="dqok">no screenshots attached</div>';
  var feesNum=parseFloat(t.fees);
  var platformLabel=t.platform==="tradovate"?"Tradovate":t.platform==="ninjatrader"?"NinjaTrader":"Other";
  return'<tr class="exprow"><td colspan="'+EXP_LOG_COLS+'"><div class="exppanel">'+
    '<div class="expmeta">'+
      '<span><strong>Direction</strong> '+dirLabel+'</span>'+
      '<span><strong>Entry</strong> '+entryStr+'</span>'+
      '<span><strong>Exit</strong> '+exitStr+'</span>'+
      '<span><strong>Duration</strong> '+expFdur(t.durationMin)+'</span>'+
      '<span><strong>Realized R</strong> '+((t.realizedR!==null&&t.realizedR!==undefined)?expF2(t.realizedR)+":1":"—")+'</span>'+
      '<span><strong>Rules score</strong> '+((t.rs!==null&&t.rs!==undefined)?expPc(t.rs):"—")+'</span>'+
      ((!isNaN(feesNum)&&feesNum>0)?'<span><strong>Fees</strong> -'+expCuNoSign(feesNum)+' <span style="color:var(--t3)">('+platformLabel+')</span></span>':"")+
      (t.lossCat?'<span><strong>Loss type</strong> '+(EXP_LCMAP[t.lossCat]||"")+'</span>':"")+
    '</div>'+
    (t.segsDisplay?'<div class="expmeta" style="margin-top:-6px">'+t.segsDisplay.map(function(seg,i){
      var segDollars=seg.dollars;
      var segCol=(segDollars===null||segDollars===undefined)?"var(--t3)":segDollars>0?"var(--g)":segDollars<0?"var(--r)":"var(--t)";
      var dirLbl=seg.direction==="short"?"Short":"Long";
      return'<span><strong>Leg '+(i+1)+' ('+dirLbl+' · '+seg.setup+')</strong> <span style="color:'+segCol+'">'+((segDollars!==null&&segDollars!==undefined)?expCuNoSign(segDollars):"open")+'</span></span>';
    }).join("")+'</div>':"")+
    ((t.fills&&t.fills.length>1)?'<div class="expmeta" style="margin-top:-6px">'+expFillsH(t.fills)+'</div>':"")+
    ((t.comments&&t.comments.trim())?'<div class="expsub">comments</div><div class="expcomment">'+expHl(t.comments,expSearchQuery)+'</div>':"")+
    '<div class="expcols" style="margin-top:18px">'+
      '<div><div class="expsub">rules checklist</div>'+rulesHtml+'<div class="expsub" style="margin-top:16px">disqualifiers</div>'+dqHtml+'</div>'+
      '<div>'+shots+'</div>'+
    '</div>'+
  '</div></td></tr>';
}
function renderExpLog(){
  var root=document.getElementById("exp-log-root");
  if(!root)return;
  var list=expApplyLogSort(expApplyLogFilters(EXP_TRADES));
  var filtersOn=expHasLogFilters();
  var anyExpanded=list.some(function(t){return expExpandedIds.has(t.id);});
  var LOG_HEADERS=[
    {key:"date",label:"date"},{key:"ticker",label:"ticker"},{key:"setup",label:"setup"},
    {key:null,label:"contracts"},{key:null,label:"entry"},{key:null,label:"stop"},{key:null,label:"target"},{key:null,label:"exit"},
    {key:"result",label:"result"},{key:"wl",label:"w/l"},{key:"rules",label:"rules"},{key:"process",label:"process"}
  ];
  var theadHtml=LOG_HEADERS.map(function(h){
    if(!h.key)return"<th>"+h.label+"</th>";
    var active=expLogSort.col===h.key;
    var arrow=active?'<span class="sortarrow">'+(expLogSort.dir==="asc"?"▲":"▼")+'</span>':"";
    var leftAlign=h.key==="rules"?' style="text-align:left"':"";
    return'<th class="sortable'+(active?" sorted":"")+'"'+leftAlign+' onclick="expSetLogSort(\\''+h.key+'\\')" title="sort by '+h.label+'">'+h.label+arrow+"</th>";
  }).join("");
  var tickerOpts=expUniqueTickers().map(function(tk){return{val:tk,label:tk};});
  var setupOpts=expUniqueSetups().map(function(su){return{val:su,label:su};});
  var lossOpts=EXP_LOSSCATS.map(function(c){return{val:c.id,label:c.label};});
  var filterBar=EXP_TRADES.length>0?(
    '<div class="logfilterbar">'+
    '<button class="topicon" onclick="expToggleExpandAll()" title="'+(anyExpanded?"collapse all":"expand all")+'">'+(anyExpanded?EXP_ICON_TRIDOWN:EXP_ICON_TRIRIGHT)+'</button>'+
    '<span class="topicon" style="cursor:default;margin-right:-4px" title="filters">'+EXP_ICON_FILTER+'</span>'+
    expRenderFilterBtn("ticker","all tickers",tickerOpts,EXP_TRADES)+
    '<span class="iconsep">|</span>'+
    expRenderFilterBtn("setup","all setups",setupOpts,EXP_TRADES)+
    '<span class="iconsep">|</span>'+
    expRenderFilterBtn("wl","all W/L",[{val:"Win",label:"Win"},{val:"Loss",label:"Loss"},{val:"BE",label:"Breakeven"}],EXP_TRADES)+
    '<span class="iconsep">|</span>'+
    expRenderFilterBtn("process","all process",[{val:"good",label:"Good"},{val:"bad",label:"Bad"}],EXP_TRADES)+
    '<span class="iconsep">|</span>'+
    expRenderFilterBtn("lossCat","all loss types",lossOpts,EXP_TRADES)+
    (filtersOn?'<button class="filterclear" onclick="expClearLogFilters()" title="clear all filters">'+EXP_ICON_X+'</button>':"")+
    '<div class="logbaricons">'+
      '<span class="searchwrap">'+
        ((expSearchOpen&&expCurrentSearchMatches().length>0)?(
          '<button class="topicon" onclick="expSearchNav(-1,event)" title="previous match">'+EXP_ICON_TRILEFT+'</button>'+
          '<button class="topicon" onclick="expSearchNav(1,event)" title="next match">'+EXP_ICON_TRIRIGHT+'</button>'
        ):"")+
        (expSearchOpen?
          '<span class="searchpill" onclick="event.stopPropagation()">'+EXP_ICON_SEARCH+'<input id="expsearch-input" placeholder="" value="'+expEsc(expSearchQuery)+'" oninput="expOnSearchInput(this)" onkeydown="expOnSearchKeydown(event)"/></span>'
          :'<button class="topicon" onclick="expToggleSearch(event)" title="search trades">'+EXP_ICON_SEARCH+'</button>')+
      '</span>'+
    '</div>'+
    '</div>'
  ):"";
  var bodyHtml;
  if(EXP_TRADES.length===0){
    bodyHtml='<div class="empty2">no trades in this period</div>';
  }else if(list.length===0){
    bodyHtml='<div class="empty2">no trades match these filters — try clearing filters</div>';
  }else{
    var rows=list.map(function(t){
      var res=parseFloat(t.result);
      var rc=t.wl==="Win"?"var(--g)":t.wl==="Loss"?"var(--r)":"var(--t)";
      var col=expSc(t.rs),bg=expSbg(t.rs),bd=expSbd(t.rs);
      var sl=(t.rs!==null&&t.rs!==undefined)?(t.fc+"/"+t.ac):"—";
      var isOpen=expExpandedIds.has(t.id);
      var row='<tr class="trow" id="exptraderow-'+t.id+'" onclick="expToggleExpand('+t.id+')">'+
        '<td style="font-size:var(--fsm);color:var(--t2);padding-left:20px;padding-right:20px">'+expHl(expDispDate(t.date),expSearchQuery)+'</td>'+
        '<td style="font-weight:700">'+expHl(t.ticker?t.ticker.toUpperCase():"",expSearchQuery)+'</td>'+
        '<td>'+(t.setups||[t.setup]).map(function(su){return'<span class="pill pneu">'+expHl(expSetupAbbr(su),expSearchQuery)+'</span>';}).join(" ")+'</td>'+
        '<td style="padding-left:6px;padding-right:6px">'+(t.contracts||"—")+'</td>'+
        '<td>$'+expF2(t.entry)+'</td>'+
        '<td style="color:var(--r)">$'+expF2(t.stop)+'</td>'+
        '<td style="color:var(--g)">$'+expF2(t.target)+'</td>'+
        '<td>'+(t.exit?"$"+expF2(t.exit):"—")+'</td>'+
        '<td style="font-weight:700;color:'+rc+'">'+(!isNaN(res)?expCuNoSign(res):"—")+'</td>'+
        '<td>'+(t.wl?'<span class="pill p'+t.wl.toLowerCase()+'">'+t.wl+'</span>':"—")+'</td>'+
        '<td><div class="rulesflex"><span class="spill" style="background:'+bg+';color:'+col+';border:.5px solid '+bd+'" title="rules followed">'+sl+'</span>'+((t.comments&&t.comments.trim())?'<span title="has comment">📝</span>':"")+((t.screenshots&&t.screenshots.length>0)?'<span title="has screenshots">📷</span>':"")+'</div></td>'+
        '<td>'+((t.isGood!==null&&t.isGood!==undefined)?'<span class="pill '+(t.isGood?"pgood":"pbad")+'">'+(t.isGood?"Good":"Bad")+'</span>':"—")+'</td>'+
      '</tr>';
      return row+(isOpen?expExpandRowH(t):"");
    }).join("");
    bodyHtml='<div class="twrap"><table><thead><tr>'+theadHtml+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  var countBar=EXP_TRADES.length>0?('<div class="lcountbottom">'+list.length+' of '+EXP_TRADES.length+' trades shown</div>'):"";
  root.innerHTML=filterBar+bodyHtml+countBar;
}

var eqSvgInstanceCounter=0;
var EQ_MONTH_ABBR=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ── Partial refresh — leveraged risk preview ──────────────────────────────────
function refreshRiskPreview(){
  const container=document.getElementById("risk-preview");
  if(!container)return;
  const s=getFillsSummary();
  const stopNum=parseFloat(s.stop),targetNum=parseFloat(s.target);
  if(!s.ti||isNaN(s.weightedEntry)||(isNaN(stopNum)&&isNaN(targetNum))){
    container.innerHTML=`<div style="font-size:var(--fxs);color:var(--t3);margin-top:8px">enter entry + stop/target to preview leveraged $ risk</div>`;
    return;
  }
  const contracts=s.totalContracts||1;
  const mult=s.ti.perPoint*contracts;
  const riskPts=!isNaN(stopNum)?Math.abs(s.weightedEntry-stopNum):null;
  const rewardPts=!isNaN(targetNum)?Math.abs(targetNum-s.weightedEntry):null;
  const risk=riskPts!==null?riskPts*mult:null;
  const reward=rewardPts!==null?rewardPts*mult:null;
  const rr=risk&&reward&&risk!==0?reward/risk:null;
  let realizedLine="";
  if(s.closedContracts>0&&!isNaN(s.weightedExit)&&riskPts){
    const dirPts=s.direction==="short"?(s.weightedEntry-s.weightedExit):(s.weightedExit-s.weightedEntry);
    const realizedR=dirPts/riskPts;
    const realizedDollar=dirPts*s.ti.perPoint*s.closedContracts-getFeesTotal(); // net of fees, so this preview matches what fi-result actually saves
    realizedLine=`<br/>closed ${s.closedContracts}/${contracts} → realized <strong style="color:${realizedDollar>=0?"var(--g)":"var(--r)"}">${cu(realizedDollar)}</strong> (${f2(realizedR)}:1 of planned risk, net of fees)`;
  }
  container.innerHTML=`<div class="eform" style="margin-top:8px">
    ${s.ti.symbol} · $${f2(s.ti.perPoint)}/pt × ${contracts} contract${contracts===1?"":"s"} (position size) · tick $${f2(s.ti.tickDollar)}<br/>
    avg entry <strong>$${f2(s.weightedEntry)}</strong><br/>
    ${risk!==null?`<span style="color:var(--r)">risk ${cu(-risk)}</span>`:""}${risk!==null&&reward!==null?" · ":""}${reward!==null?`<span style="color:var(--g)">reward ${cu(reward)}</span>`:""}${rr!==null?` · <strong>${f2(rr)}:1</strong>`:""}${realizedLine}
  </div>`;
}

// ── Calendar heatmap — includes a weekly "Total" column ───────────────────────
function calendarH(en,opts){
  opts=opts||{};
  const mob=isMobile()&&!opts.detailsMode;
  if(periodMode!=="week"&&periodMode!=="month")return"";
  const byDay=aggregateByDay(en);
  function cellFor(dObj,label){
    if(!dObj)return`<div class="calcell empty"></div>`;
    const info=byDay[ymd(dObj)];
    const cls=!info?"neutral":info.net>0?"win":info.net<0?"loss":"neutral";
    const lbl=label!==undefined?label:String(dObj.getDate());
    if(mob)return`<div class="calcell ${cls}"${info?` onclick="showDayDetail('${ymd(dObj)}')" style="cursor:pointer"`:""}><span class="caldate">${dObj.getDate()}</span>${info?`<div class="calpnl">${cuRound(info.net)}</div>`:""}</div>`;
    return`<div class="calcell ${cls}"><span class="caldate">${lbl}</span>${info?`<div><div class="calpnl">${cu(info.net)}</div><div class="calcnt">${info.count} trade${info.count!==1?"s":""}</div></div>`:""}</div>`;
  }
  function totalCell(days){
    let net=0,count=0;
    days.forEach(d=>{if(!d)return;const info=byDay[ymd(d)];if(info){net+=info.net;count+=info.count;}});
    const cls=count===0?"neutral":net>0?"win":net<0?"loss":"neutral";
    if(mob)return`<div class="calcell total ${cls}"><span class="caldate">&nbsp;</span>${count>0?`<div class="calpnl">${cuRound(net)}</div>`:""}</div>`;
    return`<div class="calcell total ${cls}"><span class="caldate">Total</span>${count>0?`<div><div class="calpnl">${cu(net)}</div><div class="calcnt">${count} trade${count!==1?"s":""}</div></div>`:""}</div>`;
  }
  const mode=periodMode;
  let rowsHtml="";
  if(mode==="month"){
    const s=startOfMonth(periodAnchor);
    const daysInMonth=endOfMonth(periodAnchor).getDate();
    const leadBlank=s.getDay();
    let week=new Array(leadBlank).fill(null);
    for(let day=1;day<=daysInMonth;day++){
      week.push(new Date(s.getFullYear(),s.getMonth(),day));
      if(week.length===7){rowsHtml+=week.map(d=>cellFor(d)).join("")+totalCell(week);week=[];}
    }
    if(week.length>0){while(week.length<7)week.push(null);rowsHtml+=week.map(d=>cellFor(d)).join("")+totalCell(week);}
  }else{
    // Sun–Fri only (6 columns) — no Saturday session, so no Saturday column.
    const s=startOfWeek(periodAnchor);
    const week=[];
    for(let i=0;i<6;i++){const d=new Date(s);d.setDate(s.getDate()+i);week.push(d);}
    rowsHtml=week.map((d,i)=>cellFor(d,`${DOW[i]} ${d.getDate()}`)).join("")+totalCell(week);
  }
  const title=opts.label!==undefined?opts.label:(mode==="month"?"calendar":"week overview");
  const dowHeaders=mode==="month"?DOW:DOW.slice(0,6);
  const gridInner=`<div class="calgrid${mob?" calmobile":""}" style="grid-template-columns:repeat(${dowHeaders.length},${mob?"minmax(0,1fr)":"1fr"}) ${mob?"minmax(0,1.2fr)":"1.1fr"}">${[...dowHeaders,"Total"].map(d=>`<div class="caldow">${d}</div>`).join("")}${rowsHtml}</div>`;
  if(opts.detailsMode){
    // Static export build: a native <details> needs no JS to stay collapsible,
    // and always starts open (open attribute present) — unlike the live
    // journal, this never auto-collapses just because the period is "month".
    return`<details class="statsdetails" open><summary class="seclab">${title}</summary>${gridInner}</details>`;
  }
  const collapsible=!!opts.collapsible;
  const arrow=collapsible?(opts.collapsed?"▸ ":"▾ "):"";
  const headerHtml=`<p class="seclab"${collapsible?' style="cursor:pointer;user-select:none" onclick="toggleCalendarCollapse()"':""}>${arrow}${title}</p>`;
  const gridHtml=(collapsible&&opts.collapsed)?"":gridInner;
  return`<div class="calwrap">${headerHtml}${gridHtml}</div>`;
}

// Applies only to the trade-log table view. Dashboard stats keep using the
// period-filtered list untouched, per the existing global period bar.
function setLogSort(col){
  if(logSort.col===col){logSort.dir=logSort.dir==="asc"?"desc":"asc";}
  else{logSort.col=col;logSort.dir=col==="date"?"desc":"asc";}
  render();
}
function clearLogFilters(){logFilters={ticker:[],setup:[],wl:[],process:[],lossCat:[]};render();}
function hasLogFilters(){return Object.values(logFilters).some(v=>v.length>0);}
function uniqueTickersUsed(){
  return Array.from(new Set(trades.map(t=>t.ticker.toUpperCase()))).sort();

// item 1 (follow-up) — button-style filter dropdowns replacing native <select>s.
function toggleLogFilterDropdown(key,ev){
  if(ev)ev.stopPropagation();
  logFilterOpen=logFilterOpen===key?null:key;
  render();
}
function toggleLogFilterValue(key,val,ev){
  // Multi-select: toggles one value in the array and keeps the dropdown open
  // so several options can be picked in one go — it only closes on outside click.
  if(ev)ev.stopPropagation();
  const cur=logFilters[key];
  const i=cur.indexOf(val);
  if(i===-1)cur.push(val);else cur.splice(i,1);
  render();
}
function clearOneLogFilter(key,ev){
  if(ev)ev.stopPropagation();
  logFilters[key]=[];
  render();
}
function closeLogFilterDropdown(){if(logFilterOpen){logFilterOpen=null;render();}}
// Relative option counts — for a given dropdown (key) and candidate value, counts
// trades that match every OTHER currently-active filter (and the search box) plus
// this specific value, so counts update live as other filters are picked (e.g.
// picking ticker=MCL makes every other dropdown's counts reflect MCL-only trades).
function countForFilterOption(key,val,list){
  return list.filter(t=>{
    const tsetups=t.setups||[t.setup];
    if(key!=="ticker"&&logFilters.ticker.length&&!logFilters.ticker.includes((t.ticker||"").toUpperCase()))return false;
    if(key!=="setup"&&logFilters.setup.length&&!tsetups.some(su=>logFilters.setup.includes(su)))return false;
    if(key!=="wl"&&logFilters.wl.length&&!logFilters.wl.includes(t.wl))return false;
    if(key!=="process"&&logFilters.process.length){
      if(t.isGood===null||t.isGood===undefined)return false;
      const procVal=t.isGood?"good":"bad";
      if(!logFilters.process.includes(procVal))return false;
    }
    if(key!=="lossCat"&&logFilters.lossCat.length&&!logFilters.lossCat.includes(t.lossCat))return false;
    if(!logSearchMatch(t))return false;
    switch(key){
      case"ticker":return(t.ticker||"").toUpperCase()===val;
      case"setup":return tsetups.includes(val);
      case"wl":return t.wl===val;
      case"process":return t.isGood!==null&&t.isGood!==undefined&&(t.isGood?"good":"bad")===val;
      case"lossCat":return t.lossCat===val;
      default:return false;
    }
  }).length;
}
function renderFilterBtn(key,allLabel,opts,list){
  const cur=logFilters[key];
  const open=logFilterOpen===key;
  let curLabel=allLabel;
  if(cur.length===1){
    const match=opts.find(o=>o.val===cur[0]);
    curLabel=match?match.label:cur[0];
  }else if(cur.length>1){
    const match=opts.find(o=>o.val===cur[0]);
    curLabel=`${match?match.label:cur[0]} +${cur.length-1}`;
  }
  return`<div class="filterdd-wrap">
    <button class="filterbtn${(cur.length>0||open)?" on":""}" onclick="toggleLogFilterDropdown('${key}',event)" aria-label="filter by ${allLabel.replace('all ',"")}">${esc(curLabel)}</button>
    ${open?`<div class="filterdd" onclick="event.stopPropagation()">
      <button class="filterdd-row" onclick="clearOneLogFilter('${key}',event)">${allLabel}</button>
      ${opts.map(o=>`<label class="filterdd-row filterdd-check"><input type="checkbox" ${cur.includes(o.val)?"checked":""} onchange="toggleLogFilterValue('${key}','${o.val}',event)"/><span class="filterdd-label">${esc(o.label)}</span><span class="filterdd-count">(${list?countForFilterOption(key,o.val,list):0})</span></label>`).join("")}
    </div>`:""}
  </div>`;
}
// item 1 (follow-up) — search icon/field toggle + live search-as-you-type.
// logSearchLocked/refSearchLocked: once the person presses Enter in the search
// box, it "holds" — stays open through outside clicks (e.g. expanding collapsed
// rows one by one) instead of auto-closing — and only exits on Esc or clicking
// the search icon again.
function toggleLogSearch(ev){
  if(ev)ev.stopPropagation();
  logSearchOpen=!logSearchOpen;
  logSearchLocked=false;
  logSearchNavIndex=-1;
  logSearchCurrentId=null;
  if(!logSearchOpen)logSearchQuery="";
  render();
  if(logSearchOpen){
    requestAnimationFrame(()=>{const el=document.getElementById("logsearch-input");if(el)el.focus();});
  }
}
function closeLogSearch(){
  if(!logSearchOpen)return;
  logSearchOpen=false;logSearchQuery="";logSearchLocked=false;logSearchNavIndex=-1;logSearchCurrentId=null;
  render();
}
function onLogSearchInput(el){
  logSearchQuery=el.value;
  logSearchNavIndex=-1;
  logSearchCurrentId=null;
  const pos=el.selectionStart;
  render();
  requestAnimationFrame(()=>{
    const ni=document.getElementById("logsearch-input");
    if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}
  });
}
// Enter jumps to the first match and locks the search open; pressing Enter again
// steps to the next match, Shift+Enter to the previous — the same rhythm as a
// browser's built-in Ctrl+F find bar, so once you've clicked into the search box
// you never have to reach for the arrow buttons at all.
function onLogSearchKeydown(ev){
  if(ev.key==="Enter"){ev.preventDefault();logSearchLocked=true;logSearchNav(ev.shiftKey?-1:1,ev);}
  else if(ev.key==="Escape"){ev.preventDefault();closeLogSearch();}
}
function currentLogSearchMatches(){
  if(!logSearchQuery.trim())return[];
  return applyLogSort(applyLogFilters(getFilteredTrades()));
}
// Steps the "current match" pointer to the next/previous result and loops back
// around at either end (endless cycle). The current match gets a distinct row
// highlight (see logH()/CSS .trow-current) in addition to the usual bolded text
// highlight every match already gets, and its detail panel auto-opens — that's
// what makes each click visibly "jump" to a new result instead of just quietly
// re-scrolling to content that's already on screen. logSearchCurrentId (not
// expandedIds) drives the auto-open, so moving on from a match closes its panel
// back up again unless the person separately toggled it open by hand.
// Refocusing the search input at the end (rather than only on button clicks)
// means Enter/Shift+Enter keep working for repeated presses without the person
// needing to click back into the box each time.
function logSearchNav(dir,ev){
  if(ev)ev.stopPropagation();
  const list=currentLogSearchMatches();
  if(!list.length)return;
  if(logSearchNavIndex<0)logSearchNavIndex=dir>0?0:list.length-1;
  else logSearchNavIndex=(logSearchNavIndex+dir+list.length)%list.length;
  const t=list[logSearchNavIndex];
  if(!t)return;
  logSearchCurrentId=t.id;
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById(`traderow-${t.id}`);
    if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
    const input=document.getElementById("logsearch-input");
    if(input)input.focus();
  });
}
function toggleRefSearch(ev){
  if(ev)ev.stopPropagation();
  refSearchOpen=!refSearchOpen;
  refSearchLocked=false;
  refSearchNavIndex=-1;
  refSearchCurrentId=null;
  if(!refSearchOpen)refSearchQuery="";
  render();
  if(refSearchOpen){

}
function closeRefSearch(){

}
function onRefSearchInput(el){

// See onLogSearchKeydown() above — same Enter/Shift+Enter find-bar rhythm.
function onRefSearchKeydown(ev){
  if(ev.key==="Enter"){ev.preventDefault();refSearchLocked=true;refSearchNav(ev.shiftKey?-1:1,ev);}
  else if(ev.key==="Escape"){ev.preventDefault();closeRefSearch();}
}
function currentRefSearchMatches(){
  if(!refSearchQuery.trim())return[];
  return getFilteredReflections().filter(refSearchMatch);
}
// See logSearchNav() above for the "current match" + refocus design — same idea
// here, minus the auto-open (reflection cards always show their full content).
function refSearchNav(dir,ev){
  if(ev)ev.stopPropagation();
  const list=currentRefSearchMatches();
  if(!list.length)return;
  if(refSearchNavIndex<0)refSearchNavIndex=dir>0?0:list.length-1;
  else refSearchNavIndex=(refSearchNavIndex+dir+list.length)%list.length;
  const r=list[refSearchNavIndex];
  if(!r)return;
  refSearchCurrentId=r.id;
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById(`reflectionrow-${r.id}`);
    if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
    const input=document.getElementById("refsearch-input");
    if(input)input.focus();
  });
}
function refSearchMatch(r){
  // Matches header label, entry date, and every section's question/answer text —
  // not just what's visible without scrolling — same principle as logSearchMatch.
  const q=refSearchQuery.trim().toLowerCase();
  if(!q)return true;
  const hay=[refHeaderLabel(r),ddmmyy(parseYMD(r.entryDate)),...nonEmptySections(r).flatMap(s=>[s.q,s.a])].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}
function logSearchMatch(t){
  // Matches everything in a trade, not just the columns visible in the collapsed
  // row — comments/notes only show once a row is expanded, but search still
  // needs to find them without the user opening every row first.
  const q=logSearchQuery.trim().toLowerCase();
  if(!q)return true;
  const lc=t.lossCat?LOSSCATS.find(c=>c.id===t.lossCat):null;
  const hay=[t.ticker,...(t.setups||[t.setup]),t.wl,t.direction,dispDate(t.date),t.comments,lc?lc.label:""].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}
function applyLogFilters(list){
  return list.filter(t=>{
    const tsetups=t.setups||[t.setup];
    if(logFilters.ticker.length&&!logFilters.ticker.includes((t.ticker||"").toUpperCase()))return false;
    if(logFilters.setup.length&&!tsetups.some(su=>logFilters.setup.includes(su)))return false;
    if(logFilters.wl.length&&!logFilters.wl.includes(t.wl))return false;
    if(logFilters.process.length){
      if(t.isGood===null||t.isGood===undefined)return false;
      const procVal=t.isGood?"good":"bad";
      if(!logFilters.process.includes(procVal))return false;
    }
    if(logFilters.lossCat.length&&!logFilters.lossCat.includes(t.lossCat))return false;
    if(!logSearchMatch(t))return false;
    return true;
  });
}
function applyLogSort(list){
  const{col,dir}=logSort,mult=dir==="asc"?1:-1;
  const val=t=>{
    switch(col){
      case"date":return t.date||"";
      case"ticker":return t.ticker?t.ticker.toUpperCase():"";
      case"setup":return t.setup||"";
      case"result":{const r=parseFloat(t.result);return isNaN(r)?-Infinity:r;}
      case"wl":return t.wl||"";
      case"rules":return(t.rs===null||t.rs===undefined)?-1:t.rs;
      case"process":return(t.isGood===null||t.isGood===undefined)?-1:(t.isGood?1:0);
      default:return t.date||"";
    }
  };
  return list.slice().sort((a,b)=>{
    const av=val(a),bv=val(b);
    if(av<bv)return-1*mult;
    if(av>bv)return 1*mult;
    return(b.date||"").localeCompare(a.date||""); // stable secondary: newest first
  });
}

  const rc=t.wl==="Win"?"var(--g)":t.wl==="Loss"?"var(--r)":"var(--t)";
  const col=sc(t.rs),bg=sbg(t.rs),bd=sbd(t.rs);
  const sl=t.rs!==null?`${t.fc}/${t.ac}`:"—";
  // A search match auto-opens its row via logSearchCurrentId (not expandedIds) so
  // stepping to the next result doesn't permanently pile up every row it's ever
  // visited — moving on closes it back up unless it was also opened by hand.
  const isCurrent=logSearchOpen&&t.id===logSearchCurrentId;
  const isOpen=expandedIds.has(t.id)||isCurrent;
  const row=`<tr class="trow${isCurrent?" trow-current":""}" id="traderow-${t.id}" onclick="toggleExpand(${t.id})">
<td style="font-size:var(--fsm);color:var(--t2);padding-left:20px;padding-right:20px">${hl(dispDate(t.date),logSearchQuery)}</td>
<td style="font-weight:700;font-size:var(--fbase)">${hl(t.ticker.toUpperCase(),logSearchQuery)}</td>
<td>${(t.setups||[t.setup]).map(su=>`<span class="pill pneu">${hl(setupAbbr(su),logSearchQuery)}</span>`).join(" ")}</td>
<td style="padding-left:6px;padding-right:6px">${t.contracts||"—"}</td>
<td>$${f2(t.entry)}</td>
<td style="color:var(--r)">$${f2(t.stop)}</td>
<td style="color:var(--g)">$${f2(t.target)}</td>
<td>${t.exit?`$${f2(t.exit)}`:"—"}</td>
<td style="font-weight:700;color:${rc}">${!isNaN(res)?cuNoSign(res):"—"}</td>
<td>${t.wl?`<span class="pill p${t.wl.toLowerCase()}">${t.wl}</span>`:"—"}</td>
<td><div class="rulesflex"><span class="spill" style="background:${bg};color:${col};border:.5px solid ${bd}" title="rules followed">${sl}</span>${t.comments&&t.comments.trim()?`<span title="has comment">📝</span>`:""}${t.screenshots&&t.screenshots.length>0?`<span title="has screenshots">📷</span>`:""}</div></td>
<td>${t.isGood!==null?`<span class="pill ${t.isGood?"pgood":"pbad"}">${t.isGood?"Good":"Bad"}</span>`:"—"}</td>
<td class="rowactions"><div class="rowactions-inner"><button class="delbtn" onclick="event.stopPropagation();editTrade(${t.id})" title="edit trade">✎</button><span class="iconsep">|</span><button class="delbtn" onclick="event.stopPropagation();del(${t.id})" title="delete trade">×</button></div></td>
</tr>`;
  return row+(isOpen?expandRowH(t):"");
}).join("")}
</tbody></table></div>`}
${trades.length>0?`<div class="lcountbottom">${logList.length} of ${trades.length} trades shown</div>`:""}
${mob&&filterSheetOpen?filterSheetH(en):""}
</div>`;
}

// ── Dashboard tab ─────────────────────────────────────────────────────────────
const SEP=`<span class="statsep">|</span>`;
// Every stat card is regular weight/smaller now except the P&L cell (opts.hero),
// which keeps the bold, larger treatment so it still reads as the headline number.
function statCard(label,value,color,opts){
  opts=opts||{};
  const valCls=opts.hero?"sval sval-hero":"sval";
  const bar=opts.bar!==undefined?`<div class="svalbar"><div class="svalbarfill" style="width:${opts.bar}%;background:${color||"var(--t3)"}"></div></div>`:"";
  const sub=opts.sub?`<div class="svalsub" style="color:${opts.subColor||"var(--t2)"}">${opts.sub}</div>`:"";
  return`<div class="scard${opts.cardClass?" "+opts.cardClass:""}"><div class="slabel">${label.toUpperCase()}</div><div class="pbody">${bar}<div class="${valCls}" style="color:${color||"var(--t)"}">${value}</div>${sub}</div></div>`;
}
function statGridH(s,title,ec,bc,em){
  const netColor=s.net>=0?"var(--g)":"var(--r)";
  const wrColor=s.wr!==null?(s.wr>=.5?"var(--g)":"var(--r)"):"var(--t3)";
  const bestCol=s.bestDay?(s.bestDay.net<0?"var(--r)":"var(--g)"):"var(--t3)";
  const worstCol=s.worstDay?(s.worstDay.net<0?"var(--r)":"var(--a)"):"var(--t3)";
  const edgeSub=s.edge===null?"no data yet":s.edge>0?"positive edge ↑":"negative edge ↓";
  const row1=[
    statCard(title,cu(s.net),netColor),
    statCard("Trading Days",`${s.tradingDays}D ${SEP} <span style="color:var(--g)">${s.greenDays}G</span> ${SEP} <span style="color:var(--r)">${s.redDays}R</span>`,null),
    statCard("Trades",`${s.n} ${SEP} <span style="color:var(--g)">${s.wc}W</span> ${SEP} <span style="color:var(--r)">${s.lc}L</span>`,null),
  ];
  const row2=[
    statCard("Win Rate",pc(s.wr),wrColor),
    statCard("Your Edge",s.edge!==null?cu(s.edge):"—",ec,{sub:edgeSub,subColor:ec}),
    statCard("Best / Worst Day",`<span style="color:${bestCol}">${s.bestDay?cu(s.bestDay.net):"—"}</span> ${SEP} <span style="color:${worstCol}">${s.worstDay?cu(s.worstDay.net):"—"}</span>`,null),
  ];
  const row3=[
    statCard("Avg Win / Loss",`<span style="color:var(--g)">${s.aw!==null?cu(s.aw):"—"}</span> ${SEP} <span style="color:var(--r)">${s.al!==null?cu(-s.al):"—"}</span>`,null),
    statCard("Avg RR Plan / Realized",`${s.ar!==null?`${f2(s.ar)}:1`:"—"} ${SEP} ${s.arReal!==null?`${f2(s.arReal)}:1`:"—"}`,null),
    statCard("Rule Execution",s.ep!==null?pc(s.ep):"—",bc,{sub:em,subColor:bc,cardClass:"tightsub"}),
  ];
  return`<div class="statrow3">${row1.join("")}</div>
<div class="statrow3">${row2.join("")}</div>
<div class="statrow3">${row3.join("")}</div>`;
}
function dashH(s,en,ec,bc,em){
  const periodTitle=periodMode==="week"?"Week P&L":periodMode==="month"?"Month P&L":periodMode==="custom"?"Range P&L":"All-Time P&L";
  const st=computeStreaks(en);
  const curCol=st.current===0?"var(--t3)":st.type==="Win"?"var(--g)":"var(--r)";
  const curLbl=st.current===0?"—":`${st.current}${st.type==="Win"?"W":"L"}`;

  return`<div>
${calendarH(en,{collapsible:true,collapsed:calendarCollapsed,label:"calendar"})}

<p class="seclab">stats</p>
<div class="dashSplit">
  <div id="dash-stat-col">${statGridH(s,periodTitle,ec,bc,em)}</div>
  <div class="bpanel eq-panel-auto" id="dash-eq-panel" style="margin-bottom:0;position:relative">
    <div class="seclab" style="position:absolute;top:-24px;left:0;margin:0;white-space:nowrap">equity curve</div>
    <div class="eq-outer" id="dash-eq-outer"></div>
  </div>
</div>

<p class="seclab">good trade vs. bad trade <span style="text-transform:none;color:var(--t3)">— process, not outcome (score ≥75% of rules = Good Trade)</span></p>
<div class="row2colEq">
  <div class="bpanel" style="margin-bottom:0">
    <div class="quad">
      <div class="qcell qgw"><div class="qn">${s.gw}</div><div class="ql">Good Trade + Win<br/>correct process, positive outcome</div></div>
      <div class="qcell qbw"><div class="qn">${s.bw}</div><div class="ql">Bad Trade + Win<br/>poor process got rewarded</div></div>
      <div class="qcell qgl"><div class="qn">${s.gl}</div><div class="ql">Good Trade + Loss<br/>correct process, normal loss</div></div>
      <div class="qcell qbl"><div class="qn">${s.bl}</div><div class="ql">Bad Trade + Loss<br/>poor process, negative outcome</div></div>
    </div>
    ${s.bw>0?`<div class="qwarn">⚠ ${s.bw} trade${s.bw!==1?"s":""} won despite poor process — the most dangerous quadrant, since it reinforces bad habits.</div>`:""}
  </div>
  <div class="bpanel" style="margin-bottom:0;display:flex;flex-direction:column">
    <div class="plbl" style="margin-bottom:10px">loss categories</div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    ${s.lcStats.every(c=>c.count===0)
      ?`<div class="dqok">no losses categorized yet</div>`
      :s.lcStats.map(c=>{
        const col=c.id==="good"?"var(--g)":c.id==="exec"?"var(--a)":c.id==="dec"?"var(--p)":"var(--r)";
        const dolCol=c.dollars>0?"var(--r)":"var(--t3)";
        return`<div class="losscat-item" title="${c.hint}">
          <div class="lcrow"><div class="lcname">${c.label}</div><div class="lcmeta" style="color:${dolCol}">${c.count} · ${c.pct!==null?pc(c.pct):"—"} · ${cuNoSign(c.dollars)}</div></div>
          <div class="lcbarwrap"><div class="lcbar" style="width:${c.pct!==null?(c.pct*100).toFixed(0)+"%":"0%"};background:${col}"></div></div>
        </div>`;
      }).join("")}
    </div>
  </div>
</div>

<p class="seclab">trade disqualifiers &amp; rules breakdown</p>
<div class="row2colEq">
  <div class="bpanel" style="margin-bottom:0">
    <div class="plbl" style="margin-bottom:14px">disqualifiers <span style="text-transform:none;color:var(--t3);letter-spacing:0"> — what would your P&L look like without these?</span></div>
    <div class="dgrid" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
      <div style="padding:14px 14px 4px"><div class="slabel" style="font-size:var(--fxs)">clean (${s.cleanTrades})</div><div class="sval" style="color:${s.cleanPnl>=0?"var(--g)":"var(--r)"}">${cu(s.cleanPnl)}</div><div style="font-size:var(--fxs);color:var(--t3);margin-top:6px;text-align:center">${s.cleanW}W ${cu(s.cleanGrossWin)} · ${s.cleanL}L ${cu(s.cleanGrossLoss)}</div></div>
      <div style="padding:14px 14px 4px"><div class="slabel" style="font-size:var(--fxs)">violated (${s.violTrades})</div><div class="sval" style="color:${s.violPnl>=0?"var(--g)":"var(--r)"}">${cu(s.violPnl)}</div><div style="font-size:var(--fxs);color:var(--t3);margin-top:6px;text-align:center">${s.violW}W ${cu(s.violGrossWin)} · ${s.violL}L ${cu(s.violGrossLoss)}</div></div>
    </div>
    ${s.violTrades>0?`<div class="qwarn" style="margin-bottom:16px">Removing violated trades would change P&L by ${cu(-s.violPnl)}.</div>`:`<div class="dqok" style="margin-bottom:16px">no disqualifier violations logged yet</div>`}
    ${s.dqStats.some(d=>d.total>0)?`<div>
${s.dqStats.filter(d=>d.total>0).map(d=>`<div class="rsrow"><span class="rsname">${d.text}</span><span class="rspct" style="color:${d.violCount>0?"var(--r)":"var(--g)"}">${d.violCount}/${d.total}</span></div>`).join("")}
    </div>`:""}
  </div>
  <div class="bpanel" style="margin-bottom:0">
    <div class="plbl" style="margin-bottom:10px">rules breakdown <span style="text-transform:none;color:var(--t3);letter-spacing:0"> — where are you slipping?</span></div>
    ${s.ruleStats.map(r=>{
      const c=sc(r.pct);
      return`<div class="brow">
        <span class="browlabel">${r.text}</span>
        <div class="browbar"><div class="browfill" style="width:${r.pct!==null?(r.pct*100).toFixed(0)+"%":"0%"};background:${c}"></div></div>
        <span class="browpct" style="color:${c}">${r.pct!==null?pc(r.pct):"—"}</span>
      </div>`;
    }).join("")}
  </div>
</div>

${en.length>0?`
<p class="seclab">setup breakdown</p>
<div class="setuprow">
${(()=>{const segRecs=segmentRecords(en);return SETUPS.map(setup=>{
  const ts=segRecs.filter(r=>r.setup===setup),ws=ts.filter(r=>r.wl==="Win"),ls=ts.filter(r=>r.wl==="Loss"),wr=(ws.length+ls.length)>0?ws.length/(ws.length+ls.length):null;
  const c=wr===null?"var(--t3)":wr>=.5?"var(--g)":"var(--r)";
  return`<div class="setupcard"><div class="slabel">${setup}</div><div class="pbody"><div class="sval" style="color:${c}">${wr!==null?pc(wr):"—"}</div><div class="svalsub" style="font-weight:300;font-style:italic">(${ts.length} leg${ts.length!==1?"s":""})</div></div></div>`;
}).join("");})()}
<div class="setupcard"><div class="slabel">Avg Hold Time</div><div class="pbody"><div class="sval">${s.adur!==null?fdur(s.adur):"—"}</div></div></div>
<div class="setupcard streakcard">
  <div class="seclab" style="position:absolute;top:-24px;left:0;margin:0;white-space:nowrap">streak</div>
  <div class="rsrow" style="padding:4px 0"><span class="rsname">Current</span><span class="rspct" style="color:${curCol}">${curLbl}</span></div>
  <div class="rsrow" style="padding:4px 0"><span class="rsname">Max Win</span><span class="rspct" style="color:var(--g)">${st.maxWin||"—"}</span></div>
  <div class="rsrow" style="padding:4px 0;border-bottom:none"><span class="rsname">Max Loss</span><span class="rspct" style="color:var(--r)">${st.maxLoss||"—"}</span></div>
</div>
</div>

<p class="seclab">performance breakdown <span style="text-transform:none;color:var(--t3)">— win % and avg realized R alongside $ P&L</span></p>
<div class="dgrid">
  <div class="panel">
    <div class="plbl" style="margin-bottom:8px">P&L by ticker</div>
    ${tickerBreakdown(en).map(tk=>breakdownRowH(tk.ticker,tk.count,tk.wins,tk.withWl,tk.rrSum,tk.rrCount,tk.net)).join("")}
  </div>
  <div class="panel">
    <div class="plbl" style="margin-bottom:8px">by day of week</div>
    ${dowBreakdown(en).map(d=>breakdownRowH(d.label,d.count,d.wins,d.withWl,d.rrSum,d.rrCount,d.net)).join("")}
  </div>
  <div class="panel">
    <div class="plbl" style="margin-bottom:8px">by session <span style="text-transform:none;color:var(--t3)">(entry–exit, multi-day excluded)</span></div>
    ${sessionBreakdown(en).length>0
      ?sessionBreakdown(en).map(d=>breakdownRowH(d.label,d.count,d.wins,d.withWl,d.rrSum,d.rrCount,d.net)).join("")
      :`<div class="dqok">log entry (and ideally exit) times to see this breakdown</div>`}
  </div>
</div>`:""}
</div>`;
}

// ── Reflection tab ────────────────────────────────────────────────────────────
function reflectionH(){
  const list=getFilteredReflections().filter(refSearchMatch);
  const preSearchList=getFilteredReflections();
  const filteredOut=periodMode!=="all"&&reflections.length>0&&preSearchList.length===0;
  const anyRefExpanded=list.some(r=>!refCollapsedIds.has(r.id));
  return`<div>
<div class="lbar${refSearchOpen?" sticky-search":""}">
  <span class="lcount" style="font-size:var(--fxs);font-weight:300">${list.length} of ${reflections.length} reflection${reflections.length!==1?"s":""} shown</span>
  <div class="logbaricons">
    ${list.length>0?`<button class="topicon" onclick="toggleAllReflections()" aria-label="${anyRefExpanded?"collapse all":"expand all"}" data-tt="${anyRefExpanded?"collapse all":"expand all"}">${anyRefExpanded?ICON_TRIDOWN:ICON_TRIRIGHT}</button>
    <span class="iconsep">|</span>`:""}
    <span class="searchwrap">
      ${refSearchOpen&&currentRefSearchMatches().length>0?`
      <button class="topicon" onclick="refSearchNav(-1,event)" aria-label="previous match" data-tt="previous match">${ICON_TRILEFT}</button>
      <button class="topicon" onclick="refSearchNav(1,event)" aria-label="next match" data-tt="next match">${ICON_TRIRIGHT}</button>
      `:""}
      ${refSearchOpen?`<span class="searchpill" onclick="event.stopPropagation()">${ICON_SEARCH}<input id="refsearch-input" placeholder="" value="${escAttr(refSearchQuery)}" oninput="onRefSearchInput(this)" onkeydown="onRefSearchKeydown(event)"/></span>`
      :`<button class="topicon" onclick="toggleRefSearch(event)" aria-label="search reflections" data-tt="search reflections">${ICON_SEARCH}</button>`}
    </span>
    <span class="iconsep">|</span>
    <button class="topicon" onclick="toggleRefForm()" aria-label="${showRefForm?"cancel":"add reflection"}" data-tt="${showRefForm?"cancel":"add reflection"}">${showRefForm?ICON_X:ICON_PLUS}</button>
  </div>
</div>

${showRefForm?`
<div class="fcard">
  <div style="font-size:var(--fmd);font-weight:700;margin-bottom:1rem">${editingRefId!==null?"edit reflection":"new reflection entry"}</div>
  <div style="display:flex;gap:6px;margin-bottom:14px">
    <button class="pbtn${refForm.periodType==="week"?" on":""}" onclick="setRefPeriodType('week')">weekly</button>
    <button class="pbtn${refForm.periodType==="month"?" on":""}" onclick="setRefPeriodType('month')">monthly</button>
  </div>
  <div class="fgrid" style="max-width:460px;margin-bottom:20px">
    ${refForm.periodType==="week"
      ?`<div class="field"><label>week containing</label><input id="rf-weekdate" type="date" value="${refForm.periodDate}" onchange="updateRefPeriodDate()"/></div>`
      :`<div class="field"><label>month</label><input id="rf-monthdate" type="month" value="${refForm.periodDate.slice(0,7)}" onchange="updateRefPeriodDate()"/></div>`}
    <div class="field"><label>entry date</label><input id="rf-entrydate" type="date" value="${refForm.entryDate}" onchange="updateRefPeriodDate()"/></div>
  </div>
  <div style="font-size:var(--fxs);color:var(--refhead);font-weight:700;letter-spacing:.05em;margin-bottom:16px">${refHeaderLabel(refForm)}</div>
  ${refForm.sections.map((s,i)=>`
  <div style="margin-bottom:12px">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input id="rf-sq-${i}" value="${escAttr(s.q)}" placeholder="question / section title" style="flex:1;height:34px;padding:8px 10px;font-family:var(--sans);font-size:var(--fbase);font-weight:600;border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none"/>
      <button class="delbtn" onclick="removeRefSection(${i})" title="remove section">×</button>
    </div>
    <textarea id="rf-sa-${i}" rows="2" placeholder="write your thoughts here...">${esc(s.a)}</textarea>
  </div>`).join("")}
  <button class="btn" style="margin-bottom:14px" onclick="addRefSection()">+ add section</button>
  <div>
    <button class="btn btng" onclick="saveReflection()">${editingRefId!==null?"save changes":"save reflection"}</button>
  </div>
</div>`:""}

${reflections.length===0
  ?`<div class="empty"><div style="font-size:28px;margin-bottom:8px">📝</div><p>no reflections yet — jot down your first weekly reflection above</p></div>`
  :filteredOut
  ?`<div class="empty"><div style="font-size:28px;margin-bottom:8px">🗓️</div><p>no reflections in this period — try a different week/month or switch back to "All"</p></div>`
  :(preSearchList.length>0&&list.length===0)
  ?`<div class="empty"><div style="font-size:28px;margin-bottom:8px">🔍</div><p>no reflections match your search</p></div>`
  :list.map(r=>{
    const secs=nonEmptySections(r);
    const isCurrent=refSearchOpen&&r.id===refSearchCurrentId;
    // A search match auto-opens even if manually collapsed, same logic as the
    // trade log's search-driven auto-expand.
    const isCollapsed=refCollapsedIds.has(r.id)&&!isCurrent;
    return `
<div class="fcard${isCurrent?" fcard-current":""}" id="reflectionrow-${r.id}" style="margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;${isCollapsed?"":"margin-bottom:18px;"}cursor:pointer" onclick="toggleReflectionExpand(${r.id})">
    <span style="font-size:var(--fsm);color:var(--refhead);font-weight:700;letter-spacing:.03em">${hl(refHeaderLabel(r),refSearchQuery)}</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:var(--fxs);color:var(--t3);font-style:italic">entry date: ${hl(ddmmyy(parseYMD(r.entryDate)),refSearchQuery)}</span>
      <div style="display:flex;gap:2px" onclick="event.stopPropagation()">
        <button class="delbtn" onclick="editReflection(${r.id})" title="edit reflection">✎</button>
        <button class="delbtn" onclick="delReflection(${r.id})" title="delete reflection">×</button>
      </div>
    </div>
  </div>
  ${isCollapsed?"":secs.map((s,i)=>`<div style="${i<secs.length-1?"margin-bottom:14px;padding-bottom:14px;border-bottom:.5px solid var(--bd)":""}">
    <div class="refq" style="margin-bottom:6px">${hl(s.q,refSearchQuery)}</div>
    <div style="font-size:var(--fbase);color:var(--t2);line-height:1.5">${pWrap(s.a,refSearchQuery)}</div>
  </div>`).join("")}
</div>`;
  }).join("")}
</div>`;
}

load();
render();
attemptDriveAutoConnect();
refreshStorageQuota();
</script>
