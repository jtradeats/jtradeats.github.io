function tapeFill(el,it){

  const f=has?fresh(it):{tag:'',dim:false,tip:[]};
  el.className='ti'+(f.dim?' old':'')+(it.stale?' stale':'')+(it.unv&&!it.stale?' unv':'');

'VOL':{t:'Vol: how nervous is the market?',

 m:['<b>Surprises:</b> inflation or jobs data far from forecast, or a central bank (the Fed) sounding tougher or softer than expected','<b>Shocks:</b> war, sanctions, oil-supply scares, trade-policy or election surprises','<b>Stress:</b> a fast fall in stocks, trouble in banks or credit, or a crowded trade unwinding (for example, the yen carry trade)','<b>Calm:</b> predictable central banks and steady data let vol sink and stay low'],
 i:['<b>Vol up:</b> stocks usually fall, funds cut risk (many size positions by vol), and money runs to Treasuries, gold, the dollar and the yen','<b>Vol low:</b> relaxed markets that drift higher, but crowded calm can end with a sudden jolt','<b>Day to day:</b> higher vol means bigger swings in every market, including the ones you trade'],
 k:[['VIX','S&P 500 fear gauge','How big a swing traders expect in the S&P 500 over the next 30 days.','Traders are paying more for protection. Usually goes with falling stocks. Rule of thumb: under about 20 is calm, over about 30 is stress.','Calmer and cheaper protection. Usually goes with steady or rising stocks.','VIX up tends to weigh on indices and credit and support Treasuries and the dollar.'],
 ['VIXEQ','single-stock fear gauge','The expected 30-day swings of the individual stocks inside the S&P 500, averaged and weighted by company size. VIX prices the index as a whole; VIXEQ prices its members one by one.','Individual stocks are expected to swing more on their own, even if the index looks fine.','Individual stocks are expected to be calmer.','It normally sits above VIX, because ups and downs among single stocks cancel out inside the index. Watch the gap (VIXEQ minus VIX). A wide gap means a calm-looking index is hiding big moves underneath, which has historically flagged concentration risk and a more fragile market than VIX alone suggests. A narrow gap means stocks are moving together.'],
 ['MOVE','bond-market fear gauge','VIX for Treasury bonds: how big a swing traders expect in interest rates.','Bond traders are unsure about inflation, the Fed or government borrowing, so bond prices swing harder.','The rate outlook feels settled.','A MOVE spike can spill into stocks and credit, because almost everything is priced off Treasury yields.']]},
'DOLLAR':{t:'Dollar: how strong is the US currency?',
 w:'DXY measures the US dollar against a basket of six major currencies, and the euro is by far its largest part. USDJPY is how many Japanese yen one dollar buys.',

 i:['<b>Strong dollar:</b> gold, oil and copper are priced in dollars, so they get pricier for foreign buyers and tend to weaken. It also squeezes US companies that earn abroad and countries with dollar debt','<b>Weak dollar:</b> the reverse, usually supportive for commodities and big multinationals','<b>Yen carry trade:</b> investors borrow cheap yen to buy higher-yielding assets, including US stocks. A sharp yen rise forces them to sell, which can hit stocks and spike vol'],
 k:[['DXY','dollar index','The dollar against a basket of major currencies.','Dollar stronger. Usually US rates are rising or investors want safety.','Dollar weaker. Usually rate-cut hopes or less need for safety.','DXY up tends to weigh on gold, oil, copper and global stocks. DXY down eases that pressure.'],
 ['USDJPY','yen per dollar','How many yen one dollar buys.','Yen weaker. Usually US interest rates are higher than Japan\u2019s, so holding yen earns less, or markets are calm and risk-hungry.','Yen stronger. Safe-haven buying, falling US yields, Japan raising or signalling higher rates, or officials intervening to buy yen. A fast drop can mean a carry-trade unwind.','A sudden yen surge is a classic trigger for stock selloffs and vol spikes. A slowly weaker yen quietly supports risk-taking.']]},
'RATES':{t:'Rates: what does it cost the US government to borrow?',
 w:'A yield is the interest rate the US government pays to borrow for a set time. Mortgages, business loans and stock valuations are all priced off it. Yields move opposite to bond prices: yield up means price down.',
 m:['<b>The Fed:</b> the 2Y yield follows where traders think the Fed will set rates. If rate rises are expected it goes up, and if cuts are expected it goes down','<b>Inflation and jobs data:</b> hotter than expected means the Fed stays tight, so yields rise','<b>Growth fears:</b> money moves into safe bonds, so yields fall','<b>Government borrowing:</b> big deficits, heavy bond auctions, and election promises of tax cuts or spending push long yields up','<b>Geopolitics:</b> war can pull yields down (safety) or up (inflation from oil), depending on which fear wins'],
 i:['<b>Yields up:</b> borrowing costs more, which pressures stocks (especially tech, whose profits are far off), gold (pays no interest) and housing, and supports the dollar','<b>Yields down:</b> the reverse, unless they fall because the economy is breaking, in which case stocks suffer too','<b>The curve:</b> when short yields sit above long ones (\u201cinverted\u201d), it has often signalled recession worries'],
 k:[['USD02Y','2-year yield','What the market expects the Fed to do over the next two years. The most Fed-sensitive.','Traders expect higher rates for longer. The dollar usually firms and tech wobbles.','Cuts expected, either because inflation is cooling (good for markets) or because the economy is weakening (not good).','Moves the dollar and rate-sensitive stocks, especially around Fed days.'],
 ['USD10Y','10-year yield','The benchmark borrowing cost for the economy: mortgages, companies, stock valuations.','Borrowing is getting pricier. Stock valuations come under pressure.','Borrowing is getting cheaper, or investors are fleeing to safety.','The yield most other markets are compared to. Up is usually a headwind for NQ and gold.'],
 ['USD30Y','30-year yield','The long-run view on inflation and government debt.','Worry about inflation or deficits. Long-end jumps are what make \u201cbond selloff\u201d headlines.','Less long-run worry, or a rush to safety.','Sharp long-end jumps tend to make headlines and can unsettle stocks.'],
 ['ZB1!','long-bond futures (a price)','The price of long-term US Treasury bond futures, not a yield. Often called the 30-year, but it tracks long-dated Treasuries rather than exactly 30 years.','Price up means yields down: safety buying or rate-cut hopes.','Price down means yields up: inflation, heavy borrowing or a tougher Fed.','Moves opposite to long-term yields (USD30Y, and to a lesser degree USD10Y). It is the contract futures traders actually trade.']]},
'METALS':{t:'Metals: gold for safety, copper for growth',
 w:'Gold is held mainly as a store of value and a hedge against fear, inflation and currency weakness. Copper goes into wiring, buildings, factories and power networks, so it tracks how busy the economy is.',
 m:['<b>Real interest rates</b> (yields minus inflation): gold pays nothing, so it tends to rise when real yields fall and fall when they rise','<b>The dollar:</b> both are priced in dollars, so a stronger dollar usually weighs on them','<b>Fear:</b> war, sanctions and political uncertainty lift gold, and central banks buying it for reserves can support it. Fear does not always win: rising real yields and a stronger dollar can outweigh it','<b>China and global growth:</b> China is the world\u2019s largest copper consumer, so its stimulus, property market and trade policy matter','<b>Supply:</b> mine disruptions and strikes'],
 i:['<b>Gold up:</b> often means worry, lower expected rates or a weaker dollar','<b>Copper up:</b> growth optimism, usually alongside stocks and rising yields','<b>The pair:</b> gold rising while copper falls is a fear signal; both rising is more of a weak-dollar, strong-demand story'],
 k:[['GC1!','gold futures','The price of gold.','Investors want safety, or expect lower real rates or a weaker dollar. Gold up with stocks down means fear. Gold up with stocks up is more about easy money.','Fear is fading, or rates and the dollar are rising.','Usually moves opposite to the dollar and real yields. Strong gold during a stock selloff signals real stress.'],
 ['HG1!','copper futures','The price of copper.','Factories and construction look busy, and China looks healthy.','Growth worries, or simply more supply than buyers need. Copper is often watched as an early read on a slowing economy.','Falling copper with falling yields reads as a slowdown. Rising copper with rising yields reads as growth. Also feeds materials and industrial stocks.']]},
'INDICES':{t:'Indices: the US stock market',
 w:'These are futures on US stock indexes. They trade nearly around the clock, so they show how stocks are reacting to news before the cash market opens. Each one covers a different slice of the market.',
 m:['<b>Rates and the Fed:</b> growth and tech stocks are the most rate-sensitive, and small companies depend on cheap borrowing','<b>Earnings:</b> the Nasdaq-100 and S&P 500 are weighted by company size, so the profits of the largest companies move them most','<b>Economic data:</b> good news can be bad news if it means higher rates','<b>Policy and geopolitics:</b> trade rules, tax changes, elections and conflicts change expected profits and which sectors win','<b>Oil and the dollar:</b> higher costs and a strong dollar squeeze profits'],
 i:['<b>Stocks fall:</b> vol rises, and money tends to move into Treasuries, gold and the dollar','<b>Stocks rise:</b> credit spreads tighten and vol eases','<b>Confidence loop:</b> stock moves change how consumers and companies feel, which feeds back into spending'],
 k:[['NQ1!','Nasdaq-100','100 of the largest non-financial companies listed on Nasdaq, mostly technology and growth.','Appetite for growth and tech is strong, helped by lower rates.','Sentiment toward tech is weakening, or yields are rising. It usually swings the most in both directions.','The most rate-sensitive of the four. NQ far ahead of the others suggests gains are concentrated in a few large companies.'],
 ['ES1!','S&P 500','500 large US companies, weighted by size: the market\u2019s overall mood.','Broad confidence.','Broad caution.','The yardstick the other groups on this tape are read against.'],
 ['YM1!','Dow Jones','30 large US companies chosen by a committee. It is price-weighted, so a company with a higher share price counts for more, whatever its size.','Its higher-priced shares are rising.','Its higher-priced shares are falling. A few shares can drag the whole index.','Because of price-weighting, a few shares can dominate its moves, so it can diverge from ES and NQ.'],
 ['RTY1!','Russell 2000','Small US companies, mostly domestic, and often more reliant on borrowing.','The market expects domestic growth and lower borrowing costs. A healthy sign for risk appetite.','Worry about the economy or high rates. Small firms feel it first.','Rallies on rate-cut hopes. A weak RTY with a firm NQ means a narrow rally.']]},
'ENERGY':{t:'Energy: the cost of fuel and power',
 w:'Brent and WTI are the two main oil prices (Brent is the global benchmark, WTI the US one). Natural gas heats homes and powers the grid. Together they set the fuel and power bill for the whole economy.',
 m:['<b>Supply decisions:</b> OPEC+ output cuts or increases, and US shale production','<b>Geopolitics:</b> conflict or sanctions affecting major producing regions, and disruption to shipping routes, can push oil up fast on supply fears','<b>Demand:</b> China, global growth and recession worries','<b>The dollar:</b> a stronger dollar makes oil pricier abroad, which can dampen demand','<b>Weather and storage:</b> natural gas follows hot and cold spells, storage levels and export demand. The weekly US inventory reports move oil and gas'],
 i:['<b>Oil up:</b> fuel, transport and shipping cost more, which feeds inflation, can keep interest rates higher and squeezes consumers (energy companies benefit)','<b>Oil down:</b> eases inflation, but a sharp drop can mean weak demand','<b>Gas up:</b> higher electricity and heating bills'],
 k:[['BB1!','Brent crude','The global oil benchmark. Most of the world\u2019s oil is priced off it.','Supply worries or strong demand. Fuel gets pricier worldwide.','Ample supply or weak demand. Fuel gets cheaper.','Feeds into inflation expectations, then yields. Sharp spikes (for example from conflict) can hit stocks.'],
 ['CL1!','WTI crude','The US oil benchmark, and the one most US traders watch.','Same as Brent, with a US angle: US inventories, production or demand.','Same as Brent: ample US supply or weaker demand.','Usually moves with Brent. A widening gap between them points to a US-specific supply or storage story.'],
 ['NG1!','natural gas','Fuel for heating, power plants and industry. Mostly a regional market.','Cold or hot weather, low storage or strong exports. Power and heating bills rise.','Mild weather and plenty in storage.','Matters less to global markets than oil, but feeds electricity costs, inflation and energy-company profits.']]},
'BONDS & CREDIT':{t:'Bonds & credit: how willing lenders are to lend',
 w:'This group tracks bond funds (ETFs), so these are prices, and they move opposite to yields. \u201cCredit\u201d means lending to companies. Companies borrow by issuing bonds, and the extra interest they pay above the government is the credit spread: the price of the risk of not being repaid. When times look good the spread is small. When people worry, lenders demand more and the bonds fall. Bond investors care most about getting repaid, not about upside. Credit spreads have a record of widening before major stock-market declines, though in short pullbacks credit and stocks usually fall together.',
 m:['<b>Interest rates:</b> the Fed and inflation move all bond prices, and the longest bonds move the most','<b>Economic health:</b> recession or default worries hit riskier company bonds first','<b>Inflation expectations:</b> drive inflation-linked bonds','<b>Risk appetite:</b> stock selloffs and vol spikes push lenders to pull back','<b>Government borrowing:</b> heavy Treasury supply can push Treasury prices down'],
 i:['<b>Credit weakens</b> (HYG falls): borrowing gets costlier, especially for weaker companies, which can slow the economy. It has a record of warning before bigger stock declines','<b>Treasuries up while credit falls:</b> a flight to safety','<b>Bonds and stocks falling together:</b> usually a rates problem, not just fear'],
 k:[['TIP','inflation-linked Treasuries','US government bonds whose principal rises with inflation.','Inflation worries are rising, or real (after-inflation) yields are falling.','Inflation worry is fading, or real yields are rising.','Compared with regular Treasuries (IEF, TLT), it shows how much inflation the market expects.'],
 ['TLT','long-term Treasuries (20+ years)','The most interest-rate-sensitive of the group.','Yields are falling: safety buying or rate-cut hopes.','Yields are rising: inflation, heavy borrowing or a tougher Fed.','Mirror of the 30Y yield. Often rises when stocks fall in fear. If both fall together, rates are the problem.'],
 ['IEF','mid-term Treasuries (7 to 10 years)','Same idea as TLT, with smaller swings.','Yields are falling.','Yields are rising.','A steadier read on the 10Y yield.'],

let gxOpen=null;

function gxShow(g){

  p.innerHTML='<div class="gx-h"><h3>'+esc(d.t)+'</h3><button class="gx-x" type="button" aria-label="close explanation">\u00d7</button></div>'
    +'<p class="gx-w">'+esc(d.w)+'</p>'
    +'<div class="gx-cols"><div><h4>What moves it</h4><ul>'+li(d.m)+'</ul></div><div><h4>What it moves</h4><ul>'+li(d.i)+'</ul></div></div>'
    +'<details class="gx-t"><summary>What each ticker is telling you ('+d.k.length+')</summary>'
    +d.k.map(k=>'<div class="gx-k"><div class="nm">'+esc(k[0])+' <i>'+esc(k[1])+'</i></div><p>'+esc(k[2])+'</p><p><b>\u2191 stronger:</b> '+esc(k[3])+'</p><p><b>\u2193 weaker:</b> '+esc(k[4])+'</p><p class="hit"><b>Usually hits:</b> '+esc(k[5])+'</p></div>').join('')
    +'</details>';
  p.hidden=false;gxSync();
  try{p.scrollIntoView({block:'nearest',behavior:reduceMo.matches?'auto':'smooth'})}catch(_){}
}
{
  /* A tap is a pointer that goes down and up on the same chip without travelling; a drag of the tape is not a tap. The tape captures the
     pointer on pointerdown, so the chip is remembered at pointerdown rather than read from the click target. */
  const box=$('#tape');let dn=null;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0){dn=null;return}
    const c=e.target.closest('.gc');dn=c?{g:c.dataset.g,id:e.pointerId,x:e.clientX,y:e.clientY}:null;
  });
  box.addEventListener('pointerup',e=>{
    if(!dn||dn.id!==e.pointerId)return;const d=dn;dn=null;
    if(Math.abs(e.clientX-d.x)<8&&Math.abs(e.clientY-d.y)<8)gxShow(d.g);
  });
  box.addEventListener('pointercancel',()=>{dn=null});

const CV_LIMITS='The curve shows what yields did and what such moves usually mean. It does not show why this month’s move happened: a data surprise, a Fed speech, government borrowing and a rush to safety can all look alike on the curve. It is not a forecast. To find the cause, check the economic calendar and the news; stocks and credit (the HYG tile on the tape) are the quickest confirmation of whether the move is calm or fearful.';
function cvRead(d){
  const y=k=>(d.yields||[]).find(x=>x.k===k),sps=d.spreads||[],sp=sps.find(x=>x.id==='10s2s')||{},
    s3=sps.find(x=>/10Y.*3M/.test(x.label||'')),s30=sps.find(x=>/30Y.*10Y/.test(x.label||'')),
    a=y('2Y'),b=y('10Y'),c=y('30Y'),
    mv=[['2-year',a],['10-year',b],['30-year',c]].filter(x=>x[1]&&x[1].m1!=null);
  const spm=sp.m1!=null?sp.m1:(a&&b&&a.m1!=null&&b.m1!=null?b.m1-a.m1:null);
  let reg=null;
  if(a&&b&&a.m1!=null&&b.m1!=null&&spm!=null){
    const A=a.m1,B=b.m1,shortLed=Math.abs(A)>=Math.abs(B);
    if(spm>=CVT)reg=A<0&&shortLed?(B<=0?'bull_steep':'twist_steep'):'bear_steep';
    else if(spm<=-CVT)reg=A>0&&shortLed?(B>=0?'bear_flat':'twist_flat'):'bull_flat';
    else{const av=(A+B)/2;reg=av>=CVT?'par_up':av<=-CVT?'par_dn':'quiet'}
  }
  const facts=[];
  if(reg){
    const vals=mv.map(x=>x[1].m1),mx=Math.max(...vals),mn=Math.min(...vals),same=mn>=CVT||mx<=-CVT;
    const dir=mn>=CVT?'rising at every maturity shown':mx<=-CVT?'falling at every maturity shown':mx>=CVT&&mn<=-CVT?'mixed, some maturities up and some down':mx>=CVT?'rising at some maturities and little changed at the rest':mn<=-CVT?'falling at some maturities and little changed at the rest':'little changed everywhere (all within '+CVT+' bp)';
    let tog='';
    if(same){
      if(mx-mn<CVT)tog=', about equally (within '+CVT+' bp of each other), so the curve shifted rather than changed shape';
      else{const bg=mv.slice().sort((p,q)=>Math.abs(q[1].m1)-Math.abs(p[1].m1)),f=bg[0],l=bg[bg.length-1];tog=', but unevenly: the '+f[0]+' moved most ('+cvB(f[1].m1)+' bp) and the '+l[0]+' least ('+cvB(l[1].m1)+' bp)'}
    }
    facts.push('Over the past month the '+mv.map(x=>x[0]+' moved '+cvB(x[1].m1)+' bp').join(', the ')+'.');
    facts.push('Rates are '+dir+tog+'.');
    const st=spm>=CVT?'steepening':spm<=-CVT?'compressing':'flat';
    facts.push('10Y−2Y changed '+cvB(spm)+' bp, so the curve is '+st+'.');
    if(a.w1!=null&&b.w1!=null){
      let w='In the latest week the 2-year moved '+cvB(a.w1)+' bp and the 10-year '+cvB(b.w1)+' bp.';
      const wm=(a.w1+b.w1)/2,mm=(a.m1+b.m1)/2;
      if(Math.abs(wm)>=CVT&&Math.abs(mm)>=CVT&&Math.sign(wm)!==Math.sign(mm))w+=' That is the opposite direction to the month, so the month’s story may be fading.';
      facts.push(w);
    }
  }else facts.push('The 2-year or 10-year change over the month is missing, so no read of direction or shape is shown. The levels and spreads below are still the official close.');
  const level=[];
  if(sp.bp!=null){
    if(sp.inv)level.push(['10Y−2Y is inverted ('+cvB(sp.bp)+' bp)','The 2-year pays more than the 10-year. The bond market is saying short-term rates are higher than it expects them to stay, which usually means it expects the Fed to cut or growth to slow. Inversions of this spread have often come before recessions, with a long, uneven lag and some false alarms.']);
    else if(Math.abs(sp.bp)<10)level.push(['10Y−2Y is close to flat ('+cvB(sp.bp)+' bp)','Longer maturities pay about the same as short ones, so the market sees little difference between the near and the long term. The signal is weak either way.']);
    else level.push(['10Y−2Y is positive ('+cvB(sp.bp)+' bp)','Longer maturities pay more than short ones, the normal shape, and this spread is not giving the warning it gives when inverted.']);
  }
  if(s3&&s3.bp!=null){
    if(s3.inv)level.push(['10Y−3M is inverted ('+cvB(s3.bp)+' bp)','The 3-month bill, close to the Fed’s policy rate, pays more than the 10-year. This is a widely used recession signal, with the same long, uneven lag.']);
    else level.push(['10Y−3M is positive ('+cvB(s3.bp)+' bp)','The 10-year pays more than the 3-month bill, which is close to the Fed’s policy rate.']);
    if(sp.bp!=null&&!!s3.inv!==!!sp.inv)level.push(['The two measures disagree',s3.inv?'The 3-month bill pays more than the 10-year, but the 2-year pays less than the 10-year: markets expect short-term rates to come down over the next couple of years while longer rates stay higher.':'The 3-month bill pays less than the 10-year, but the 2-year pays more than the 10-year: the curve rises at the front and falls after, which fits a market expecting policy rates to stay high or rise for now and ease later.']);
  }
  if(s30&&s30.bp!=null)level.push(['30Y−10Y is '+cvB(s30.bp)+' bp',s30.bp>=0?'The extra the market asks for tying money up for decades instead of ten years. A widening gap usually reflects inflation, borrowing or supply worries at the long end.':'The 30-year pays less than the 10-year, an unusual shape at the very long end.']);

  return {reg,head:R?R.h:'Treasury yield curve',card:R?R.card:'',say:R?R.say:'',
    lines:R&&R.fed?[['Fed and rates',R.fed],['Economy',R.eco],['Stocks',R.stk],['Bonds',R.bnd]]:[],risks:R?R.risk:[],facts,level};
}
function cvExplain(){
  const d=CV.d;if(!d)return;
  const y=k=>(d.yields||[]).find(x=>x.k===k),s=id=>(d.spreads||[]).find(x=>x.id===id)||{},sp=s('10s2s');
  const lv=k=>y(k)?cvY(y(k).v)+'%':'n/a';
  let r=null;try{r=cvRead(d)}catch(e){}
  const li=a=>a.map(x=>'<li><b>'+esc(x[0])+':</b> '+esc(x[1])+'</li>').join('');
  const head=r&&r.reg?r.head:sp.bp==null?'Treasury yield curve':sp.inv?'The curve is inverted: the 2-year yields '+Math.abs(sp.bp)+' bp more than the 10-year':'10Y−2Y is '+cvB(sp.bp)+' bp: longer yields are above shorter ones';
  const sl=(d.spreads||[]).filter(x=>x.bp!=null).map(x=>'<li><b>'+esc(x.label)+'</b> '+esc(cvB(x.bp))+' bp'+(x.inv?' (inverted)':'')+', '+esc(x.state||'n/a')+' over the month ('+esc(cvB(x.m1))+' bp)</li>').join('');
  const read=r?'<h4>What moved</h4><p>'+esc(r.facts.join(' '))+'</p>'
    +(r.say?'<h4>What the bond market is saying</h4><p>'+esc(r.say)+'</p>':'')
    +(r.lines.length?'<ul class="cvul">'+li(r.lines)+'</ul>':'')
    +(r.level.length?'<h4>Where the curve sits now</h4><ul class="cvul">'+li(r.level)+'</ul>':'')
    +(r.risks.length?'<h4>Risks to watch</h4><ul class="cvul">'+r.risks.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')
    +'<h4>What this cannot tell you</h4><p>'+esc(CV_LIMITS)+'</p>':'';
  relShell('Treasury yield curve',
    '<h3>'+esc(head)+'</h3><div class="relt">Official Treasury par yield curve, close of '+esc(fmtIso(d.asof))+' · 2Y '+esc(lv('2Y'))+' · 10Y '+esc(lv('10Y'))+' · 30Y '+esc(lv('30Y'))+'</div>'
    +read
    +'<h4>The basics</h4><p>A Treasury yield is what the US government pays to borrow for a fixed time, from one month to 30 years. Plotted by maturity, the yields form the yield curve. These are the official end-of-day figures published by the US Treasury, not live prices, so they can differ from the delayed 2Y, 10Y and 30Y on the tape above.</p>'
    +'<p><b>2-year:</b> driven mostly by what the market expects the Fed to do with its policy rate over the next two years. <b>10-year:</b> the benchmark long rate; it sets the tone for mortgage rates and for the rate used to value company earnings. <b>30-year:</b> the long end, shaped by inflation expectations, government borrowing and the extra yield investors ask for tying money up for decades.</p>'
    +'<p>A spread is one yield minus another, in basis points (100 bp = 1 percentage point). <b>10Y−2Y</b> is the most quoted slope of the curve. <b>10Y−3M</b> compares the 10-year with the shortest bill, close to the Fed’s policy rate. <b>30Y−10Y</b> and <b>30Y−5Y</b> show how much extra the long end pays.</p><ul class="cvul">'+sl+'</ul>'
    +'<h4>The words</h4><p><b>Steepening</b> means the gap between long and short yields widened; <b>compressing</b> (also called flattening) means it narrowed; <b>flat</b> means it moved less than 5 bp over the month. <b>Bull</b> and <b>bear</b> describe bond prices: a bull move is yields falling (prices up), a bear move is yields rising (prices down). So <b>bear flattening</b> is yields rising with the short end rising faster. <b>Inversion</b> means a shorter yield is above a longer one, a negative spread.</p>'
    +'<p class="relf">This read is built from rules and hand-written text, not AI. The 5 bp over one month threshold, and the 10 bp “close to flat” band, are this dashboard’s own rules, not industry standards. Spreads are computed from the Treasury close and checked against FRED’s T10Y2Y. Not financial advice.</p>');
}

let hrBusy=false;
async function refreshAll(){ /* header refresh = hard refresh: forgets every cached answer and in-flight flag, re-requests every Worker-fed card and rebuilds every widget. The icon spins until it is done.
   It never reloads the page and never touches an alert switch, the seen-post lists or any setting, so refreshing cannot reset or trigger alerts. */
  if(hrBusy)return;hrBusy=true;
  const b=$('#refreshall'),t0=Date.now();b.classList.add('spin');b.setAttribute('aria-busy','true');
  try{
    loadingAt=0;calAt=0;calFailAt=0; /* the market and calendar loaders accept a new request at once */
    try{localStorage.removeItem(KEY+'mk_last')}catch(e){}
    for(const k in LIVE)if(LIVE[k].reset)LIVE[k].reset();
    const jobs=[loadMarket(true),nxtLoad(true),feedLoad(true)]; /* the manual refresh asks the Worker for new builds (?fresh=1); no timer ever does */
    for(const k in LIVE)jobs.push(LIVE[k].load(true));
    for(const k in C)draw(k);
    await Promise.race([Promise.allSettled(jobs),sleep(15000)]);
  }catch(e){}
  finally{
    const rest=800-(Date.now()-t0);if(rest>0)await sleep(rest); /* long enough to be seen even when everything answers at once */
    b.classList.remove('spin');b.removeAttribute('aria-busy');hrBusy=false;
  }
}
