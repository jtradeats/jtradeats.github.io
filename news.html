<script>
/* Primary: the Cloudflare Worker. Fallback: market.json on the data branch (only as fresh as the GitHub Action that writes it). */

/* Each card has h (normal height) and full (height of the expand button), in px; fullm is the same on mobile.
   Third-party embeds cannot be measured from here, so adjust full to taste. */

const DEFAULTS={econ:'cal',news:'fj',earn:'eh',look:'ov',heat:'all',tab:'news',ticker:'QQQ'};
const KEY='wss_dash2_';
try{localStorage.removeItem('wss_gh_token')}catch(e){} /* one-click workflow token is no longer used */

const $=(s,r=document)=>r.querySelector(s);

  moon:ico('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
  monitor:ico('<rect x="3" y="4" width="18" height="13" rx="2.5"/><line x1="3" y1="13.5" x2="21" y2="13.5"/><path d="M10 17v3h4v-3"/><line x1="8" y1="20" x2="16" y2="20"/>'),

  reset:ico('<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'),
  refresh:ico('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'),
  open:ico('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'),
  expand:ico('<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>'),
  fold:ico('<polyline points="6 9 12 15 18 9"/>'),
  bell:ico('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>'),
  belloff:ico('<path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><line x1="1" y1="1" x2="23" y2="23"/>'),
  pause:ico('<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'),

};
$('#mrefresh').innerHTML=I.refresh;
{const b=$('#test');b.innerHTML=I.bell;b.setAttribute('aria-label','send a test alert');b.setAttribute('data-tt','send a test alert (mock)');}
{const b=$('#reset');b.innerHTML=I.reset;b.setAttribute('aria-label','reset to defaults');b.setAttribute('data-tt','reset to defaults');}

/* ---- theme + layout (same storage keys as the journal, so both pages stay in sync) ---- */
const dark=()=>root.getAttribute('data-theme')==='dark';
function setFavicon(){
  const l=$('#favicon');if(!l)return;
  const c=dark()?'#F29440':'#D66C1C';
  l.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>');
}
function paintTheme(){setFavicon();const b=$('#theme'),t=dark()?'switch to light mode':'switch to dark mode';b.innerHTML=dark()?I.sun:I.moon;b.setAttribute('aria-label',t);b.setAttribute('data-tt',t)}
function toggleTheme(){const n=dark()?'light':'dark';root.setAttribute('data-theme',n);LS.s('wss_theme',n);paintTheme();for(const k in C)C[k].th=null;showPage(tab)}
let viewMode=LS.g('wss_viewmode','auto');
const mq=matchMedia('(max-width:900px)');
const isMob=()=>viewMode==='mobile'?true:viewMode==='desktop'?false:mq.matches;
function applyLayout(){
  const m=isMob();root.classList.toggle('mobile',m);
  $('#vp').setAttribute('content','width=device-width, initial-scale=1.0'+(m?', maximum-scale=1.0':'')+', viewport-fit=cover');
  const b=$('#layout'),t=m?'switch to desktop layout':'switch to mobile layout';
  b.innerHTML=m?I.monitor:I.phone;b.setAttribute('aria-label',t);b.setAttribute('data-tt',t);
  tapeLayout();
}
function toggleLayout(){const target=isMob()?'desktop':'mobile',det=mq.matches?'mobile':'desktop';viewMode=target===det?'auto':target;LS.s('wss_viewmode',viewMode);applyLayout()}
mq.addEventListener&&mq.addEventListener('change',applyLayout);

/* ---- market gauges + fear & greed (native, fed by market.json) ---- */
const fmt=(v,dp)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const sg=v=>v>0?'+':v<0?'\u2212':'';
const GRPN={VOL:'vol',DOLLAR:'dollar',RATES:'rates',METALS:'metals',INDICES:'indices',ENERGY:'energy','BONDS & CREDIT':'bonds &\ncredit'};
const GRPC={VOL:2,DOLLAR:3,RATES:1,METALS:4,INDICES:5,ENERGY:6,'BONDS & CREDIT':1};
const TAPE_PX=30; /* drift speed, px per second (slow on purpose) */
function tapeFill(el,it){
  const yl=it.kind==='yield',has=it.p!=null;
  const price=!has?'\u2014':yl?fmt(it.p,3)+'%':fmt(it.p,2);
  let chg='',cls='';
  if(has&&it.c!=null){
    cls=it.c>0?'up':it.c<0?'dn':'';
    chg=sg(it.c)+fmt(Math.abs(it.c),yl?3:2)+(!yl&&it.pc!=null?' ('+sg(it.pc)+fmt(Math.abs(it.pc),2)+'%)':'');
  }
  const f=has?fresh(it):{tag:'',dim:false,tip:[]};
  el.className='ti'+(f.dim?' old':'')+(it.stale?' stale':'');
  if(f.tip.length)el.setAttribute('data-tt',f.tip.join(' \u00b7 '));else el.removeAttribute('data-tt');
  el.innerHTML='<div class="l"><span>'+esc(it.label)+'</span><span class="a">'+esc(f.tag)+'</span></div><div class="p">'+price+'</div><div class="c '+cls+'">'+(chg||'&nbsp;')+'</div>';
}
/* the tape is built once per item list and then updated in place, so the scroll never restarts */
let tapeSig='',frozen=LS.g(KEY+'frozen','0')==='1';
const reduceMo=matchMedia('(prefers-reduced-motion:reduce)');
function paintTape(items){
  const box=$('#tape'),sig=items.map(i=>i.label+'|'+(i.row||'A')+'|'+(i.grp||'')).join();
  const rebuilt=sig!==tapeSig;
  if(rebuilt){
    tapeSig=sig;TS.clear();const rows={};
    items.forEach(i=>{const r=i.row||'A';(rows[r]=rows[r]||[]).push(i)});
    box.innerHTML=Object.keys(rows).sort().map(r=>{
      let seq='',g=null;
      rows[r].forEach(i=>{
        if(i.grp&&i.grp!==g){g=i.grp;const lb=GRPN[g]||g.toLowerCase();seq+='<span class="gc'+(lb.indexOf('\n')>-1?' gc2':'')+'" style="color:var(--a'+(GRPC[g]||1)+')">'+esc(lb)+'</span>'}
        seq+='<div class="ti" data-l="'+esc(i.label)+'"></div>';
      });
      return '<div class="tape" role="group" aria-label="market tape" tabindex="0"><div class="trk"><div class="seq">'+seq+'</div><div class="seq" aria-hidden="true">'+seq+'</div></div></div>';
    }).join('');
  }
  items.forEach(i=>box.querySelectorAll('[data-l="'+esc(i.label)+'"]').forEach(el=>tapeFill(el,i)));
  tapeLayout(); /* prices change the text width a little, so measure again */
}
/* The tape is moved by script, not by a CSS animation, so it can be dragged. Each row keeps an offset x (px) into its own
   track, which holds two identical copies side by side: when x passes one copy's width it wraps, so the loop is seamless.
   v is the current speed in px/s: it eases toward the drift speed (or toward 0 while paused), so a flick coasts and then
   the tape drifts on again by itself. Pointer events cover mouse, touch and pen; touch-action:pan-y leaves vertical page scroll alone. */
const TS=new Map();let tapeRaf=0,tapeT=0;
const tapeSt=t=>{let s=TS.get(t);if(!s){s={x:0,v:TAPE_PX,w:0,id:null,hover:false,lx:0,smp:[]};TS.set(t,s)}return s};
const tapeMoves=t=>!t.classList.contains('static');
function tapeMeasure(t){const q=$('.seq',t);tapeSt(t).w=q?q.offsetWidth:0}
function tapeLoop(ts){
  const dt=Math.min(.1,Math.max(0,(ts-tapeT)/1000));tapeT=ts;
  let any=false;
  document.querySelectorAll('#tape .tape').forEach(t=>{
    if(!tapeMoves(t))return;
    any=true;const s=tapeSt(t);if(!s.w)tapeMeasure(t);if(!s.w)return;
    if(s.id==null){ /* not being held */
      const auto=(frozen||s.hover||t.matches(':focus-visible'))?0:TAPE_PX;
      s.v+=(auto-s.v)*(1-Math.exp(-dt/.3));
      s.x+=s.v*dt;
    }
    s.x=((s.x%s.w)+s.w)%s.w;
    t.firstChild.style.transform='translate3d('+(-s.x).toFixed(2)+'px,0,0)';
  });
  tapeRaf=any?requestAnimationFrame(tapeLoop):0;
}
function tapeStart(){if(!tapeRaf){tapeT=performance.now();tapeRaf=requestAnimationFrame(tapeLoop)}}
function tapeLayout(){
  const st=reduceMo.matches; /* the OS 'reduce motion' setting switches to the static grid */
  document.querySelectorAll('#tape .tape').forEach(t=>{
    t.classList.toggle('static',st);t.classList.remove('fit');
    const sq=t.querySelectorAll('.seq');
    sq.forEach(q=>{q.style.paddingRight=''}); /* measure the natural width first */
    if(st){t.firstChild.style.transform='';return}
    let w=sq[0].offsetWidth;
    /* A row that is narrower than the tape (tablets) used to stop and sit still. Instead pad the end of each

  const got=e.ac?'<div class="got">Actual '+esc(e.ac)+(e.fc?' · forecast '+esc(e.fc):'')+(e.pv?' · previous '+esc(e.pv):'')+'</div>':'';
  relShell('Economic release',
    '<h3 class="'+hd.c+'">'+esc(hd.h)+'</h3><div class="relt">'+esc(etDayL(e.t))+', '+etClock(e.t)+' ET · '+esc(loc)+' (your time)'+(e.pd&&k&&k.np?' · '+esc(e.pd):'')+'</div>'+got
    +'<table><tr><th>Event</th><th>Actual</th><th>Forecast</th><th>Previous</th></tr>'+rows+'</table>'
    +(k?'<h4>What it is</h4><p>'+esc(k.what)+'</p><h4>Why it matters</h4><p>'+esc(k.why)+'</p>':'')
    +sc+(k?'<h4>What to watch</h4><p>'+esc(k.watch)+'</p>':'')+bk+nums+src+flag
    +'<p class="relf">The explanations are typical reactions written by hand, not predictions and not AI. Real moves depend on positioning and the details of the report. Green and red follow the reference calendar: green above forecast, red below, reversed for claims, unemployment and crude stocks.</p>');
}
function showAudit(d){
  const a=d.audit||{},c=a.counts,iss=(a.issues||[]).map(i=>'<li class="'+esc(i.lvl)+'">'+esc(i.msg)+'</li>').join('');
  const src=Object.entries(d.sources||{}).filter(([k],i,arr)=>arr.findIndex(x=>x[1]===d.sources[k])===i).map(([k,u])=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])+'</a>').join(' · ');
  relShell('Schedule check',
    '<h3 class="'+(a.status==='ok'?'g':a.status==='error'?'b':'')+'">'+(a.status==='ok'?'No problems found':a.status==='unk'?'Not audited (the Worker was not reached)':a.nIssues+' note'+(a.nIssues===1?'':'s')+(a.status==='error'?', including errors':''))+'</h3>'
    +'<div class="relt">'+(a.total||0)+' scheduled releases, '+fmtIso(a.first)+' to '+fmtIso(a.horizon)+(a.checked?' · oldest check '+fmtIso(a.checked):'')+'</div>'
    +(c?'<p>'+c.official+' dates read from agency pages · '+(c.ref||0)+' from the reference calendar · '+c.rule+' derived from the agency’s usual pattern · '+c.check+' in doubt.</p>':'')
    +(iss?'<ul class="iss">'+iss+'</ul>':'')
    +'<h4>What is checked</h4><p>On every load the Worker re-checks the file: no weekend or federal-holiday dates, the right time for each release type, no missing or doubled weeks and months, FOMC spacing, minutes three weeks after each decision, how long ago each type was checked, and how far ahead the file runs. When the unofficial feed answers, its dates and times are compared with the schedule too. A device-clock check runs against the Worker’s clock'+(Math.abs(clkOff)>2000?' (yours is off by '+(Math.abs(clkOff)/1000).toFixed(0)+' s and is corrected)':' (yours agrees to within 2 s)')+'.</p>'
    +(src?'<h4>Official sources</h4><p>'+src+'</p>':'')
    +'<p class="relf">The check proves the file is consistent, not that the agencies have not changed a date since it was last compared with their pages.</p>');
}
relBox.addEventListener('click',e=>{if(e.target===relBox)closeRel()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRel()});

paintTheme();applyLayout();paintCached();showPage(tab);for(const k in C)paintCard(k);loadMarket();nxtLoad();nxtPaint();clkPaint();lclkPaint();paintRem();paintFreeze();
</script>
