<div id="app">

      <button class="topicon themetoggle" id="theme" onclick="toggleTheme()"></button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab t-news" data-p="news">news</button><span class="tabsep">|</span>
    <button class="tab t-tech" data-p="tech">technicals</button><span class="tabsep">|</span>
    <button class="tab t-earn" data-p="earn">earnings</button><span class="tabsep">|</span>

      <div class="tapes" id="tape"></div>
    </section>
  </div>
  <div class="mk3">
    <section class="card" id="clk">
      <div class="ch"><span class="plbl">sessions</span><span class="stamp" id="lclk"></span></div>
      <div class="cbody" id="cbody"></div>
    </section>
    <section class="card" id="fng">
      <div class="ch"><span class="plbl">fear &amp; greed</span></div>
      <div class="fbody" id="fbody"></div>

}

function paintTape(items){

const pol=(a,r)=>[100+r*Math.cos(a),100-r*Math.sin(a)];
function arc(s0,s1,r){
  const [x0,y0]=pol(Math.PI*(1-s0/100),r),[x1,y1]=pol(Math.PI*(1-s1/100),r);
  return 'M'+x0.toFixed(1)+' '+y0.toFixed(1)+'A'+r+' '+r+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1);
}
function gauge(f){
  const segs=[[0,25,'--r',1],[25,45,'--r',.5],[45,56,'--t3',.6],[56,76,'--g',.5],[76,100,'--g',1]];

  segs.forEach(([a,b,c,o])=>{svg+='<path d="'+arc(a+.6,b-.6,80)+'" fill="none" stroke="var('+c+')" stroke-opacity="'+o+'" stroke-width="10"/>'});
  const [nx,ny]=pol(Math.PI*(1-f.score/100),64);
  svg+='<line x1="100" y1="100" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" stroke="var(--t)" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="100" r="4" fill="var(--t)"/></svg>';
  const p=[['prev',f.prev],['1w',f.week],['1m',f.month],['1y',f.year]].filter(x=>x[1]!=null).map(x=>x[0]+' '+Math.round(x[1])).join(' \u00b7 ');
  return svg+'<div><span class="fnum">'+Math.round(f.score)+'</span><span class="frate">'+band(f.score)+'</span></div><div class="fprev">'+p+'</div>';
}

/* CME equity-futures hours in New York time: Sun 18:00 to Fri 17:00, with a 17:00-18:00 break. Exchange holidays are not handled. */
function futClosed(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value,d=g('weekday'),m=+g('hour')*60+ +g('minute');
  if(d==='Sat')return true;
  if(d==='Sun')return m<1080;
  if(d==='Fri')return m>=1020;
  return m>=1020&&m<1080;
}
function cashOpen(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value,d=g('weekday'),m=+g('hour')*60+ +g('minute');
  return d!=='Sat'&&d!=='Sun'&&m>=570&&m<960;
}
function fresh(it){
  const tip=[];let tag='',dim=false;
  if(it.src)tip.push(it.src.replace(':',' '));
  if(it.contract)tip.push(it.contract);
  if(it.stale){tag='stale';dim=true;tip.push('latest fetch failed, showing the last good value')}
  if(it.cls==='prior'){
    if(!tag)tag='eod';
    tip.push('end-of-day value'+(it.t!=null?' for '+new Date(it.t).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}):''));
  }else if(it.t!=null){
    const age=Date.now()-it.t,shut=age>OLD&&(it.kind==='etf'?!cashOpen():futClosed());
    if(!tag)tag=shut?'closed':fmtAge(age);
    if(age>OLD&&!shut)dim=true;
    tip.push((shut?'market closed, last quote ':'as of ')+asOf(it.t));
  }else tip.push('source gives no timestamp');
  if(it.rolledAt&&Date.now()-it.rolledAt<864e5){tip.push('contract rolled '+ago(Date.now()-it.rolledAt));tag=tag?'rolled '+tag:'rolled'}
  return {tag,dim,tip};
}
function paintStamp(msg){
  const el=$('#stamp');
  if(msg){el.textContent=msg;return}
  if(!lastData)return;
  const items=lastData.items||[];
  const ts=items.filter(i=>i.p!=null&&!i.stale&&i.cls!=='prior'&&i.t!=null).map(i=>i.t);
  const miss=items.filter(i=>i.p==null).length,stl=items.filter(i=>i.stale).length;
  let s;
  if(ts.length){const n=Math.max(...ts),age=Date.now()-n,shut=age>OLD&&futClosed();s=shut?'market closed \u00b7 last quotes '+asOf(n):'quotes as of '+asOf(n)+' \u00b7 '+ago(age)+(age>OLD?' \u00b7 old':'')}
  else s='no timestamped quotes';
  if(stl)s+=' \u00b7 '+stl+' stale';
  if(miss)s+=' \u00b7 '+miss+' missing';
  if(lastData.via!=='worker')s+=' \u00b7 fallback file';
  if(lastData.__cached)s+=' \u00b7 cached';
  if(refreshFailed)s+=' \u00b7 refresh failed';
  el.textContent=s;
  el.title=(lastData.updated?'data built '+hhmm(new Date(lastData.updated))+'\n':'')+(lastData.notes||[]).concat(lastData.errors||[]).join('\n');
}

async function fetchMarket(){
  if(window.__MK0){const p=window.__MK0;window.__MK0=null;const d=await p;if(d&&d.items)return d}
  try{

    if(!d.items)throw new Error('bad payload');

  }catch(e){

  }
}

/* ---- native economic calendar (Worker /calendar; USD only; High by default, '+ medium' remembered per browser) ---- */
const CAL_URL=WORKER_URL.replace(/\/market$/,'/calendar');
let calData=null,calAt=0,calMed=LS.g(KEY+'cal_med','0')==='1',calRng=LS.g(KEY+'cal_rng','week');
async function calGet(){
  if(calData&&Date.now()-calAt<300000)return calData;
  const r=await fetch(CAL_URL,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
  const d=await r.json();if(!Array.isArray(d.events))throw new Error('bad payload');
  calData=d;calAt=Date.now();return d;
}
const cal=el=>{
  el.innerHTML='<div class="cal"><div class="calbar"><button class="pbtn" data-ck="today">today</button><button class="pbtn" data-ck="week">upcoming</button><button class="pbtn" data-ck="med">+ medium</button><span class="calnote"></span></div><div class="calscroll"><p class="note">loading\u2026</p></div></div>';
  const bar=$('.calbar',el),box=$('.calscroll',el);
  const paint=d=>{
    const now=Date.now(),s0=new Date();s0.setHours(0,0,0,0);const a=s0.getTime();
    const ev=d.events.filter(e=>(calMed||e.imp===3)&&e.t>=a&&(calRng==='week'||e.t<a+864e5));
    const nx=ev.find(e=>e.t>now);let h='',last='';
    for(const e of ev){
      const day=new Date(e.t).toDateString();
      if(day!==last){last=day;h+='<tr class="day"><td colspan="6">'+esc(new Date(e.t).toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'}))+'</td></tr>'}
      h+='<tr class="'+(e.t<now?'past':e===nx?'next':'')+'"><td>'+esc(new Date(e.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))+'</td><td><span class="imp '+(e.imp===3?'h':'m')+'"><i></i><i></i><i></i></span></td><td class="ev">'+esc(e.title)+'</td><td class="n"><b>'+esc(e.ac||'')+'</b></td><td class="n">'+esc(e.fc||'')+'</td><td class="n">'+esc(e.pv||'')+'</td></tr>';
    }
    box.innerHTML=ev.length?'<table class="ct"><thead><tr><th>time</th><th>imp</th><th>event (USD)</th><th class="n">actual</th><th class="n">forecast</th><th class="n">previous</th></tr></thead><tbody>'+h+'</tbody></table>':'<p class="note">No '+(calMed?'high or medium':'high')+'-impact USD events in this range.</p>';
    bar.querySelectorAll('.pbtn').forEach(b=>{const k=b.dataset.ck;b.classList.toggle('on',k==='med'?calMed:k===calRng)});
    $('.calnote',el).textContent='forecast and previous only \u00b7 unofficial feed \u00b7 '+hhmm(new Date(d.updated));
  };
  bar.onclick=e=>{const b=e.target.closest('[data-ck]');if(!b||!calData)return;const k=b.dataset.ck;
    if(k==='med'){calMed=!calMed;LS.s(KEY+'cal_med',calMed?'1':'0')}else{calRng=k;LS.s(KEY+'cal_rng',k)}paint(calData)};
  calGet().then(paint).catch(()=>{box.innerHTML='<p class="note">Calendar feed unavailable (Worker /calendar). Use the MQL5 or TradingView tab.</p>'});
};

/* ---- next high-impact USD event countdown + session clock (row under the gauges) ---- */
const cd=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+'d '+h+'h':h?h+'h '+m+'m':m+'m '+String(s%60).padStart(2,'0')+'s'};
let calFail=false,calErr='';
const p2=n=>String(n).padStart(2,'0');
const tzName=t=>new Date(t).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit',timeZoneName:'short'}); /* visitor's own zone, follows the device */
function nxtMsg(b,k,html){if(b.dataset.k!==k){b.dataset.k=k;b.removeAttribute('data-st');b.innerHTML=html}}
function nxtPaint(){
  const b=$('#nbody');if(!b)return;
  if(!calData){
    const why=calErr==='404'?'The Worker has no /calendar route yet. Deploy worker/src/index.js.':calErr==='502'?'The Worker could not reach the feed. Open its /calendar URL to see why.':calErr?'Worker /calendar failed ('+esc(calErr)+').':'';
    nxtMsg(b,'m'+calFail+calErr,'<p class="note">'+(calFail?'calendar feed unavailable'+(why?'<br>'+why:''):'loading\u2026')+'</p>');
    return;
  }
  const now=Date.now(),hi=calData.events.filter(x=>x.imp===3&&x.t>now-900000),e=hi[0];
  if(!e){nxtMsg(b,'none','<p class="note">no high-impact USD event in the feed</p>');return}
  const same=hi.filter(x=>x.t===e.t),rel=e.t<=now,ms=Math.abs(e.t-now),s=Math.floor(ms/1000);
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sc=s%60;
  const parts=rel?[['min',m],['sec',sc]]:d?[['day',d],['hr',h],['min',m],['sec',sc]]:[['hr',h],['min',m],['sec',sc]];
  const st=rel?'live':ms<36e5?'soon':'calm',key=e.t+'|'+same.length+'|'+st+'|'+parts.map(x=>x[0]).join();
  if(b.dataset.k!==key){
    b.dataset.k=key;b.dataset.st=st;
    b.innerHTML='<div class="tm" role="timer" aria-live="off" aria-label="'+esc(e.title)+'">'+parts.map(x=>'<div class="tu"><b>00</b><small>'+x[0]+'</small></div>').join('')+'</div><div class="nbar"><i></i></div><div class="nev">'+esc(e.title)+(same.length>1?' <span class="more">+'+(same.length-1)+' more</span>':'')+'</div><div class="nsub">'+(rel?'released ':'')+esc(tzName(e.t))+(e.fc?' \u00b7 forecast '+esc(e.fc):'')+(e.pv?' \u00b7 previous '+esc(e.pv):'')+'</div>';
  }
  const nums=b.querySelectorAll('.tu b');
  parts.forEach((x,i)=>{const v=p2(x[1]);if(nums[i]&&nums[i].textContent!==v)nums[i].textContent=v});
  const bar=b.querySelector('.nbar i');if(bar)bar.style.width=Math.max(0,Math.min(100,100-ms/864e5*100))+'%'; /* fills over the last 24 h */
}
const nxtLoad=()=>calGet().then(()=>{calFail=false;calErr='';nxtPaint()}).catch(e=>{calFail=true;calErr=String(e.message);nxtPaint()});
function lclkPaint(){const el=$('#lclk');if(el)el.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short'})}

/* ---- calendar reminders (plan 4.2, in-page version): toasts for High-impact USD events, 15 min and 5 min before and at release.
   Only fires while this page is open (a hidden tab is fine). Each reminder fires once per event, remembered per browser. Push to the phone needs the Worker cron (plan 4.5). ---- */
const REM=[15,5,0],REM_WINDOW=150000;
let remOn=LS.g(KEY+'rem_on','1')==='1',fired=[];
try{fired=JSON.parse(LS.g(KEY+'rem_fired','[]'))||[]}catch(e){}
function paintRem(){
  const b=$('#remb');if(!b)return;
  const t=remOn?'reminders on: 15 min and 5 min before, and at release (while this page is open). Click to turn off':'reminders off. Click to turn on';
  b.innerHTML=remOn?I.bell:I.belloff;b.classList.toggle('on',remOn);b.setAttribute('aria-label',t);b.setAttribute('data-tt',t);
}
function toggleRem(){remOn=!remOn;LS.s(KEY+'rem_on',remOn?'1':'0');paintRem()}
function remCheck(){
  if(!remOn||!calData)return;
  const now=Date.now(),by=new Map();let dirty=false;
  calData.events.forEach(e=>{if(e.imp===3){if(!by.has(e.t))by.set(e.t,[]);by.get(e.t).push(e)}});
  for(const [t,list] of by)for(const r of REM){
    const at=t-r*60000,k=t+'|'+r;
    if(now<at||now>at+REM_WINDOW||fired.includes(k))continue; /* too late to be useful: skip, never replay old ones */
    fired.push(k);dirty=true;
    const one=list.length===1?list[0]:null,mins=Math.max(1,Math.ceil((t-now)/60000));
    toast({src:'Calendar \u00b7 USD',tag:'HIGH IMPACT \u00b7 '+(r?'RELEASE IN '+mins+' MIN':'RELEASE NOW'),h:list.map(x=>x.title).join(' \u00b7 '),
      s:r===0?'The actual is not in this feed yet.':one?(one.fc?'Forecast '+one.fc:'No forecast')+(one.pv?' \u00b7 previous '+one.pv:''):list.length+' releases at '+hhmm(new Date(t))+'.',ms:60000});
  }
  if(dirty){fired=fired.filter(k=>+k.split('|')[0]>now-2*864e5);LS.s(KEY+'rem_fired',JSON.stringify(fired))}
}
setInterval(remCheck,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)remCheck()});

/* sessions in each exchange's own local hours (minutes from midnight); holidays and lunch breaks are not handled */
const SESS=[['Asia \u00b7 Tokyo','Asia/Tokyo',540,930],['London','Europe/London',480,990],['New York cash','America/New_York',570,960]];
function inTz(tz){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:+g('hour')*60+ +g('minute')};
}
const dm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
function clkPaint(){
  const el=$('#cbody');if(!el)return;
  el.innerHTML=SESS.map(([n,tz,o,c])=>{
    const t=inTz(tz),wk=t.d>0&&t.d<6,op=wk&&t.m>=o&&t.m<c;let s;
    if(op)s='open \u00b7 closes in '+dm(c-t.m);
    else{let w=null;if(wk&&t.m<o)w=o-t.m;else for(let i=1;i<=7;i++){const nd=(t.d+i)%7;if(nd>0&&nd<6){w=i*1440-t.m+o;break}}s='opens in '+dm(w)}
    return '<div class="sess"><span class="sd'+(op?' on':'')+'"></span><span class="sn">'+n+'</span><span class="ss">'+s+'</span></div>';
  }).join('')+'<div class="sess sft">CME equity futures: '+(futClosed()?'closed':'open')+'</div>';
}

const tipEl=document.createElement('div');tipEl.id='tt';document.body.appendChild(tipEl);
const canTip=()=>!root.classList.contains('mobile')&&matchMedia('(hover:hover)').matches;
function tipShow(el){
  const t=el.getAttribute('data-tt');if(!t||!canTip())return;
  tipEl.textContent=t;tipEl.style.transform='translate(0,0)';
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  const x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8));
  let y=r.top-h-8;if(y<8)y=r.bottom+8;
  tipEl.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';tipEl.style.opacity='1';
}
const tipHide=()=>{tipEl.style.opacity='0'};
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tt]');if(el)tipShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tt]'))tipHide()});

  let t;const kill=()=>{clearTimeout(t);el.remove()};
  t=setTimeout(kill,a.ms||TOAST_MS);
  $('.x',el).onclick=kill;
  const rd=$('.rd',el);if(rd)rd.onclick=()=>{kill();showRelease()};
  toastBox.appendChild(el);
  while(toastBox.children.length>TOAST_MAX)toastBox.firstChild.remove();
}
