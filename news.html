<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f7f6f3;--surface:#ffffff;--s2:rgba(120,120,110,0.06);
  --bd:rgba(100,100,92,0.16);--bdm:rgba(100,100,92,0.30);
  --t:#1c1c1a;--t2:#615f5a;--t3:#8b8a83;
  --g:#4E9269;--r:#C97878;
  --pbsel:#A47DAB;--pbselbg:rgba(164,125,171,0.14);--pbselbd:rgba(164,125,171,0.34);
  --tabdash:#A15B78;--tabdashbg:rgba(161,91,120,0.12);--tabdashbd:rgba(161,91,120,0.32);
  --tablr:#4F7691;--tablrbg:rgba(79,118,145,0.12);--tablrbd:rgba(79,118,145,0.32);
  --rad:8px;--radl:12px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --fxs:11px;--fsm:12px;--fbase:13px;--fh1:26px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121214;--surface:#1b1b1e;--s2:rgba(255,255,255,0.045);
  --bd:rgba(255,255,255,0.09);--bdm:rgba(255,255,255,0.16);
  --t:#f0efe9;--t2:#b7b5ad;--t3:#8b8a83;
  --g:#7FCBA0;--r:#E69A9A;
  --pbsel:#EDC8FF;--pbselbg:rgba(237,200,255,0.15);--pbselbd:rgba(237,200,255,0.35);
  --tabdash:#A9C6DE;--tabdashbg:rgba(169,198,222,0.15);--tabdashbd:rgba(169,198,222,0.35);
  --tablr:#E0AFC2;--tablrbg:rgba(224,175,194,0.15);--tablrbd:rgba(224,175,194,0.35);
}
body{font-family:var(--sans);background:var(--bg);color:var(--t);min-height:100vh;font-size:var(--fbase)}
#app{max-width:1152px;margin:0 auto;padding:2rem 1.25rem 4rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:1.5rem}
.brand{font-size:var(--fxs);color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:var(--fh1);font-weight:600;letter-spacing:-.5px}
.topbaracts{display:flex;align-items:center;gap:10px}
.topicon{height:16px;min-width:16px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:none;padding:0;color:var(--t2);flex-shrink:0}
.topicon:hover{color:var(--t)}
.topicon svg{width:16px;height:16px;display:block}
.topbaracts .topicon{height:32px;min-width:32px}
.themetoggle{color:#ffbf00}
.themetoggle:hover{opacity:.75;color:#ffbf00}
.themetoggle svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--pbsel);outline-offset:2px;border-radius:4px}
#tt{position:fixed;left:0;top:0;z-index:2147483000;pointer-events:none;opacity:0;transition:opacity .1s;max-width:240px;width:max-content;text-align:center;font-size:11px;font-weight:500;line-height:1.3;padding:5px 9px;border-radius:6px;color:var(--tabdash);border:.5px solid var(--tabdashbd);background-color:var(--surface);background-image:linear-gradient(var(--tabdashbg),var(--tabdashbg))}
.tabs{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:1.25rem}
.tab{padding:6px 14px;border-radius:calc(var(--rad) - 1px);font-size:var(--fbase);font-family:var(--sans);cursor:pointer;border:.5px solid transparent;color:var(--t2);background:transparent;transition:all .15s}
.tab.on{font-weight:600}
.tab.on.t-news,.tab.on.t-heat{background:var(--tablrbg);color:var(--tablr);border-color:var(--tablrbd)}
.tab.on.t-tech{background:var(--tabdashbg);color:var(--tabdash);border-color:var(--tabdashbd)}
.tab:hover:not(.on){color:var(--t)}
.tabsep{color:var(--t3);user-select:none}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;margin-bottom:1.25rem;align-items:start}
.mk{display:grid;grid-template-columns:minmax(0,9fr) minmax(0,3fr);gap:10px;margin-bottom:10px}
.card{grid-column:span var(--sp,6);height:var(--h,460px);display:flex;flex-direction:column;background:var(--s2);border:.5px solid var(--bd);border-radius:var(--radl);overflow:hidden}
.mk .card{height:auto}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:.5px solid var(--bd);min-height:38px;user-select:none;-webkit-user-select:none}
.plbl{font-size:var(--fxs);color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-right:auto;white-space:nowrap}
.stamp{font-size:var(--fxs);color:var(--t3);white-space:nowrap}
.seg{display:flex;gap:4px;overflow-x:auto}
.pbtn{padding:3px 9px;border-radius:calc(var(--rad) - 1px);font-size:var(--fsm);font-weight:300;font-family:var(--sans);cursor:pointer;border:.5px solid transparent;color:var(--t2);background:transparent;transition:all .15s;white-space:nowrap}
.pbtn.on{background:var(--pbselbg);color:var(--pbsel);border-color:var(--pbselbd);font-weight:600}
.pbtn:hover:not(.on){color:var(--t)}
.acts{display:flex;align-items:center;gap:10px}
.tb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:.5px solid var(--bd)}
.tb input{width:100px;height:28px;padding:4px 9px;font-family:var(--sans);font-size:var(--fbase);border:.5px solid var(--bdm);border-radius:var(--rad);background:var(--surface);color:var(--t);outline:none;text-transform:uppercase}
.tb input:focus{border-color:var(--pbsel)}
.btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:var(--fsm);height:28px;padding:0 12px;border-radius:var(--rad);border:.5px solid var(--bdm);background:var(--s2);color:var(--t);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn svg{width:12px;height:12px}
.tb .btn:last-child{margin-left:auto;color:var(--t2)}
.body{flex:1;min-height:0;position:relative;overflow:auto}
.body iframe,.card iframe{width:100%;height:100%;border:0;display:block;color-scheme:normal}
.body .tradingview-widget-container,.body .tradingview-widget-container__widget{height:100%;width:100%}
.stk{display:flex;flex-direction:row;height:100%}
.stk .s1{flex:0 0 40%;min-width:0;border-right:.5px solid var(--bd)}
.stk .s2{flex:1;min-width:0}
.fin{height:100%;background:#fff}
.fin #finlogix-box{height:100%;width:100%}
html[data-theme="dark"] .fin{filter:invert(.9) hue-rotate(180deg)}
#financialjuice-news-widget-container{height:100%;width:100%}
#financialjuice-news-widget-container>*,#financialjuice-news-widget-container iframe{height:100%!important;width:100%!important}
.note{padding:16px;color:var(--t3);font-size:var(--fsm);line-height:1.5}
.card.closed{height:auto}.card.closed .body,.card.closed .tb{display:none}.card.closed .ch{border-bottom:none}
.card.tall{height:var(--full,var(--h))}
.card.closed.tall{height:auto}
[data-a="c"] svg{transition:transform .15s}
.card.closed [data-a="c"] svg{transform:rotate(-90deg)}
[hidden]{display:none!important}
/* market gauges */
.qgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:6px 4px;flex:1;align-content:center}
.q{padding:8px 10px;min-width:0}
.q .l{font-size:var(--fxs);color:var(--t3);letter-spacing:.06em;display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:6px}
.q .a{font-size:10px;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.q.stale .a{color:var(--r)}
.q .p{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin:1px 0}
.q .c{font-size:var(--fsm);font-variant-numeric:tabular-nums;color:var(--t3);white-space:nowrap}
.q .c.up{color:var(--g)}.q .c.dn{color:var(--r)}
.q.stale .p,.q.old .p{opacity:.55}
.fbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 12px;gap:4px}
.fbody svg{width:100%;max-width:210px;height:auto;display:block}
.fnum{font-size:22px;font-weight:600;line-height:1}
.frate{color:var(--t2);font-size:var(--fsm);margin-left:6px}
.fprev{font-size:var(--fxs);color:var(--t3);text-align:center}
.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
html.mobile #app{padding:1rem max(.85rem,env(safe-area-inset-right)) 3rem max(.85rem,env(safe-area-inset-left))}
html.mobile h1{font-size:22px}
html.mobile .topicon{height:32px;min-width:32px}
html.mobile .tab{padding:8px 12px}
html.mobile .tabs{gap:4px}
html.mobile .mk{grid-template-columns:minmax(0,1fr)}
html.mobile .qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
html.mobile .q{padding:7px 6px}
html.mobile .q .c{white-space:normal}
html.mobile .stamp{white-space:normal;text-align:right}
html.mobile .grid{display:flex;flex-direction:column;align-items:stretch}
html.mobile .card{height:var(--hm,440px)}
html.mobile .mk .card{height:auto}
html.mobile .card.closed{height:auto}
html.mobile .card.tall{height:var(--fullm,var(--hm))}
html.mobile .card.closed.tall{height:auto}
html.mobile .tb input{font-size:16px}
html.mobile .stk{flex-direction:column}
html.mobile .stk .s1{flex:none;height:290px;border-right:0;border-bottom:.5px solid var(--bd)}
html.mobile .stk .s1.ta{height:440px}
html.mobile .stk .s2{flex:1;min-height:200px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div><p class="brand">J.</p><h1>dashboard</h1></div>
    <div class="topbaracts">
      <button class="topicon" id="reset" onclick="resetPrefs()"></button>
      <button class="topicon" id="layout" onclick="toggleLayout()"></button>
      <button class="topicon themetoggle" id="theme" onclick="toggleTheme()"></button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab t-news" data-p="news">news</button><span class="tabsep">|</span>
    <button class="tab t-tech" data-p="tech">technicals</button><span class="tabsep">|</span>
    <button class="tab t-heat" data-p="heat">heatmap</button>
  </div>
  <div class="mk">
    <section class="card" id="strip">
      <div class="ch"><span class="plbl">market gauges</span><span class="stamp" id="stamp"></span>
        <button class="topicon" id="mrefresh" aria-label="reload the latest data" data-tt="reload the latest data"></button></div>
      <div class="qgrid" id="qgrid"></div>
    </section>
    <section class="card" id="fng">
      <div class="ch"><span class="plbl">fear &amp; greed</span></div>
      <div class="fbody" id="fbody"></div>
    </section>
  </div>
  <div class="grid" id="p-news"></div>
  <div class="grid" id="p-tech" hidden></div>
  <div class="grid" id="p-heat" hidden></div>
</div>
<script>
/* Primary: the Cloudflare Worker. Fallback: market.json on the data branch (only as fresh as the GitHub Action that writes it). */
const WORKER_URL=window.__MKURL||'https://market-dashboard.jtradeats.workers.dev/market';
const DATA_URL='https://raw.githubusercontent.com/jtradeats/jtradeats.github.io/data/market.json'; /* fallback */

/* Each card has h (normal height) and full (height of the expand button), in px; fullm is the same on mobile.
   Third-party embeds cannot be measured from here, so adjust full to taste. */
/* Defaults used on any browser that has no saved choice. Picking a tab on a card is remembered per browser
   (the reset icon in the header clears those and brings these back). */
const DEFAULTS={econ:'fin',news:'fj',earn:'eh',look:'ov',heat:'sp',tab:'news',ticker:'AAPL'};
/* Finlogix: generate a widget at finlogix.com/widgets and paste its widgetId here to use its saved filters. */
const FINLOGIX_ID='7010460f-918f-40ff-8aac-d0cc62d89e4a';
const KEY='wss_dash2_';
try{localStorage.removeItem('wss_gh_token')}catch(e){} /* one-click workflow token is no longer used */

const LS={g(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=(s,r=document)=>r.querySelector(s);
const root=document.documentElement;
const ico=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const I={
  sun:ico('<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'),
  moon:ico('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
  monitor:ico('<rect x="3" y="4" width="18" height="13" rx="2.5"/><line x1="3" y1="13.5" x2="21" y2="13.5"/><path d="M10 17v3h4v-3"/><line x1="8" y1="20" x2="16" y2="20"/>'),
  phone:ico('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><line x1="6.5" y1="6" x2="17.5" y2="6"/><line x1="6.5" y1="17" x2="17.5" y2="17"/><circle cx="12" cy="19.3" r=".5" fill="currentColor"/>'),
  reset:ico('<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'),
  refresh:ico('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'),
  open:ico('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'),
  expand:ico('<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>'),
  fold:ico('<polyline points="6 9 12 15 18 9"/>')
};
$('#mrefresh').innerHTML=I.refresh;
{const b=$('#reset');b.innerHTML=I.reset;b.setAttribute('aria-label','reset to defaults');b.setAttribute('data-tt','reset to defaults');}

/* ---- theme + layout (same storage keys as the journal, so both pages stay in sync) ---- */
const dark=()=>root.getAttribute('data-theme')==='dark';
function setFavicon(){const l=$('#favicon');if(l&&window.__FAV)l.href=window.__FAV[dark()?'dark':'light']}
function paintTheme(){setFavicon();const b=$('#theme'),t=dark()?'switch to light mode':'switch to dark mode';b.innerHTML=dark()?I.sun:I.moon;b.setAttribute('aria-label',t);b.setAttribute('data-tt',t)}
function toggleTheme(){const n=dark()?'light':'dark';root.setAttribute('data-theme',n);LS.s('wss_theme',n);paintTheme();for(const k in C)C[k].th=null;showPage(tab)}
let viewMode=LS.g('wss_viewmode','auto');
const mq=matchMedia('(max-width:900px)');
const isMob=()=>viewMode==='mobile'?true:viewMode==='desktop'?false:mq.matches;
function applyLayout(){
  const m=isMob();root.classList.toggle('mobile',m);
  $('#vp').setAttribute('content','width=device-width, initial-scale=1.0'+(m?', maximum-scale=1.0':'')+', viewport-fit=cover');
  const b=$('#layout'),t=m?'switch to desktop layout':'switch to mobile layout';
  b.innerHTML=m?I.monitor:I.phone;b.setAttribute('aria-label',t);b.setAttribute('data-tt',t);
}
function toggleLayout(){const target=isMob()?'desktop':'mobile',det=mq.matches?'mobile':'desktop';viewMode=target===det?'auto':target;LS.s('wss_viewmode',viewMode);applyLayout()}
mq.addEventListener&&mq.addEventListener('change',applyLayout);

/* ---- market gauges + fear & greed (native, fed by market.json) ---- */
const fmt=(v,dp)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const sg=v=>v>0?'+':v<0?'\u2212':'';
function cell(it){
  const yl=it.kind==='yield',has=it.p!=null;
  const price=!has?'\u2014':yl?fmt(it.p,3)+'%':fmt(it.p,2);
  let chg='',cls='';
  if(has&&it.c!=null){
    cls=it.c>0?'up':it.c<0?'dn':'';
    chg=sg(it.c)+fmt(Math.abs(it.c),yl?3:2)+(!yl&&it.pc!=null?' ('+sg(it.pc)+fmt(Math.abs(it.pc),2)+'%)':'');
  }
  const f=has?fresh(it):{tag:'',dim:false,tip:[]};
  return '<div class="q'+(f.dim?' old':'')+(it.stale?' stale':'')+'"'+(f.tip.length?' data-tt="'+esc(f.tip.join(' \u00b7 '))+'"':'')+'><div class="l"><span>'+esc(it.label)+'</span><span class="a">'+esc(f.tag)+'</span></div><div class="p">'+price+'</div><div class="c '+cls+'">'+(chg||'&nbsp;')+'</div></div>';
}
const band=s=>s<25?'extreme fear':s<45?'fear':s<56?'neutral':s<76?'greed':'extreme greed';
const pol=(a,r)=>[100+r*Math.cos(a),100-r*Math.sin(a)];
function arc(s0,s1,r){
  const [x0,y0]=pol(Math.PI*(1-s0/100),r),[x1,y1]=pol(Math.PI*(1-s1/100),r);
  return 'M'+x0.toFixed(1)+' '+y0.toFixed(1)+'A'+r+' '+r+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1);
}
function gauge(f){
  const segs=[[0,25,'--r',1],[25,45,'--r',.5],[45,56,'--t3',.6],[56,76,'--g',.5],[76,100,'--g',1]];
  let svg='<svg viewBox="0 0 200 112" role="img" aria-label="fear and greed index '+Math.round(f.score)+', '+band(f.score)+'">';
  segs.forEach(([a,b,c,o])=>{svg+='<path d="'+arc(a+.6,b-.6,80)+'" fill="none" stroke="var('+c+')" stroke-opacity="'+o+'" stroke-width="10"/>'});
  const [nx,ny]=pol(Math.PI*(1-f.score/100),64);
  svg+='<line x1="100" y1="100" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" stroke="var(--t)" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="100" r="4" fill="var(--t)"/></svg>';
  const p=[['prev',f.prev],['1w',f.week],['1m',f.month],['1y',f.year]].filter(x=>x[1]!=null).map(x=>x[0]+' '+Math.round(x[1])).join(' \u00b7 ');
  return svg+'<div><span class="fnum">'+Math.round(f.score)+'</span><span class="frate">'+band(f.score)+'</span></div><div class="fprev">'+p+'</div>';
}
let haveData=false,lastData=null,busy=false,loading=false,refreshFailed=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hhmm=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const ago=ms=>{const m=Math.round(ms/60000);return m<1?'just now':m<60?m+' min ago':m<2880?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OLD=30*60000; /* a quote older than this is dimmed: delayed feeds normally sit at 10-15 min */
const fmtAge=ms=>{const m=Math.round(ms/60000);return m<1?'<1m':m<60?m+'m':m<2880?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'};
const asOf=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?hhmm(d):d.toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'})};
function fresh(it){
  const tip=[];let tag='',dim=false;
  if(it.src)tip.push(it.src.replace(':',' '));
  if(it.contract)tip.push(it.contract);
  if(it.stale){tag='stale';dim=true;tip.push('latest fetch failed, showing the last good value')}
  if(it.cls==='prior'){
    if(!tag)tag='close';
    tip.push('end-of-day value'+(it.t!=null?' for '+new Date(it.t).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}):''));
  }else if(it.t!=null){
    const age=Date.now()-it.t;
    if(!tag)tag=fmtAge(age);
    if(age>OLD)dim=true;
    tip.push('as of '+asOf(it.t));
  }else tip.push('source gives no timestamp');
  if(it.rolledAt&&Date.now()-it.rolledAt<864e5){tip.push('contract rolled '+ago(Date.now()-it.rolledAt));tag=tag?'rolled '+tag:'rolled'}
  return {tag,dim,tip};
}
function paintStamp(msg){
  const el=$('#stamp');
  if(msg){el.textContent=msg;return}
  if(!lastData)return;
  const items=lastData.items||[];
  const ts=items.filter(i=>i.p!=null&&!i.stale&&i.cls!=='prior'&&i.t!=null).map(i=>i.t);
  const miss=items.filter(i=>i.p==null).length,stl=items.filter(i=>i.stale).length;
  let s;
  if(ts.length){const n=Math.max(...ts),age=Date.now()-n;s='quotes as of '+asOf(n)+' \u00b7 '+ago(age)+(age>OLD?' \u00b7 old':'')}
  else s='no timestamped quotes';
  if(stl)s+=' \u00b7 '+stl+' stale';
  if(miss)s+=' \u00b7 '+miss+' missing';
  if(lastData.via!=='worker')s+=' \u00b7 fallback file';
  if(lastData.__cached)s+=' \u00b7 cached';
  if(refreshFailed)s+=' \u00b7 refresh failed';
  el.textContent=s;
  el.title=(lastData.updated?'data built '+hhmm(new Date(lastData.updated))+'\n':'')+(lastData.notes||[]).concat(lastData.errors||[]).join('\n');
}
function renderMarket(d){
  haveData=true;lastData=d;
  $('#qgrid').innerHTML=(d.items||[]).map(cell).join('');
  paintStamp();
  $('#fbody').innerHTML=d.fng&&d.fng.score!=null?gauge(d.fng):'<p class="note">no reading yet'+(d.fng_error?'<br>'+esc(d.fng_error):'')+'</p>';
  if(!d.__cached)LS.s(KEY+'mk_last',JSON.stringify(d));
}
function paintCached(){
  try{const d=JSON.parse(LS.g(KEY+'mk_last',''));if(d&&d.items){d.__cached=true;renderMarket(d)}}catch(e){}
}
function marketEmpty(){
  if(haveData)return;
  $('#qgrid').style.display='block';
  $('#qgrid').innerHTML='<p class="note">Market data unavailable: both the Worker and the fallback file failed. Open the Worker\u2019s /health URL to check it.</p>';
  $('#fbody').innerHTML='<p class="note">\u2014</p>';
}
async function fetchMarket(){
  if(window.__MK0){const p=window.__MK0;window.__MK0=null;const d=await p;if(d&&d.items)return d}
  try{
    const r=await fetch(WORKER_URL,{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    if(!d.items)throw new Error('bad payload');
    return d;
  }catch(e){
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    return r.json();
  }
}
async function loadMarket(){
  if(loading)return null;loading=true;
  try{const d=await fetchMarket();$('#qgrid').style.display='';refreshFailed=false;renderMarket(d);return d}
  catch(e){refreshFailed=true;marketEmpty();paintStamp();return null}
  finally{loading=false}
}
async function manualRefresh(){
  if(busy)return;busy=true;
  const b=$('#mrefresh');b.classList.add('spin');paintStamp('checking\u2026');
  try{await loadMarket();await sleep(2500);await loadMarket()} /* second pass picks up the Worker's background refresh */
  finally{b.classList.remove('spin');busy=false;paintStamp()}
}
$('#mrefresh').onclick=manualRefresh;
setInterval(()=>{if(!document.hidden)loadMarket()},60000);
setInterval(()=>{if(!busy)paintStamp()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMarket()});

/* ---- widget loaders ---- */
let sym=LS.g(KEY+'sym',DEFAULTS.ticker);
const once={};
const load=(src,id,sid)=>once[id]||(once[id]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;if(sid)s.id=sid;s.onload=ok;s.onerror=no;document.head.appendChild(s)}));
const note=(el,h)=>{el.innerHTML='<p class="note">'+h+'</p>'};
const frame=(el,src,title)=>{el.innerHTML='';const f=document.createElement('iframe');f.src=src;f.title=title;f.loading='lazy';el.appendChild(f)};
const tv=(name,cfg)=>el=>{
  el.innerHTML='<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  const s=document.createElement('script');
  s.src='https://s3.tradingview.com/external-embedding/embed-widget-'+name+'.js';s.async=true;
  s.text=JSON.stringify({width:'100%',height:'100%',locale:'en',isTransparent:true,colorTheme:dark()?'dark':'light',...(typeof cfg=='function'?cfg():cfg)});
  el.firstChild.appendChild(s);
};
const fin=el=>{
  el.innerHTML='<div class="fin"><div id="finlogix-box"></div></div>';
  load('https://widget.finlogix.com/Widget.js','fin').then(()=>Widget.init({widgetId:FINLOGIX_ID,type:'EconomicCalendar',language:'en',isAdaptive:true,renderDocumentId:'finlogix-box'}))
    .catch(()=>note(el,'Finlogix did not load. Try another source.'));
};
const fj=el=>{
  el.innerHTML='<div id="financialjuice-news-widget-container"></div>';
  load('https://feed.financialjuice.com/widgets/widgets.js?r='+Math.floor(Math.random()*9999),'fj','FJ-Widgets').then(()=>{
    const d=dark();
    new window.FJWidgets.createWidget({container:'financialjuice-news-widget-container',mode:d?'Dark':'Light',width:'100%',height:el.clientHeight+'px',backColor:d?'1c1c1f':'f3f2ef',fontColor:d?'b7b5ad':'615f5a',widgetType:'NEWS'});
  }).catch(()=>note(el,'FinancialJuice did not load. Try another source.'));
};
const pair=(left,cls)=>el=>{
  el.innerHTML='<div class="stk"><div class="s1 '+cls+'"></div><div class="s2"></div></div>';
  left($('.s1',el));
  tv('mini-symbol-overview',()=>({symbol:sym,dateRange:'3M',autosize:true,largeChartUrl:''}))($('.s2',el));
};
const overview=pair(tv('symbol-info',()=>({symbol:sym})),'ov');
const technicals=pair(tv('technical-analysis',()=>({symbol:sym,interval:'1D',showIntervalTabs:true})),'ta');

const heat=ds=>tv('stock-heatmap',{dataSource:ds,exchanges:[],grouping:'sector',blockSize:'market_cap_basic',blockColor:'change',symbolUrl:'',hasTopBar:false,isDataSetEnabled:false,isZoomEnabled:true,hasSymbolTooltip:true,isMonoSize:false});

/* ---- cards ---- */
const C={
  econ:{page:'news',t:'economic calendar',sp:7,h:500,hm:460,full:1100,fullm:1000,src:{
    fin:{l:'Finlogix',u:'https://www.finlogix.com/calendar',r:fin},
    tv:{l:'TradingView',u:'https://www.tradingview.com/economic-calendar/',r:tv('events',{importanceFilter:'1',countryFilter:'us'})}}},
  news:{page:'news',t:'news',sp:5,h:500,hm:460,full:1100,fullm:1000,src:{
    fj:{l:'FinancialJuice',u:'https://www.financialjuice.com/home',r:fj},
    tv:{l:'TradingView',u:'https://www.tradingview.com/news/',r:tv('timeline',{feedMode:'market',market:'stock',displayMode:'regular'})}}},
  earn:{page:'tech',t:'earnings calendar',sp:12,h:640,hm:520,full:1150,fullm:1900,src:{
    eh:{l:'Earnings Hub',u:'https://earningshub.com/earnings-calendar/this-week',r:el=>frame(el,'https://earningshub.com/embed/calendar?theme='+(dark()?'dark':'light')+'&calendarView=week&filter=popular','Earnings Hub calendar')}}},
  look:{page:'tech',t:'ticker lookup',sp:12,h:460,hm:780,full:600,fullm:900,tb:true,src:{
    ov:{l:'Overview',u:()=>'https://www.tradingview.com/symbols/'+sym+'/',r:overview},
    ta:{l:'Technicals',u:()=>'https://www.tradingview.com/symbols/'+sym+'/technicals/',r:technicals}}},
  heat:{page:'heat',t:'market heatmap',sp:12,h:680,hm:560,full:900,fullm:800,src:{
    sp:{l:'S&P 500',u:'https://www.tradingview.com/heatmap/stock/',r:heat('SPX500')},
    nq:{l:'Nasdaq 100',u:'https://www.tradingview.com/heatmap/stock/',r:heat('NASDAQ100')}}}
};
const PAGES={news:$('#p-news'),tech:$('#p-tech'),heat:$('#p-heat')};
const estUrl=()=>'https://www.estimize.com/'+encodeURIComponent(sym.toLowerCase());
for(const k in C){
  const c=C[k],s=document.createElement('section');
  s.className='card';s.id=k;s.style.setProperty('--sp',c.sp);s.style.setProperty('--h',c.h+'px');s.style.setProperty('--hm',c.hm+'px');s.style.setProperty('--full',c.full+'px');s.style.setProperty('--fullm',c.fullm+'px');
  const keys=Object.keys(c.src);
  s.innerHTML='<div class="ch"><span class="plbl">'+c.t+'</span>'
    +(keys.length>1?'<div class="seg">'+keys.map(i=>'<button class="pbtn" data-s="'+i+'">'+c.src[i].l+'</button>').join('')+'</div>':'')
    +'<div class="acts"><button class="topicon" data-a="r" aria-label="refresh" data-tt="refresh">'+I.refresh+'</button><button class="topicon" data-a="o" aria-label="open source" data-tt="open source">'+I.open+'</button>'
    +'<button class="topicon" data-a="f" aria-label="expand" data-tt="expand to full height">'+I.expand+'</button><button class="topicon" data-a="c" aria-label="collapse" data-tt="collapse (or double-click the header)">'+I.fold+'</button></div></div>'
    +(c.tb?'<form class="tb"><input aria-label="ticker" maxlength="10" autocomplete="off" spellcheck="false" value="'+sym+'"><button class="btn">look up</button><a class="btn" id="est" target="_blank" rel="noopener" href="'+estUrl()+'">estimize '+I.open+'</a></form>':'')
    +'<div class="body"></div>';
  PAGES[c.page].appendChild(s);c.el=s;c.th=null;
  const sv=LS.g(KEY+'src_'+k,DEFAULTS[k]);c.cur=c.src[sv]?sv:(c.src[DEFAULTS[k]]?DEFAULTS[k]:keys[0]);
  if(LS.g(KEY+'closed_'+k)==='1')s.classList.add('closed');
}
function draw(k){
  const c=C[k],body=$('.body',c.el);
  c.el.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('on',b.dataset.s===c.cur));
  if(c.el.classList.contains('closed'))return;
  try{c.src[c.cur].r(body);c.th=dark()}catch(e){note(body,'This widget failed to load.')}
}
let tab=LS.g(KEY+'tab',DEFAULTS.tab);if(!PAGES[tab])tab='news';
function showPage(p){
  tab=p;LS.s(KEY+'tab',p);
  for(const i in PAGES)PAGES[i].hidden=i!==p;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  for(const k in C)if(C[k].page===p&&C[k].th!==dark()&&!C[k].el.classList.contains('closed'))draw(k);
}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)showPage(b.dataset.p)});
function paintCard(k){
  const c=C[k],cl=c.el.classList.contains('closed'),tl=c.el.classList.contains('tall');
  const f=$('[data-a="f"]',c.el),x=$('[data-a="c"]',c.el);
  f.setAttribute('data-tt',tl?'back to normal size':'expand to full height');
  x.setAttribute('data-tt',cl?'open (or double-click the header)':'collapse (or double-click the header)');
}
function setClosed(k,closed){
  const c=C[k];c.el.classList.toggle('closed',closed);if(closed)c.el.classList.remove('tall');
  LS.s(KEY+'closed_'+k,closed?'1':'0');paintCard(k);if(!closed)draw(k);
}
function setTall(k,tall){
  const c=C[k];if(tall&&c.el.classList.contains('closed'))setClosed(k,false);
  c.el.classList.toggle('tall',tall);paintCard(k);
  if(c.cur==='fj')draw(k);
  if(tall&&c.el.scrollIntoView)c.el.scrollIntoView({block:'start',behavior:'smooth'});
}
document.addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card||!C[card.id])return;
  const k=card.id,c=C[k],sb=e.target.closest('[data-s]'),ab=e.target.closest('[data-a]');
  if(sb){c.cur=sb.dataset.s;LS.s(KEY+'src_'+k,c.cur);draw(k)}
  if(!ab)return;
  const a=ab.dataset.a;
  if(a==='r')draw(k);
  if(a==='o'){const u=c.src[c.cur].u;window.open(typeof u=='function'?u():u,'_blank','noopener')}
  if(a==='f')setTall(k,!card.classList.contains('tall'));
  if(a==='c')setClosed(k,!card.classList.contains('closed'));
});
document.addEventListener('dblclick',e=>{
  const ch=e.target.closest('.ch'),card=e.target.closest('.card');if(!ch||!card||!C[card.id])return;
  const b=e.target.closest('button,input,a');if(b&&!b.matches('[data-a="f"]'))return;
  setClosed(card.id,!card.classList.contains('closed'));
});
function resetPrefs(){
  try{Object.keys(localStorage).filter(k=>k.indexOf(KEY)===0).forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.reload();
}

/* ---- tooltips: one floating element on top of everything, mouse only, never on touch or mobile layout ---- */
const tipEl=document.createElement('div');tipEl.id='tt';document.body.appendChild(tipEl);
const canTip=()=>!root.classList.contains('mobile')&&matchMedia('(hover:hover)').matches;
function tipShow(el){
  const t=el.getAttribute('data-tt');if(!t||!canTip())return;
  tipEl.textContent=t;tipEl.style.transform='translate(0,0)';
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  const x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8));
  let y=r.top-h-8;if(y<8)y=r.bottom+8;
  tipEl.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';tipEl.style.opacity='1';
}
const tipHide=()=>{tipEl.style.opacity='0'};
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tt]');if(el)tipShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tt]'))tipHide()});
document.addEventListener('pointerdown',tipHide);
document.addEventListener('scroll',tipHide,true);
$('.tb').addEventListener('submit',e=>{
  e.preventDefault();
  const i=$('.tb input'),v=i.value.toUpperCase().replace(/[^A-Z0-9.:\-]/g,'');
  if(!v)return;sym=v;i.value=v;LS.s(KEY+'sym',v);$('#est').href=estUrl();draw('look');
});

paintTheme();applyLayout();paintCached();showPage(tab);for(const k in C)paintCard(k);loadMarket();
</script>
</body>
</html>
